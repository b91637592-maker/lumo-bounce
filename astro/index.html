<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ASTRO LUMO — Jump & Shoot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#frame{position:relative;width:min(100vw,420px);height:min(100vh,100dvh);background:#000;overflow:hidden}
@media(min-width:440px){#frame{border-radius:16px;max-height:min(96vh,900px);height:min(96vh,900px);box-shadow:0 0 60px #3af3}}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#badge{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;background:#ff2d6a;color:#fff;font:800 11px/1 system-ui;padding:6px 10px;border-radius:999px;letter-spacing:.04em;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="frame">
<div id="badge">ASTRO LUMO v2 · ESPACE</div>
<canvas id="c"></canvas>
</div></div>
<script>
(() => {
"use strict";
const VERSION = "astro-lumo-v2-20260911";
console.log(VERSION);

const C = {
  W:390, gravity:-880, r:24, hSpeed:460, maxH:560, tilt:0.28,
  jump:720, jumpB:1120, jumpS:1480, wrap:26, camLag:0.14, cull:240,
  platH:18, minW:72, maxW:128, baseSp:92, minSp:52, maxSp:150, ahead:1000,
  moveSp:90, disDelay:0.5, coinR:12, coinV:12, powerS:30,
  coinCh:0.3, powerCh:0.08, monCh:0.55, bulletSp:920, bulletR:6, cd:0.14,
  BEST:"astroLumoBest", WALLET:"astroLumoWallet", OWNED:"astroLumoOwned",
  EQUIP:"astroLumoEquip", ROCK:"astroLumoRockets", EXTRA:"astroLumoExtras",
  SOUND:"astroLumoSound", CTRL:"astroLumoCtrl"
};

const PHASES = [
  { id:"atmo", name:"ATMOSPHÈRE", from:0, top:"#5ba3ff", mid:"#8ec7ff", bot:"#d4ecff", stars:0.05 },
  { id:"strat", name:"STRATOSPHÈRE", from:600, top:"#2a4a9a", mid:"#3d6bb8", bot:"#6a9ad4", stars:0.35 },
  { id:"orbit", name:"ORBITE", from:1400, top:"#0c1238", mid:"#1a2860", bot:"#243070", stars:0.75 },
  { id:"nebula", name:"NÉBULEUSE", from:2600, top:"#2a0850", mid:"#4a1878", bot:"#1a0840", stars:0.9, nebula:true },
  { id:"void", name:"VIDE PROFOND", from:4200, top:"#050208", mid:"#0a0418", bot:"#000", stars:1, void:true },
];

const SKINS = [
  { id:"classic", name:"Astro Blanc", price:0, suit:"#eef3ff", visor:"#39d7ff", pack:"#6a758c" },
  { id:"neon", name:"Astro Néon", price:80, suit:"#3dffc0", visor:"#9ff", pack:"#0a5" },
  { id:"red", name:"Astro Mars", price:140, suit:"#ff6b4a", visor:"#ffd36a", pack:"#802010" },
  { id:"gold", name:"Astro Or", price:280, suit:"#ffd76a", visor:"#fff2b0", pack:"#a67c00" },
  { id:"void", name:"Astro Void", price:420, suit:"#2a1848", visor:"#ff66dd", pack:"#120820" },
];
const ROCKETS = [
  { id:"mini", name:"Fusée mini", price:35, desc:"Boost 2.5s", dur:2.5, thrust:900 },
  { id:"super", name:"Fusée turbo", price:85, desc:"Boost 4.5s", dur:4.5, thrust:1100 },
  { id:"mega", name:"Fusée orbital", price:170, desc:"Boost 6.5s", dur:6.5, thrust:1300 },
];
const EXTRAS = [
  { id:"shield", name:"Bouclier", price:55, desc:"Départ protégé" },
  { id:"lucky", name:"Multi-pièces", price:95, desc:"+50% pièces" },
  { id:"slow", name:"Ralentisseur", price:65, desc:"Aliens + plats lents" },
  { id:"revive", name:"2e chance", price:140, desc:"1 revive" },
];

const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
let W=C.W,H=700,dpr=1;
function resize(){
  const fr=document.getElementById("frame").getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1,2.5);
  W=C.W; H=Math.max(560,Math.min(980,Math.round(C.W*(fr.height/Math.max(1,fr.width)))));
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); resize();

function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(_){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(_){} }
function lsJSON(k,d){ try{ return JSON.parse(lsGet(k, JSON.stringify(d))); }catch(_){ return d; } }
const getBest=()=>+lsGet(C.BEST,0)||0, setBest=n=>lsSet(C.BEST,n);
const getWallet=()=>+lsGet(C.WALLET,0)||0, setWallet=n=>lsSet(C.WALLET,Math.max(0,n|0));
const addWallet=n=>{ setWallet(getWallet()+n); return getWallet(); };
const getOwned=()=>{ const o=lsJSON(C.OWNED,["classic"]); if(!o.includes("classic"))o.push("classic"); return o; };
const setOwned=a=>lsSet(C.OWNED,JSON.stringify(a));
const owns=id=>getOwned().includes(id);
const getEquip=()=>lsJSON(C.EQUIP,{skin:"classic"});
const setEquip=o=>lsSet(C.EQUIP,JSON.stringify(o));
const getSkin=()=>SKINS.find(s=>s.id===(getEquip().skin||"classic"))||SKINS[0];
const getRockets=()=>lsJSON(C.ROCK,{});
const setRockets=o=>lsSet(C.ROCK,JSON.stringify(o));
const rockN=id=>getRockets()[id]||0;
const addRock=(id,n)=>{ const o=getRockets(); o[id]=(o[id]||0)+n; if(o[id]<=0)delete o[id]; setRockets(o); };
const getExtras=()=>lsJSON(C.EXTRA,{});
const setExtras=o=>lsSet(C.EXTRA,JSON.stringify(o));
const extraN=id=>getExtras()[id]||0;
const addExtra=(id,n)=>{ const o=getExtras(); o[id]=(o[id]||0)+n; if(o[id]<=0)delete o[id]; setExtras(o); };
let soundOn=lsGet(C.SOUND,"1")==="1";
const getCtrl=()=>lsGet(C.CTRL,"touch");
const setCtrl=m=>lsSet(C.CTRL,m);

let actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (AudioContext||webkitAudioContext)(); }catch(_){}} if(actx&&actx.state==="suspended")actx.resume(); }
function beep(f,d,t,v,to){
  if(!soundOn)return; ensureAudio(); if(!actx)return;
  const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=t||"square"; o.frequency.setValueAtTime(f,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+d);
  g.gain.setValueAtTime(v||0.1,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+0.02);
}
const SFX={
  jump:()=>beep(300,.07,"triangle",.1,520),
  shoot:()=>beep(880,.05,"square",.08,300),
  hit:()=>beep(120,.1,"sawtooth",.1,40),
  coin:()=>{beep(900,.05,"sine",.1);setTimeout(()=>beep(1200,.07,"sine",.08),40);},
  die:()=>beep(180,.35,"sawtooth",.12,40),
  btn:()=>beep(520,.04,"sine",.07),
  power:()=>beep(440,.1,"sawtooth",.08,800),
};

let buttons=[];
const clearBtns=()=>buttons=[];
const addBtn=(id,x,y,w,h)=>buttons.push({id,x,y,w,h});
function hitUI(x,y){ for(let i=buttons.length-1;i>=0;i--){ const b=buttons[i]; if(x>=b.x-b.w/2&&x<=b.x+b.w/2&&y>=b.y-b.h/2&&y<=b.y+b.h/2)return b.id;} return null; }

let state="menu", shopTab="skins", shopScroll=0, showBest=false;
let player, plats, coins, powers, mons, bullets, parts, stars;
let camY, maxCam, startY, score, runCoins, maxH, best, over, overT, lastT=0, topY;
let powersActive={}, hint=1, banked=false, revive=false, coinMul=1, thrust=1000, fireCd=0;
let keys={}, pDown=false, pX=0, lastPX=null, hIn=0, ui=null;

function now(){ return performance.now()/1000; }
function has(t){ return powersActive[t]>now(); }
function phaseFor(h){
  let p=PHASES[0];
  for(const ph of PHASES) if(h>=ph.from) p=ph;
  return p;
}
function diff(h){ return Math.min(2.5, h/700*0.32); }

function mkPlayer(x,y){ return {x,y,vx:0,vy:0,r:C.r,alive:true,sx:1,sy:1,rot:0,sq:0}; }
function mkPlat(type,w,x,y){
  const p={type,w,h:C.platH,x,y,ox:x,on:true,a:1,spd:0,dir:1,range:0,dis:false,dt:0,pulse:Math.random()*6};
  if(type==="moving"){ p.spd=C.moveSp*(.7+Math.random()*.7); p.dir=Math.random()<.5?1:-1; p.range=45+Math.random()*70; }
  return p;
}
function mkMon(type,x,y){
  return {type,x,y,ox:x,r:type==="ufo"?22:type==="spike"?18:17, alive:true, hp:type==="ufo"?3:type==="spike"?2:1, ph:Math.random()*6, dir:Math.random()<.5?1:-1, spd:50+Math.random()*60};
}
function mkBullet(x,y){ return {x,y,vy:C.bulletSp,r:C.bulletR,alive:true,life:.9}; }

function pickPlat(d){
  const r=Math.random();
  if(r<.04*(1+d)) return "bonus";
  if(r<.12+d*.1) return "moving";
  if(r<.22+d*.1) return "disappear";
  if(r<.32+d*.05) return "bounce";
  return "normal";
}
function platW(d,t){ const sh=Math.min(.45,d*.2); let w=C.minW*(1-sh*.5)+Math.random()*Math.max(12,C.maxW*(1-sh)-C.minW); if(t==="bonus")w=Math.max(w,105); return w; }
function space(d){ return Math.max(C.minSp, C.baseSp+Math.min(C.maxSp-C.baseSp,d*38)+(-10+Math.random()*28)); }
function monType(d){ if(d>1.1&&Math.random()<.28)return "ufo"; if(d>.4&&Math.random()<.45)return "spike"; return "blob"; }

function spawnRow(y,d){
  const t=pickPlat(d), w=platW(d,t), x=40+Math.random()*(W-80);
  plats.push(mkPlat(t,w,x,y));
  if(Math.random()<C.coinCh) coins.push({x:x-20+Math.random()*40,y:y+30,r:C.coinR,v:C.coinV,alive:true,ph:Math.random()*6});
  if(Math.random()<C.powerCh*(.5+d*.5)){
    const types=["jet","super","shield","magnet","slow"];
    powers.push({type:types[(Math.random()*types.length)|0],x:Math.min(W-30,Math.max(30,x-40+Math.random()*80)),y:y+42,s:C.powerS,alive:true,ph:Math.random()*6});
  }
  // Monsters early and often
  if(y>startY+180 && Math.random()<C.monCh*(.55+d*.5)){
    mons.push(mkMon(monType(d), Math.min(W-28,Math.max(28,x-70+Math.random()*140)), y+58+Math.random()*40));
  }
}

function burst(x,y,col,n){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=90+Math.random()*200;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.4+Math.random()*.3,max:.55,col,r:2+Math.random()*3}); }
}

function tryShoot(){
  if(state!=="playing"||!player||!player.alive||fireCd>0)return;
  fireCd=C.cd;
  bullets.push(mkBullet(player.x, player.y+player.r));
  // muzzle flash particles
  burst(player.x, player.y+player.r, "#7ef", 4);
  SFX.shoot();
}

function startGame(){
  startY=130; player=mkPlayer(W/2, startY+C.r+C.platH);
  score=0; runCoins=0; maxH=0; best=getBest(); over=false; overT=0; hint=1; banked=false;
  revive=false; coinMul=1; thrust=1000; fireCd=0; powersActive={}; parts=[];
  camY=H/2; maxCam=camY;
  plats=[]; coins=[]; powers=[]; mons=[]; bullets=[];
  plats.push(mkPlat("normal",140,W/2,startY));
  topY=startY; let y=startY+C.baseSp;
  for(let i=0;i<14;i++){ spawnRow(y,0); y+=space(0);} topY=y;
  // force a few monsters near start so player SEES them
  mons.push(mkMon("blob", W*0.3, startY+280));
  mons.push(mkMon("spike", W*0.7, startY+420));
  mons.push(mkMon("ufo", W*0.5, startY+620));

  const stock=getRockets();
  for(const id of ["mega","super","mini"]){
    if((stock[id]||0)>0){ addRock(id,-1); const r=ROCKETS.find(x=>x.id===id); powersActive.jet=now()+r.dur; thrust=r.thrust; break; }
  }
  if(extraN("shield")>0){ addExtra("shield",-1); powersActive.shield=now()+9; }
  if(extraN("lucky")>0){ addExtra("lucky",-1); coinMul=1.5; }
  if(extraN("slow")>0){ addExtra("slow",-1); powersActive.slow=now()+8; }
  if(extraN("revive")>0){ addExtra("revive",-1); revive=true; }

  player.vy=C.jump*.9; SFX.jump(); state="playing"; lastT=0;
}

function gameOver(){
  if(over)return; over=true; player.alive=false; SFX.die();
  if(score>getBest()){ setBest(score); best=score; }
  else best=getBest();
  if(!banked){ addWallet(runCoins); banked=true; }
  overT=.65;
}

function bounce(imp){ player.vy=imp; player.sq=.2; player.sx=1.28; player.sy=.72; SFX.jump(); }

function land(p){
  if(!p.on)return 0;
  let imp=C.jump;
  if(has("super")) imp=C.jumpS;
  else if(p.type==="bounce"){ imp=C.jumpB; p.sy=.5; }
  else if(p.type==="bonus"){ imp=C.jump*1.25; runCoins+=25; burst(p.x,p.y,"#ffd24a",8); }
  if(p.type==="disappear"&&!p.dis){ p.dis=true; p.dt=C.disDelay; }
  return imp;
}

function handleUI(id){
  SFX.btn(); ensureAudio();
  if(id.startsWith("bs_")){ const s=SKINS.find(x=>x.id===id.slice(3)); if(s&&!owns(s.id)&&getWallet()>=s.price){ setWallet(getWallet()-s.price); const o=getOwned(); o.push(s.id); setOwned(o); const e=getEquip(); e.skin=s.id; setEquip(e);} return; }
  if(id.startsWith("es_")){ if(owns(id.slice(3))){ const e=getEquip(); e.skin=id.slice(3); setEquip(e);} return; }
  if(id.startsWith("br_")){ const r=ROCKETS.find(x=>x.id===id.slice(3)); if(r&&getWallet()>=r.price){ setWallet(getWallet()-r.price); addRock(r.id,1);} return; }
  if(id.startsWith("be_")){ const e=EXTRAS.find(x=>x.id===id.slice(3)); if(e&&getWallet()>=e.price){ setWallet(getWallet()-e.price); addExtra(e.id,1);} return; }
  if(id==="play") startGame();
  else if(id==="shop"){ state="shop"; shopTab="skins"; shopScroll=0; }
  else if(id==="settings") state="settings";
  else if(id==="back"){ state="menu"; showBest=false; }
  else if(id==="best") showBest=!showBest;
  else if(id==="tab_skins"){ shopTab="skins"; shopScroll=0; }
  else if(id==="tab_rock"){ shopTab="rockets"; shopScroll=0; }
  else if(id==="tab_ext"){ shopTab="extras"; shopScroll=0; }
  else if(id==="up") shopScroll=Math.max(0,shopScroll-1);
  else if(id==="dn") shopScroll=Math.min(20,shopScroll+1);
  else if(id==="sound"){ soundOn=!soundOn; lsSet(C.SOUND,soundOn?"1":"0"); }
  else if(id==="c_touch") setCtrl("touch");
  else if(id==="c_follow") setCtrl("follow");
  else if(id==="c_keys") setCtrl("keys");
  else if(id==="pause"){ if(state==="playing") state="paused"; }
  else if(id==="resume"){ state="playing"; lastT=0; }
  else if(id==="restart"||id==="replay") startGame();
  else if(id==="menu") state="menu";
}

function pos(e){
  const r=canvas.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H};
}
function onDown(e){
  ensureAudio(); e.preventDefault();
  const p=pos(e); pDown=true; pX=p.x; lastPX=p.x; ui=hitUI(p.x,p.y);
  if(!ui && state==="playing"){ steer(p.x,true); tryShoot(); }
}
function onMove(e){
  if(!pDown)return; e.preventDefault();
  const p=pos(e); pX=p.x;
  if(!ui && state==="playing") steer(p.x,false);
  lastPX=p.x;
}
function onUp(e){
  e.preventDefault();
  let p;
  if(e.changedTouches){ const r=canvas.getBoundingClientRect(); const t=e.changedTouches[0]; p={x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H}; }
  else p=pos(e);
  if(ui){ const h=hitUI(p.x,p.y); if(h&&h===ui) handleUI(h); }
  pDown=false; lastPX=null; ui=null;
}
canvas.addEventListener("mousedown",onDown);
canvas.addEventListener("mousemove",onMove);
addEventListener("mouseup",onUp);
canvas.addEventListener("touchstart",onDown,{passive:false});
canvas.addEventListener("touchmove",onMove,{passive:false});
canvas.addEventListener("touchend",onUp,{passive:false});
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Escape"){ if(state==="playing")state="paused"; else if(state==="paused"){state="playing";lastT=0;} }
  if(e.code==="Space"&&state==="playing"){ e.preventDefault(); tryShoot(); }
  if(["ArrowLeft","ArrowRight","Space","KeyA","KeyD"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);

function steer(x,start){
  const mode=getCtrl();
  if(mode==="keys")return;
  if(mode==="follow"){ hIn=Math.max(-1,Math.min(1,((x/W)*2-1)*1.2)); return; }
  const n=(x/W)*2-1;
  let d=0; if(lastPX!=null&&!start) d=Math.max(-1,Math.min(1,(x-lastPX)/16));
  hIn=Math.max(-1,Math.min(1,n*.85+d*.4));
}
function poll(dt){
  let k=0; if(keys.ArrowLeft||keys.KeyA)k-=1; if(keys.ArrowRight||keys.KeyD)k+=1;
  const mode=getCtrl();
  if(mode==="keys") hIn=k;
  else if(k) hIn=k;
  else if(!pDown){ hIn*=Math.pow(.02,dt); if(Math.abs(hIn)<.02)hIn=0; }
}

function initStars(){
  stars=[];
  for(let i=0;i<110;i++) stars.push({x:Math.random()*W, y:Math.random()*8000, r:.4+Math.random()*2.2, a:.25+Math.random()*.75, tw:Math.random()*6});
}
initStars();

function update(dt){
  poll(dt); if(fireCd>0) fireCd-=dt;
  for(const k of Object.keys(powersActive)) if(powersActive[k]<=now()) delete powersActive[k];

  const tgt=hIn*C.hSpeed;
  player.vx+=(tgt-player.vx)*Math.min(1,dt*12);
  player.vx=Math.max(-C.maxH,Math.min(C.maxH,player.vx));
  player.rot+=((-hIn*C.tilt)-player.rot)*Math.min(1,dt*10);

  if(player.sq>0){ player.sq-=dt; const t=1-player.sq/.2;
    if(t>.35&&t<.65){ player.sx+=(0.9-player.sx)*.4; player.sy+=(1.2-player.sy)*.4; }
    else if(t>=.65){ player.sx+=(1-player.sx)*.35; player.sy+=(1-player.sy)*.35; }
  } else {
    const sy=1+Math.max(-.15,Math.min(.22,player.vy/2000));
    const sx=1/Math.sqrt(Math.max(.7,sy));
    player.sx+=(sx-player.sx)*Math.min(1,dt*14);
    player.sy+=(sy-player.sy)*Math.min(1,dt*14);
  }

  player.vy+=C.gravity*dt;
  if(has("jet")&&player.alive){ player.vy=Math.max(player.vy,thrust*.55); player.vy+=thrust*.55*dt; }
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  if(player.x<-C.wrap)player.x=W+C.wrap; else if(player.x>W+C.wrap)player.x=-C.wrap;

  if(player.alive&&player.vy<=90){
    const bottom=player.y-player.r*.7;
    for(const p of plats){
      if(!p.on||p.a<.3)continue;
      if(player.x<p.x-p.w*.48||player.x>p.x+p.w*.48)continue;
      const top=p.y+p.h*.35;
      if(bottom>=top-18&&bottom<=top+14){
        const imp=land(p); if(imp>0){ player.y=top+player.r*.7; bounce(imp); } break;
      }
    }
  }

  for(const c of coins){
    if(!c.alive)continue;
    const dx=c.x-player.x, dy=c.y-player.y, dist=Math.hypot(dx,dy);
    if(has("magnet")&&dist<170&&dist>.1){ c.x-=dx/dist*540*dt; c.y-=dy/dist*540*dt; }
    if(Math.hypot(c.x-player.x,c.y-player.y)<player.r+c.r){
      c.alive=false; runCoins+=Math.round(c.v*coinMul); recompute(); SFX.coin(); burst(c.x,c.y,"#ffd24a",6);
    }
  }
  for(const pw of powers){
    if(!pw.alive)continue;
    if(Math.hypot(pw.x-player.x,pw.y-player.y)<player.r+pw.s*.45){
      pw.alive=false;
      const map={jet:3.5,super:8,shield:10,magnet:7,slow:6};
      powersActive[pw.type]=now()+(map[pw.type]||5); SFX.power(); burst(pw.x,pw.y,"#9ef",8);
    }
  }

  for(const b of bullets){ if(!b.alive)continue; b.y+=b.vy*dt; b.life-=dt; if(b.y>camY+H||b.life<=0)b.alive=false; }

  const slow=has("slow");
  for(const m of mons){
    if(!m.alive)continue;
    m.ph+=dt*3;
    if(m.type==="blob"){ m.x=m.ox+Math.sin(m.ph)*40; }
    else if(m.type==="spike"){ m.x+=m.dir*m.spd*(slow?.35:1)*dt; if(m.x<26||m.x>W-26)m.dir*=-1; }
    else { m.x+=m.dir*m.spd*.75*(slow?.35:1)*dt; m.y+=Math.sin(m.ph)*18*dt; if(m.x<30||m.x>W-30)m.dir*=-1; }

    for(const b of bullets){
      if(!b.alive||!m.alive)continue;
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+b.r){
        b.alive=false; m.hp--; SFX.hit(); burst(m.x,m.y,"#ff6688",6);
        if(m.hp<=0){ m.alive=false; runCoins+=m.type==="ufo"?35:m.type==="spike"?22:14; recompute(); burst(m.x,m.y,"#ffd24a",14); }
      }
    }
    if(player.alive&&Math.hypot(m.x-player.x,m.y-player.y)<m.r+player.r*.8){
      if(has("shield")){ delete powersActive.shield; m.alive=false; burst(m.x,m.y,"#4df",10); }
      else if(revive){ revive=false; player.y=camY-H*.15; bounce(C.jump*1.3); m.alive=false; }
      else gameOver();
    }
  }

  for(const p of plats){
    p.pulse+=dt*3;
    if(p.type==="moving"&&p.on){ p.x+=p.dir*p.spd*(slow?.35:1)*dt; if(Math.abs(p.x-p.ox)>=p.range){ p.dir*=-1; p.x=p.ox+p.dir*p.range*.98; } }
    if(p.dis&&p.on){ p.dt-=dt; p.a=.3+.7*Math.abs(Math.sin(p.dt*40)); if(p.dt<=0){ p.a-=dt*5; if(p.a<=0){p.on=false;p.a=0;} } }
  }

  const follow=player.y+H*.15; if(follow>maxCam)maxCam=follow;
  camY+=(Math.max(H/2,maxCam)-camY)*Math.min(1,C.camLag*60*dt);
  const d=diff(Math.max(0,camY));
  while(topY<camY+C.ahead){ topY+=space(d); spawnRow(topY,d); }
  const cull=camY-H/2-C.cull;
  plats=plats.filter(p=>p.y>=cull&&(p.on||p.a>0));
  coins=coins.filter(c=>c.alive&&c.y>=cull);
  powers=powers.filter(p=>p.alive&&p.y>=cull);
  mons=mons.filter(m=>m.alive&&m.y>=cull-50);
  bullets=bullets.filter(b=>b.alive);

  const h=Math.max(0,player.y-startY); if(h>maxH)maxH=h; recompute();
  const kill=camY-H/2-40;
  if(player.alive&&player.y<kill){
    if(has("shield")){ delete powersActive.shield; player.y=camY-H*.2; bounce(C.jump*1.1); }
    else if(revive){ revive=false; player.y=camY-H*.15; bounce(C.jump*1.25); }
    else gameOver();
  }
  if(!player.alive){ player.rot+=dt*10; player.sx=Math.max(.05,player.sx-dt*1.5); player.sy=Math.max(.05,player.sy-dt*1.5); overT-=dt; if(overT<=0) state="gameover"; }
  hint=Math.max(0,hint-dt*.2);
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=220*dt; }
  parts=parts.filter(p=>p.life>0);
}
function recompute(){ score=Math.floor(maxH*.1)+runCoins; }

function rr(x,y,w,h,r){ const R=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+R,y); ctx.arcTo(x+w,y,x+w,y+h,R); ctx.arcTo(x+w,y+h,x,y+h,R); ctx.arcTo(x,y+h,x,y,R); ctx.arcTo(x,y,x+w,y,R); ctx.closePath(); }
function w2s(y){ return H/2-(y-camY); }

function drawBG(){
  const h=(state==="playing"||state==="paused"||state==="gameover")?maxH:800;
  const ph=phaseFor(h);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,ph.top); g.addColorStop(.55,ph.mid); g.addColorStop(1,ph.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Earth curve in atmosphere
  if(ph.id==="atmo"||ph.id==="strat"){
    ctx.save();
    ctx.globalAlpha=ph.id==="atmo"?0.9:0.35;
    ctx.fillStyle="#2d8a4a";
    ctx.beginPath(); ctx.ellipse(W/2, H+90, W*.85, 140, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle="#3aa0ff";
    ctx.beginPath(); ctx.ellipse(W/2, H+100, W*.9, 120, 0, Math.PI, 0); ctx.fill();
    ctx.restore();
  }
  // stars
  for(const s of stars){
    const sy=((s.y-camY*.2)%(H+50)+H+50)%(H+50)-25;
    const tw=.5+.5*Math.sin(performance.now()/350+s.tw);
    ctx.globalAlpha=ph.stars*s.a*tw;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,sy,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(ph.nebula){
    ctx.globalAlpha=.18;
    ctx.fillStyle="#ff44aa"; ctx.beginPath(); ctx.ellipse(W*.28,H*.3,110,45,.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#44ddff"; ctx.beginPath(); ctx.ellipse(W*.72,H*.45,90,35,-.3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(ph.void){
    const rg=ctx.createRadialGradient(W/2,H*.22,8,W/2,H*.22,140);
    rg.addColorStop(0,"rgba(140,40,200,.35)"); rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
}

function drawAstro(x,y,sc,rot,skin,opt){
  opt=opt||{};
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(sc||1,(opt.sy||sc||1));
  if(opt.alpha!=null) ctx.globalAlpha=opt.alpha;

  // BIG jet flames
  if(opt.jet){
    const f=.7+.3*Math.sin(performance.now()/40);
    ctx.globalAlpha=f*(opt.alpha??1);
    ctx.fillStyle="#ff5a20"; rr(-8,16,16,22,5); ctx.fill();
    ctx.fillStyle="#ffe066"; rr(-5,26,10,14,4); ctx.fill();
    ctx.globalAlpha=opt.alpha??1;
  }

  // backpack tanks
  ctx.fillStyle=skin.pack; rr(-18,-4,12,22,4); ctx.fill(); rr(6,-4,12,22,4); ctx.fill();
  ctx.fillStyle="#9ab"; rr(-15,2,6,8,2); ctx.fill(); rr(9,2,6,8,2); ctx.fill();

  // body
  ctx.beginPath(); ctx.arc(0,4,17,0,Math.PI*2); ctx.fillStyle=skin.suit; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.stroke();

  // helmet dome — unmistakable astronaut
  ctx.beginPath(); ctx.arc(0,-8,16,0,Math.PI*2); ctx.fillStyle=skin.suit; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=2.5; ctx.stroke();

  // visor glass
  rr(-10,-15,20,14,7);
  const vg=ctx.createLinearGradient(-10,-15,10,0);
  vg.addColorStop(0,skin.visor); vg.addColorStop(.55,"#e8ffff"); vg.addColorStop(1,skin.visor);
  ctx.fillStyle=vg; ctx.fill();
  ctx.strokeStyle="rgba(0,20,40,.35)"; ctx.lineWidth=1.5; ctx.stroke();

  // antenna
  ctx.strokeStyle=skin.pack; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(10,-18); ctx.lineTo(16,-28); ctx.stroke();
  ctx.fillStyle="#f36"; ctx.beginPath(); ctx.arc(16,-28,3,0,Math.PI*2); ctx.fill();

  // boots
  ctx.fillStyle=skin.pack; rr(-14,18,10,8,3); ctx.fill(); rr(4,18,10,8,3); ctx.fill();

  if(opt.shield){
    const pulse=.4+.5*(.5+.5*Math.sin(performance.now()/350));
    ctx.globalAlpha=pulse; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2);
    ctx.strokeStyle="#4df"; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle="rgba(80,220,255,.12)"; ctx.fill();
  }
  ctx.restore();
}

function drawPlat(p){
  const sy=w2s(p.y); if(sy<-40||sy>H+40)return;
  ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,sy);
  const cols={normal:"#7ecbff",moving:"#6a9fff",disappear:"#ff9a6a",bounce:"#d88cff",bonus:"#ffe066"};
  ctx.fillStyle="rgba(0,0,0,.3)"; rr(-p.w/2+2,-p.h/2+4,p.w,p.h,8); ctx.fill();
  ctx.fillStyle=cols[p.type]||"#7ecbff"; rr(-p.w/2,-p.h/2,p.w,p.h,8); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1.5; ctx.stroke();
  // metal rivets
  ctx.fillStyle="rgba(255,255,255,.5)";
  ctx.beginPath(); ctx.arc(-p.w*.35,0,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.w*.35,0,2,0,Math.PI*2); ctx.fill();
  if(p.type==="bonus"){ ctx.fillStyle="#fff"; ctx.font="bold 12px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★",0,1); }
  ctx.restore();
}

function drawMon(m){
  const sy=w2s(m.y); if(sy<-60||sy>H+60)return;
  ctx.save(); ctx.translate(m.x,sy);
  if(m.type==="blob"){
    // big green alien
    ctx.fillStyle="#5dff8a"; ctx.beginPath(); ctx.ellipse(0,0,m.r+2,m.r,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#0a5"; ctx.lineWidth=3; ctx.stroke();
    // eyes
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(-7,-4,6,8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-4,6,8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(-6,-3,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-3,3,0,Math.PI*2); ctx.fill();
    // mouth
    ctx.strokeStyle="#063"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,6,6,.1*Math.PI,.9*Math.PI); ctx.stroke();
  } else if(m.type==="spike"){
    ctx.fillStyle="#ff3d6e";
    ctx.beginPath();
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2-Math.PI/2; const rr=i%2?m.r*.5:m.r+8; (i?ctx.lineTo:ctx.moveTo).call(ctx,Math.cos(a)*rr,Math.sin(a)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="#220"; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  } else {
    // UFO — large saucer
    ctx.fillStyle="#c8d0e0"; ctx.beginPath(); ctx.ellipse(0,2,m.r+10,m.r*.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#6ef0ff"; ctx.beginPath(); ctx.ellipse(0,-6,m.r*.7,m.r*.55,0,Math.PI,0); ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle="#ffd24a";
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(i*9,4,2.5,0,Math.PI*2); ctx.fill(); }
    // beam hint
    ctx.globalAlpha=.15; ctx.fillStyle="#6ef"; ctx.beginPath(); ctx.moveTo(-10,8); ctx.lineTo(10,8); ctx.lineTo(18,40); ctx.lineTo(-18,40); ctx.fill();
    ctx.globalAlpha=1;
  }
  // HP pips
  if(m.hp>1){ ctx.fillStyle="#fff"; for(let i=0;i<m.hp;i++){ ctx.fillRect(-10+i*8,-m.r-12,6,4);} }
  ctx.restore();
}

function drawBullet(b){
  const sy=w2s(b.y); if(sy<-30||sy>H+30)return;
  // long bright laser
  const grd=ctx.createLinearGradient(b.x,sy+18,b.x,sy-16);
  grd.addColorStop(0,"rgba(80,220,255,0)"); grd.addColorStop(.4,"#7ef"); grd.addColorStop(1,"#fff");
  ctx.strokeStyle=grd; ctx.lineWidth=4; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(b.x,sy+16); ctx.lineTo(b.x,sy-14); ctx.stroke();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(b.x,sy-10,b.r,0,Math.PI*2); ctx.fill();
}

function drawBtn(label,x,y,w,h,col,id){

  ctx.fillStyle="#fff"; ctx.font="bold 16px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(label,x,y+1);

  ctx.fillStyle="#9ef"; ctx.fillText("Record "+best, W/2, H*.50);
  drawBtn("Rejouer", W/2, H*.62, 210, 48, "#1ecf8c", "replay");
  drawBtn("Boutique", W/2, H*.72, 210, 44, "#ff4d9a", "shop");
  drawBtn("Menu", W/2, H*.81, 210, 44, "#5a7dff", "menu");
}

function drawGame(){
  drawBG();
  for(const p of plats) drawPlat(p);
  for(const c of coins){ if(!c.alive)continue; const sy=w2s(c.y+Math.sin(performance.now()/400+c.ph)*4); ctx.fillStyle="#ffd24a"; ctx.beginPath(); ctx.arc(c.x,sy,c.r,0,Math.PI*2); ctx.fill(); }
  for(const pw of powers){ if(!pw.alive)continue; const sy=w2s(pw.y); ctx.fillStyle="#9ef"; rr(pw.x-14,sy-14,28,28,8); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="bold 12px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(pw.type[0].toUpperCase(),pw.x,sy); }
  for(const m of mons) drawMon(m);
  for(const b of bullets) drawBullet(b);
  for(const p of parts){ const sy=w2s(p.y); ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,sy,p.r,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
  if(player) drawAstro(player.x, w2s(player.y), player.sx, player.rot, getSkin(), {jet:has("jet")&&player.alive, shield:has("shield")&&player.alive, alpha:player.alive?undefined:Math.max(0,player.sx), sy:player.sy});
  drawHUD();
  if(state==="paused") drawPause();
}

function frame(t){
  const sec=t/1000; let dt=lastT?Math.min(sec-lastT,1/20):1/60; lastT=sec;
  if(state==="playing") update(dt);
  if(state==="menu") drawMenu();
  else if(state==="shop") drawShop();
  else if(state==="settings") drawSettings();
  else if(state==="gameover") drawGO();
  else drawGame();
  requestAnimationFrame(frame);
}
best=getBest();
requestAnimationFrame(frame);
})();
</script>
