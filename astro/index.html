<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ASTRO LUMO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#02040c;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#0c1430,#02040c 70%)}
#frame{position:relative;width:min(100vw,420px);height:min(100vh,100dvh);overflow:hidden;background:#000}
@media(min-width:440px){#frame{border-radius:20px;max-height:min(96vh,900px);height:min(96vh,900px);box-shadow:0 0 80px rgba(80,140,255,.35),0 0 0 1px rgba(255,255,255,.08)}}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050814;color:#9ecbff;font:700 14px system-ui;z-index:3}
</style>
</head>
<body>
<div id="wrap"><div id="frame">
<div id="load">Chargement de l’astronaute…</div>
<canvas id="c"></canvas>
</div></div>
<script>
(() => {
"use strict";
const VER = "astro-lumo-aim-20260911";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const loadEl = document.getElementById("load");

const C = {
  W:390, g:-920, r:26, hSp:480, maxH:560, tilt:.22,
  jump:760, jumpB:1180, jumpS:1520, wrap:28, camLag:.12, cull:280,
  platH:20, minW:78, maxW:132, baseSp:96, minSp:56, maxSp:148, ahead:1100,
  moveSp:88, disDelay:.5, coinR:11, coinV:12, powerS:26,
  coinCh:.3, powerCh:.07, monCh:0, bulletSp:1000, bulletR:5, cd:.13,
  BEST:"alGBest", WALLET:"alGWallet", OWNED:"alGOwned", EQUIP:"alGEquip",
  ROCK:"alGRock", EXTRA:"alGExtra", SOUND:"alGSound", CTRL:"alGCtrl", AMMO:"alGAmmo"
};

const PHASES = [
  {name:"ATMOSPHÈRE", from:0, c0:"#6eb0ff", c1:"#9fd0ff", c2:"#e8f4ff", stars:.12, earth:1},
  {name:"STRATOSPHÈRE", from:800, c0:"#2a4d9c", c1:"#4a78c8", c2:"#7aa8e0", stars:.4, earth:.45},
  {name:"ORBITE", from:1800, c0:"#0a1238", c1:"#16265a", c2:"#1e3070", stars:.85, earth:0},
  {name:"NÉBULEUSE", from:3200, c0:"#2a0a48", c1:"#4a1878", c2:"#1a0840", stars:.95, nebula:1},
  {name:"VIDE", from:4800, c0:"#050208", c1:"#0a0418", c2:"#000010", stars:1, void:1},
];

const SKINS = [
  {id:"classic", name:"Classique", price:0, tint:null},
  {id:"neon", name:"Néon", price:90, tint:"#3dffc0"},
  {id:"mars", name:"Mars", price:150, tint:"#ff7a55"},
  {id:"gold", name:"Or", price:300, tint:"#ffd76a"},
];
const ROCKETS = [
  {id:"mini", name:"Mini fusée", price:40, dur:2.5, thrust:940},
  {id:"super", name:"Turbo", price:90, dur:4.5, thrust:1140},
  {id:"mega", name:"Orbital", price:180, dur:6.5, thrust:1340},
];
const EXTRAS = [
  {id:"shield", name:"Bouclier", price:55},
  {id:"lucky", name:"Multi-pièces", price:95},
  {id:"slow", name:"Ralentisseur", price:65},
  {id:"revive", name:"2e chance", price:140},
];
const WEAPONS = [
  {id:"laser", name:"Laser", price:0, color:"#7ef6ff"},
  {id:"burst", name:"Rafale", price:120, ammo:"burst", pack:30, color:"#ffd24a"},
  {id:"missile", name:"Missile", price:200, ammo:"missile", pack:12, color:"#ff6b4a"},
];

let W=C.W, H=700, dpr=1, shake=0;
function resize(){
  const fr=document.getElementById("frame").getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1, 2.5);
  W=C.W; H=Math.max(560, Math.min(980, Math.round(C.W*(fr.height/Math.max(1,fr.width)))));
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(_){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,String(v));}catch(_){}};
const lsJ=(k,d)=>{try{return JSON.parse(ls(k,JSON.stringify(d)));}catch(_){return d;}};
const getBest=()=>+ls(C.BEST,0)||0, setBest=n=>lsSet(C.BEST,n);
const getWallet=()=>+ls(C.WALLET,0)||0, setWallet=n=>lsSet(C.WALLET,Math.max(0,n|0));
const addWallet=n=>{setWallet(getWallet()+n); return getWallet();};
const getOwned=()=>{const o=lsJ(C.OWNED,["classic"]); if(!o.includes("classic"))o.push("classic"); return o;};
const setOwned=a=>lsSet(C.OWNED,JSON.stringify(a));
const owns=id=>getOwned().includes(id);
const getEquip=()=>lsJ(C.EQUIP,{skin:"classic",weapon:"laser"});
const setEquip=o=>lsSet(C.EQUIP,JSON.stringify(o));
const getAmmo=()=>lsJ(C.AMMO,{burst:0,missile:0});
const setAmmo=o=>lsSet(C.AMMO,JSON.stringify(o));
const getRockets=()=>lsJ(C.ROCK,{});
const setRockets=o=>lsSet(C.ROCK,JSON.stringify(o));
const rockN=id=>getRockets()[id]||0;
const addRock=(id,n)=>{const o=getRockets(); o[id]=(o[id]||0)+n; if(o[id]<=0)delete o[id]; setRockets(o);};
const getExtras=()=>lsJ(C.EXTRA,{});
const setExtras=o=>lsSet(C.EXTRA,JSON.stringify(o));
const extraN=id=>getExtras()[id]||0;
const addExtra=(id,n)=>{const o=getExtras(); o[id]=(o[id]||0)+n; if(o[id]<=0)delete o[id]; setExtras(o);};
let soundOn=ls(C.SOUND,"1")==="1";
const getCtrl=()=>ls(C.CTRL,"touch");
const setCtrl=m=>lsSet(C.CTRL,m);

let actx=null;
function ensureAudio(){ if(!actx){try{actx=new (AudioContext||webkitAudioContext)();}catch(_){}} if(actx&&actx.state==="suspended")actx.resume(); }
function beep(f,d,t,v,to){ if(!soundOn)return; ensureAudio(); if(!actx)return; const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type=t||"sine"; o.frequency.setValueAtTime(f,t0); if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+d); g.gain.setValueAtTime(v||.08,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+.02); }
const SFX={jump:()=>beep(310,.06,"triangle",.08,540), shoot:()=>beep(920,.04,"square",.06,300), hit:()=>beep(140,.08,"sawtooth",.09,50), coin:()=>{beep(900,.04,"sine",.08);setTimeout(()=>beep(1200,.05,"sine",.06),30);}, die:()=>beep(160,.35,"sawtooth",.1,40), btn:()=>beep(500,.03,"sine",.05), power:()=>beep(440,.09,"sawtooth",.06,800), boss:()=>beep(90,.2,"sawtooth",.1,40)};

let buttons=[], toasts=[];
const clearBtns=()=>buttons=[];
const addBtn=(id,x,y,w,h)=>buttons.push({id,x,y,w,h});
function hitUI(x,y){ for(let i=buttons.length-1;i>=0;i--){const b=buttons[i]; if(x>=b.x-b.w/2&&x<=b.x+b.w/2&&y>=b.y-b.h/2&&y<=b.y+b.h/2)return b.id;} return null; }
function toast(m){ toasts.push({m,t:2}); }

let state="menu", shopTab="skins", shopScroll=0;
let player, plats, coins, powers, mons, bullets, parts, stars, nebulae, boss;
let camY, maxCam, startY, score, runCoins, maxH, best, over, overT, lastT=0, topY;
let powersActive={}, hint=1, banked=false, revive=false, coinMul=1, thrust=1000, fireCd=0;
let keys={}, pDown=false, lastPX=null, hIn=0, ui=null, combo=0, comboT=0, kills=0, bossesBeat={};
let astroImg=null, astroReady=false;
const MON_IDS=["green_eye","purple_blob","spiky_grey","ufo","red_spider","blue_stalk","yellow_fire","purple_jelly"];
const BOSS_IDS=["tentacle_green","jelly_multi","spiky_boss","ufo_boss","crab_red","slime_blue","rocket_yellow","jelly_dark"];
const BOSS_NAMES={tentacle_green:"Tentacules",jelly_multi:"Méduse",spiky_boss:"Pic",ufo_boss:"OVNI",crab_red:"Crabe",slime_blue:"Slime",rocket_yellow:"Comète",jelly_dark:"Ombre"};
let monImgs={}, bossImgs={}, monsReady=false, lastMonTier=0, climbLocked=false, floorPlat=null;

function now(){return performance.now()/1000;}
function has(t){return powersActive[t]>now();}
function phaseFor(h){ let p=PHASES[0]; for(const ph of PHASES) if(h>=ph.from)p=ph; return p; }
function diff(h){ return Math.min(2.4, h/720*.3); }

function mkPlayer(x,y){return {x,y,vx:0,vy:0,r:C.r,alive:true,sx:1,sy:1,rot:0,sq:0};}
function mkPlat(type,w,x,y){
  const p={type,w,h:C.platH,x,y,ox:x,on:true,a:1,spd:0,dir:1,range:0,dis:false,dt:0,pulse:Math.random()*6,glow:0.5+Math.random()*0.5};
  if(type==="moving"){p.spd=C.moveSp*(.7+Math.random()*.6); p.dir=Math.random()<.5?1:-1; p.range=40+Math.random()*65;}
  return p;
}
function mkMon(type,x,y){const t=MON_IDS.includes(type)?type:pickMonType(); return {type:t,x,y,ox:x,r:24,alive:true,hp:1,ph:Math.random()*6,dir:Math.random()<.5?1:-1,spd:40+Math.random()*45};}
function pickBossType(){ return BOSS_IDS[(Math.random()*BOSS_IDS.length)|0]; }
function mkBoss(kind,y){
  const k=BOSS_IDS.includes(kind)?kind:pickBossType();
  return {kind:k,name:BOSS_NAMES[k]||"Boss",x:W/2,y,ox:W/2,r:36,hp:10,max:10,alive:true,ph:Math.random()*6,sc:80,flash:0};
}
function mkBullet(x,y,o){o=o||{}; return {x,y,vy:o.vy||C.bulletSp,vx:o.vx||0,r:o.r||C.bulletR,alive:true,life:o.life||1,dmg:o.dmg||1,splash:o.splash||0,color:o.color||"#7ef",missile:!!o.missile};}

function pickPlat(d){
  const r=Math.random();
  if(r<.04*(1+d))return "bonus";
  if(r<.12+d*.08)return "moving";
  if(r<.2+d*.08)return "disappear";
  if(r<.28+d*.05)return "bounce";
  return "normal";
}
function platW(d,t){const sh=Math.min(.4,d*.18); let w=C.minW*(1-sh*.4)+Math.random()*Math.max(12,C.maxW*(1-sh)-C.minW); if(t==="bonus")w=Math.max(w,108); return w;}
function space(d){return Math.max(C.minSp, C.baseSp+Math.min(C.maxSp-C.baseSp,d*36)+(-8+Math.random()*24));}
function pickMonType(){ return MON_IDS[(Math.random()*MON_IDS.length)|0]; }

function spawnRow(y,d){
  const t=pickPlat(d), w=platW(d,t), x=42+Math.random()*(W-84);
  plats.push(mkPlat(t,w,x,y));
  if(Math.random()<C.coinCh) coins.push({x:x-18+Math.random()*36,y:y+28,r:C.coinR,v:C.coinV,alive:true,ph:Math.random()*6});
  if(Math.random()<C.powerCh*(.5+d*.4)){
    const types=["jet","super","shield","magnet","slow"];
    powers.push({type:types[(Math.random()*types.length)|0],x:Math.min(W-30,Math.max(30,x-35+Math.random()*70)),y:y+40,s:C.powerS,alive:true,ph:Math.random()*6});
  }
}

function spawnScoreMonster(){
  if(!player||!player.alive||(boss&&boss.alive))return;
  const type=pickMonType();
  const x=40+Math.random()*(W-80);
  const y=Math.max(player.y+180, camY+H*.35)+Math.random()*80;
  mons.push(mkMon(type,x,y));
}
function ensureBossFloor(){
  // Full-screen safety bar — never dies from falling during boss
  const fy = (floorPlat && floorPlat.on) ? floorPlat.y : Math.max(60, player.y - 40);
  if(floorPlat && floorPlat.on){
    floorPlat.w = W + 120;
    floorPlat.x = W/2;
    floorPlat.h = 28;
    floorPlat.on = true;
    floorPlat.a = 1;
    return;
  }
  floorPlat = mkPlat("floor", W + 120, W/2, fy);
  floorPlat.h = 28;
  floorPlat.glow = 1.2;
  plats.push(floorPlat);
}
function clearBossFloor(){
  if(floorPlat){ floorPlat.on=false; floorPlat.a=0; floorPlat=null; }
}
function beginBossFight(){
  if(!player||!player.alive)return;
  if(boss&&boss.alive)return;
  for(const m of mons) m.alive=false;
  climbLocked=true;
  // Lock arena floor under the player now
  const fy=Math.max(60, player.y - 36);
  floorPlat = mkPlat("floor", W + 120, W/2, fy);
  floorPlat.h = 28; floorPlat.glow = 1.2;
  plats.push(floorPlat);
  // Remove ALL other platforms (no climbing out)
  for(const p of plats){ if(p!==floorPlat){ p.on=false; p.a=0; } }
  topY = fy + 40;
  player.y = fy + player.r + 4;
  player.vy = 0;
  // Stop jet / upward powers that would escape
  delete powersActive.jet;
  const by = fy + 210;
  boss = mkBoss(pickBossType(), by);
  // Freeze camera around arena
  maxCam = fy + H * .35;
  camY = maxCam;
  SFX.boss(); toast("BOSS · "+boss.name+" — vaincs-le pour monter"); addShake(.5);
}
function unlockAfterBoss(){
  climbLocked=false;
  const base = (floorPlat && floorPlat.on) ? floorPlat.y : player.y;
  clearBossFloor();
  const d=diff(Math.max(0,camY));
  // Seed platforms starting just above arena so climb resumes
  let y = base + C.baseSp;
  plats.push(mkPlat("normal", 150, W/2, base + 8));
  for(let i=0;i<18;i++){ y+=space(d); spawnRow(y,d); }
  topY=y;
  maxCam = Math.max(maxCam, player.y + H*.14);
}

function burst(x,y,col,n,spd){ spd=spd||180; for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=spd*(.35+Math.random()); parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.3+Math.random()*.35,max:.55,col,r:1.5+Math.random()*3}); } }
function addShake(n){ shake=Math.max(shake,n); }

function tryShoot(){
  if(state!=="playing"||!player||!player.alive||fireCd>0)return;
  const eq=getEquip(); const w=WEAPONS.find(x=>x.id===eq.weapon)||WEAPONS[0];
  const ammo=getAmmo();
  if(w.ammo && (ammo[w.ammo]||0)<=0){ toast("Plus de munitions"); eq.weapon="laser"; setEquip(eq); return tryShoot(); }
  fireCd = w.id==="missile"?.55:w.id==="burst"?.26:C.cd;
  if(w.id==="laser"){ bullets.push(mkBullet(player.x, player.y+player.r,{color:w.color})); SFX.shoot(); }
  else if(w.id==="burst"){ ammo.burst--; setAmmo(ammo); for(let i=-1;i<=1;i++) bullets.push(mkBullet(player.x+i*7, player.y+player.r,{vx:i*55,color:w.color,life:.75})); SFX.shoot(); }
  else { ammo.missile--; setAmmo(ammo); bullets.push(mkBullet(player.x, player.y+player.r,{vy:740,r:7,dmg:3,splash:52,color:w.color,missile:true,life:1.3})); SFX.shoot(); }
  burst(player.x, player.y+player.r, w.color, 4, 100);
}

function startGame(){
  startY=140; player=mkPlayer(W/2, startY+C.r+C.platH);
  score=0; runCoins=0; maxH=0; best=getBest(); over=false; overT=0; hint=1; banked=false;
  revive=false; coinMul=1; thrust=1000; fireCd=0; powersActive={}; parts=[];
  combo=0; comboT=0; kills=0; boss=null; bossesBeat={};
  camY=H/2; maxCam=camY;
  plats=[]; coins=[]; powers=[]; mons=[]; bullets=[];
  plats.push(mkPlat("normal",150,W/2,startY));
  topY=startY; let y=startY+C.baseSp;
  for(let i=0;i<14;i++){ spawnRow(y,0); y+=space(0);} topY=y;
  lastMonTier=0; climbLocked=false; floorPlat=null;

  const stock=getRockets();
  for(const id of ["mega","super","mini"]){
    if((stock[id]||0)>0){ addRock(id,-1); const r=ROCKETS.find(x=>x.id===id); powersActive.jet=now()+r.dur; thrust=r.thrust; break; }
  }
  if(extraN("shield")>0){ addExtra("shield",-1); powersActive.shield=now()+9; }
  if(extraN("lucky")>0){ addExtra("lucky",-1); coinMul=1.5; }
  if(extraN("slow")>0){ addExtra("slow",-1); powersActive.slow=now()+8; }
  if(extraN("revive")>0){ addExtra("revive",-1); revive=true; }

  player.vy=C.jump*.9; SFX.jump(); state="playing"; lastT=0;
}

function gameOver(){
  if(over)return; over=true; player.alive=false; SFX.die(); addShake(.65);
  if(score>getBest()){ setBest(score); best=score; toast("Nouveau record !"); } else best=getBest();
  if(!banked){ addWallet(runCoins); banked=true; }
  overT=.6;
}
function bounce(imp){ player.vy=imp; player.sq=.18; player.sx=1.2; player.sy=.78; SFX.jump(); }
function land(p){
  if(!p.on)return 0;
  let imp=C.jump;
  if(has("super")) imp=C.jumpS;
  else if(p.type==="bounce") imp=C.jumpB;
  else if(p.type==="bonus"){ imp=C.jump*1.22; runCoins+=25; burst(p.x,p.y,"#ffd24a",10); }
  else if(p.type==="floor"){
    // During boss: stand still so player can aim. Outside boss: light bounce.
    if(boss&&boss.alive) return 0;
    imp=C.jump*1.05;
  }
  if(p.type==="disappear"&&!p.dis){ p.dis=true; p.dt=C.disDelay; }
  return imp;
}
function registerKill(b){
  kills++; combo++; comboT=2; const mult=1+Math.min(5,combo)*.15;
  const g=Math.round((b||12)*mult); runCoins+=g; recompute(); SFX.hit();
  if(combo>=4) toast("COMBO x"+combo);
}

function handleUI(id){
  SFX.btn(); ensureAudio();
  if(id.startsWith("bs_")){ const s=SKINS.find(x=>x.id===id.slice(3)); if(!s||owns(s.id)||getWallet()<s.price)return; setWallet(getWallet()-s.price); const o=getOwned(); o.push(s.id); setOwned(o); const e=getEquip(); e.skin=s.id; setEquip(e); return; }
  if(id.startsWith("es_")){ if(owns(id.slice(3))){ const e=getEquip(); e.skin=id.slice(3); setEquip(e);} return; }
  if(id.startsWith("br_")){ const r=ROCKETS.find(x=>x.id===id.slice(3)); if(r&&getWallet()>=r.price){ setWallet(getWallet()-r.price); addRock(r.id,1);} return; }
  if(id.startsWith("be_")){ const e=EXTRAS.find(x=>x.id===id.slice(3)); if(e&&getWallet()>=e.price){ setWallet(getWallet()-e.price); addExtra(e.id,1);} return; }
  if(id.startsWith("bw_")){ const w=WEAPONS.find(x=>x.id===id.slice(3)); if(!w||!w.ammo||getWallet()<w.price)return; setWallet(getWallet()-w.price); const a=getAmmo(); a[w.ammo]=(a[w.ammo]||0)+w.pack; setAmmo(a); const e=getEquip(); e.weapon=w.id; setEquip(e); toast(w.name+" +"+w.pack); return; }
  if(id.startsWith("ew_")){ const e=getEquip(); e.weapon=id.slice(3); setEquip(e); return; }
  if(id==="play") startGame();
  else if(id==="shop"){ state="shop"; shopTab="skins"; shopScroll=0; }
  else if(id==="settings") state="settings";
  else if(id==="back") state="menu";
  else if(id==="tab_skins"){ shopTab="skins"; shopScroll=0; }
  else if(id==="tab_gun"){ shopTab="weapons"; shopScroll=0; }
  else if(id==="tab_rock"){ shopTab="rockets"; shopScroll=0; }
  else if(id==="tab_ext"){ shopTab="extras"; shopScroll=0; }
  else if(id==="up") shopScroll=Math.max(0,shopScroll-1);
  else if(id==="dn") shopScroll=Math.min(20,shopScroll+1);
  else if(id==="sound"){ soundOn=!soundOn; lsSet(C.SOUND,soundOn?"1":"0"); }
  else if(id==="c_touch") setCtrl("touch");
  else if(id==="c_follow") setCtrl("follow");
  else if(id==="c_keys") setCtrl("keys");
  else if(id==="pause"){ if(state==="playing") state="paused"; }
  else if(id==="resume"){ state="playing"; lastT=0; }
  else if(id==="restart"||id==="replay") startGame();
  else if(id==="menu") state="menu";
}

function pos(e){ const r=canvas.getBoundingClientRect(); const cx=e.touches?e.touches[0].clientX:e.clientX; const cy=e.touches?e.touches[0].clientY:e.clientY; return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H}; }
function onDown(e){ ensureAudio(); e.preventDefault(); const p=pos(e); pDown=true; lastPX=p.x; ui=hitUI(p.x,p.y); if(!ui&&state==="playing"){ steer(p.x,true); tryShoot(); } }
function onMove(e){ if(!pDown)return; e.preventDefault(); const p=pos(e); if(!ui&&state==="playing") steer(p.x,false); lastPX=p.x; }
function onUp(e){ e.preventDefault(); let p; if(e.changedTouches){ const r=canvas.getBoundingClientRect(); const t=e.changedTouches[0]; p={x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H}; } else p=pos(e); if(ui){ const h=hitUI(p.x,p.y); if(h&&h===ui) handleUI(h); } pDown=false; lastPX=null; ui=null; }
canvas.addEventListener("mousedown",onDown); canvas.addEventListener("mousemove",onMove); addEventListener("mouseup",onUp);
canvas.addEventListener("touchstart",onDown,{passive:false}); canvas.addEventListener("touchmove",onMove,{passive:false}); canvas.addEventListener("touchend",onUp,{passive:false});
addEventListener("keydown",e=>{ keys[e.code]=true; if(e.code==="Escape"){ if(state==="playing")state="paused"; else if(state==="paused"){state="playing";lastT=0;} } if(e.code==="Space"&&state==="playing"){e.preventDefault(); tryShoot();} if(["ArrowLeft","ArrowRight","Space","KeyA","KeyD","Digit1","Digit2","Digit3"].includes(e.code)) e.preventDefault();
  if(state==="playing"){ if(e.code==="Digit1"){const eq=getEquip();eq.weapon="laser";setEquip(eq);} if(e.code==="Digit2"){const a=getAmmo(); if((a.burst||0)>0){const eq=getEquip();eq.weapon="burst";setEquip(eq);}} if(e.code==="Digit3"){const a=getAmmo(); if((a.missile||0)>0){const eq=getEquip();eq.weapon="missile";setEquip(eq);}} }
});
addEventListener("keyup",e=>keys[e.code]=false);
function steer(x,start){ const mode=getCtrl(); if(mode==="keys")return; if(mode==="follow"){ hIn=Math.max(-1,Math.min(1,((x/W)*2-1)*1.15)); return; } const n=(x/W)*2-1; let d=0; if(lastPX!=null&&!start)d=Math.max(-1,Math.min(1,(x-lastPX)/16)); hIn=Math.max(-1,Math.min(1,n*.85+d*.35)); }
function poll(dt){ let k=0; if(keys.ArrowLeft||keys.KeyA)k-=1; if(keys.ArrowRight||keys.KeyD)k+=1; if(getCtrl()==="keys") hIn=k; else if(k) hIn=k; else if(!pDown){ hIn*=Math.pow(.02,dt); if(Math.abs(hIn)<.02)hIn=0; } }

function initFX(){
  stars=[]; for(let i=0;i<140;i++) stars.push({x:Math.random()*W, y:Math.random()*10000, r:.3+Math.random()*2.4, a:.2+Math.random()*.8, tw:Math.random()*6, layer:.15+Math.random()*.5});
  nebulae=[
    {x:.25,y:.3,rx:120,ry:50,rot:.4,col:"rgba(255,70,170,.16)"},
    {x:.75,y:.45,rx:100,ry:40,rot:-.3,col:"rgba(70,200,255,.14)"},
    {x:.5,y:.2,rx:80,ry:35,rot:.1,col:"rgba(160,80,255,.12)"},
  ];
}
initFX();

function maybeBoss(){ /* score-gated via lastMonTier */ }
function hurtBoss(dmg){
  if(!boss||!boss.alive)return;
  // 10 shots to kill — 1 HP per hit regardless of weapon
  boss.hp-=1; boss.flash=.12; SFX.hit(); burst(boss.x,boss.y,"#ff66aa",10); addShake(.2);
  if(boss.hp<=0){
    boss.alive=false; bossesBeat[boss.kind]=true; registerKill(boss.sc);
    burst(boss.x,boss.y,"#ffd24a",30,300); addShake(.85); toast("Boss vaincu · monte !");
    boss=null; unlockAfterBoss();
  }
}

function update(dt){
  poll(dt); if(fireCd>0)fireCd-=dt;
  if(comboT>0){ comboT-=dt; if(comboT<=0)combo=0; }
  for(const k of Object.keys(powersActive)) if(powersActive[k]<=now()) delete powersActive[k];
  if(shake>0) shake=Math.max(0,shake-dt*2);
  for(const t of toasts) t.t-=dt; toasts=toasts.filter(t=>t.t>0);

  const tgt=hIn*C.hSp;
  player.vx+=(tgt-player.vx)*Math.min(1,dt*12);
  player.vx=Math.max(-C.maxH,Math.min(C.maxH,player.vx));
  player.rot+=((-hIn*C.tilt)-player.rot)*Math.min(1,dt*10);

  if(player.sq>0){ player.sq-=dt; const t=1-player.sq/.18; if(t>.4&&t<.7){player.sx+=(0.92-player.sx)*.35; player.sy+=(1.12-player.sy)*.35;} else if(t>=.7){player.sx+=(1-player.sx)*.3; player.sy+=(1-player.sy)*.3;} }
  else { const sy=1+Math.max(-.12,Math.min(.18,player.vy/2200)); const sx=1/Math.sqrt(Math.max(.75,sy)); player.sx+=(sx-player.sx)*Math.min(1,dt*12); player.sy+=(sy-player.sy)*Math.min(1,dt*12); }

  player.vy+=C.g*dt;
  if(has("jet")&&player.alive){ player.vy=Math.max(player.vy,thrust*.55); player.vy+=thrust*.55*dt; }
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  if(player.x<-C.wrap)player.x=W+C.wrap; else if(player.x>W+C.wrap)player.x=-C.wrap;

  if(player.alive&&player.vy<=90){
    const bottom=player.y-player.r*.55;
    for(const p of plats){
      if(!p.on||p.a<.3)continue;
      const full = p.type==="floor";
      if(!full && (player.x<p.x-p.w*.48||player.x>p.x+p.w*.48))continue;
      const top=p.y+p.h*.4;
      const slack = full ? 28 : 14;
      if(bottom>=top-16&&bottom<=top+slack){
        player.y=top+player.r*.55;
        if(full && boss&&boss.alive){ player.vy=0; }
        else { const imp=land(p); if(imp>0) bounce(imp); }
        break;
      }
    }
  }

  for(const c of coins){
    if(!c.alive)continue;
    const dx=c.x-player.x, dy=c.y-player.y, dist=Math.hypot(dx,dy);
    if(has("magnet")&&dist<165&&dist>.1){ c.x-=dx/dist*520*dt; c.y-=dy/dist*520*dt; }
    if(Math.hypot(c.x-player.x,c.y-player.y)<player.r+c.r){ c.alive=false; runCoins+=Math.round(c.v*coinMul); recompute(); SFX.coin(); burst(c.x,c.y,"#ffd24a",7); }
  }
  for(const pw of powers){
    if(!pw.alive)continue;
    if(Math.hypot(pw.x-player.x,pw.y-player.y)<player.r+pw.s*.45){
      pw.alive=false; const map={jet:3.5,super:8,shield:10,magnet:7,slow:6};
      powersActive[pw.type]=now()+(map[pw.type]||5); SFX.power(); burst(pw.x,pw.y,"#9ef",8);
    }
  }

  for(const b of bullets){
    if(!b.alive)continue;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.missile){
      let tx=null,ty=null,bestD=1e9;
      for(const m of mons){ if(!m.alive)continue; const d=Math.hypot(m.x-b.x,m.y-b.y); if(d<bestD){bestD=d;tx=m.x;ty=m.y;} }
      if(boss&&boss.alive){ const d=Math.hypot(boss.x-b.x,boss.y-b.y); if(d<bestD){tx=boss.x;ty=boss.y;} }
      if(tx!=null){ b.vx+=(tx-b.x)*2*dt; b.vy+=Math.max(0,(ty-b.y)*1.1*dt); }
    }
    if(b.y>camY+H||b.life<=0) b.alive=false;
  }

  const slow=has("slow");
  for(const m of mons){
    if(!m.alive)continue;
    m.ph+=dt*2.8;
    const slowF=slow?.35:1;
    if(m.type==="ufo"||m.type==="yellow_fire"){ m.x+=m.dir*m.spd*.85*slowF*dt; m.y+=Math.sin(m.ph)*18*dt; if(m.x<30||m.x>W-30)m.dir*=-1; }
    else if(m.type==="spiky_grey"||m.type==="red_spider"){ m.x+=m.dir*m.spd*slowF*dt; if(m.x<26||m.x>W-26)m.dir*=-1; }
    else { m.x=m.ox+Math.sin(m.ph)*40; m.y+=Math.sin(m.ph*1.3)*6*dt; }
    for(const b of bullets){
      if(!b.alive||!m.alive)continue;
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+b.r){
        b.alive=false; m.hp-=b.dmg; burst(m.x,m.y,"#ff6688",6); addShake(.12);
        if(b.splash){ for(const m2 of mons) if(m2.alive&&Math.hypot(m2.x-m.x,m2.y-m.y)<b.splash) m2.hp-=1; burst(m.x,m.y,"#ff6b4a",12,240); }
        if(m.hp<=0){ m.alive=false; registerKill(14); burst(m.x,m.y,"#ffd24a",12); }
      }
    }
    if(player.alive&&Math.hypot(m.x-player.x,m.y-player.y)<m.r+player.r*.85){
      // Stomp: bounce on top kills monster and launches ~100 score pts of height (1000 units)
      const stomping = player.y > m.y + m.r*.15 && player.vy <= 160;
      if(stomping){
        m.alive=false; registerKill(18); burst(m.x,m.y,"#ffd24a",14); SFX.hit(); addShake(.18);
        player.y = m.y + m.r + player.r + 1000; // +100 pts de hauteur
        bounce(C.jumpS); toast("+100 ↑");
      } else if(has("shield")){ delete powersActive.shield; m.alive=false; burst(m.x,m.y,"#4df",10); }
      else if(revive){ revive=false; player.y=camY-H*.15; bounce(C.jump*1.25); m.alive=false; toast("Revive!"); }
      else gameOver();
    }
  }

  maybeBoss();
  if(boss&&boss.alive){
    boss.ph+=dt; boss.flash=Math.max(0,boss.flash-dt);
    ensureBossFloor();
    const fy = floorPlat ? floorPlat.y : player.y - 40;
    const ceiling = fy + H * .72;
    // Cap climb: no escaping the arena upward
    if(player.y > ceiling){ player.y = ceiling; if(player.vy>0) player.vy = 0; }
    delete powersActive.jet;
    boss.x=W/2+Math.sin(boss.ph*1.1)*90;
    boss.y=fy + 200 + Math.sin(boss.ph*1.7)*16;
    // Camera stays on arena
    maxCam = fy + H * .35;
    for(const b of bullets){ if(!b.alive)continue; if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r+8){ b.alive=false; hurtBoss(1); } }
    if(player.alive&&Math.hypot(boss.x-player.x,boss.y-player.y)<boss.r+player.r*.55){
      if(has("shield")){ delete powersActive.shield; hurtBoss(1); }
      else if(revive){ revive=false; player.y=fy+player.r+8; bounce(C.jump*1.35); toast("Revive!"); }
      else gameOver();
    }
  }

  for(const p of plats){
    p.pulse+=dt*2.5;
    if(p.type==="moving"&&p.on){ p.x+=p.dir*p.spd*(slow?.35:1)*dt; if(Math.abs(p.x-p.ox)>=p.range){ p.dir*=-1; p.x=p.ox+p.dir*p.range*.98; } }
    if(p.dis&&p.on){ p.dt-=dt; p.a=.3+.7*Math.abs(Math.sin(p.dt*38)); if(p.dt<=0){ p.a-=dt*5; if(p.a<=0){p.on=false;p.a=0;} } }
  }

  const follow=player.y+H*.14; if(follow>maxCam)maxCam=follow;
  camY+=(Math.max(H/2,maxCam)-camY)*Math.min(1,C.camLag*60*dt);
  const d=diff(Math.max(0,camY));
  if(!(boss&&boss.alive)&&!climbLocked){
    while(topY<camY+C.ahead){ topY+=space(d); spawnRow(topY,d); }
  }
  const cull=camY-H/2-C.cull;
  plats=plats.filter(p=>(p.type==="floor")||(p.y>=cull&&(p.on||p.a>0)));
  coins=coins.filter(c=>c.alive&&c.y>=cull);
  powers=powers.filter(p=>p.alive&&p.y>=cull);
  mons=mons.filter(m=>m.alive&&m.y>=cull-40&&MON_IDS.includes(m.type));
  bullets=bullets.filter(b=>b.alive);

  const h=Math.max(0,player.y-startY); if(h>maxH)maxH=h; recompute();
  const tier=Math.floor(score/100);
  while(tier>lastMonTier){
    lastMonTier++;
    if(lastMonTier<1) continue;
    if(lastMonTier%10===0) beginBossFight();
    else if(!(boss&&boss.alive)) spawnScoreMonster();
  }
  // Boss arena: full-width floor — stand still, no auto-jump (can aim)
  if(boss&&boss.alive&&floorPlat&&floorPlat.on){
    const top=floorPlat.y+floorPlat.h*.4;
    if(player.y-player.r*.55 < top+2){
      player.y=top+player.r*.55;
      if(player.vy<0) player.vy=0;
    }
  }
  const kill=camY-H/2-40;
  if(player.alive&&player.y<kill){
    if(boss&&boss.alive){
      const fy = floorPlat && floorPlat.on ? floorPlat.y : camY - H*.2;
      player.y = fy + player.r + 6;
      player.vy = 0;
    } else if(has("shield")){ delete powersActive.shield; player.y=camY-H*.2; bounce(C.jump*1.1); }
    else if(revive){ revive=false; player.y=camY-H*.15; bounce(C.jump*1.25); toast("Revive!"); }
    else gameOver();
  }
  if(!player.alive){ player.rot+=dt*8; player.sx=Math.max(.05,player.sx-dt*1.4); player.sy=Math.max(.05,player.sy-dt*1.4); overT-=dt; if(overT<=0) state="gameover"; }
  hint=Math.max(0,hint-dt*.18);
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=200*dt; }
  parts=parts.filter(p=>p.life>0);
}
function recompute(){ score=Math.floor(maxH*.1)+runCoins+kills*2; }

function rr(x,y,w,h,r){ const R=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+R,y); ctx.arcTo(x+w,y,x+w,y+h,R); ctx.arcTo(x+w,y+h,x,y+h,R); ctx.arcTo(x,y+h,x,y,R); ctx.arcTo(x,y,x+w,y,R); ctx.closePath(); }
function w2s(y){ return H/2-(y-camY); }

function drawBG(){
  const h=(state==="playing"||state==="paused"||state==="gameover")?maxH:900;
  const ph=phaseFor(h);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,ph.c0); g.addColorStop(.5,ph.c1); g.addColorStop(1,ph.c2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // soft vignette
  const vg=ctx.createRadialGradient(W/2,H*.45,40,W/2,H*.45,H*.75);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.35)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  if(ph.earth){
    ctx.globalAlpha=ph.earth;
    const ey=H+70-ph.earth*20;
    const eg=ctx.createLinearGradient(0,ey-80,0,ey+40);
    eg.addColorStop(0,"#4db8ff"); eg.addColorStop(.45,"#2f9a55"); eg.addColorStop(1,"#1a6a38");
    ctx.fillStyle=eg; ctx.beginPath(); ctx.ellipse(W/2,ey,W*.95,130,0,Math.PI,0); ctx.fill();
    ctx.globalAlpha=.25*ph.earth; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(W*.35,ey-40,40,12, -.2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  for(const s of stars){
    const sy=((s.y-camY*s.layer)%(H+60)+H+60)%(H+60)-30;
    const tw=.45+.55*Math.sin(performance.now()/380+s.tw);
    ctx.globalAlpha=ph.stars*s.a*tw;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,sy,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  if(ph.nebula){
    for(const n of nebulae){
      ctx.save(); ctx.translate(W*n.x, H*n.y); ctx.rotate(n.rot);
      ctx.fillStyle=n.col; ctx.beginPath(); ctx.ellipse(0,0,n.rx,n.ry,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  if(ph.void){
    const rg=ctx.createRadialGradient(W/2,H*.2,6,W/2,H*.2,130);
    rg.addColorStop(0,"rgba(150,60,220,.4)"); rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }

  // floating dust
  ctx.globalAlpha=.08;
  for(let i=0;i<8;i++){
    const x=(i*53+camY*.03)%W, y=(i*97+camY*.08)%H;
    ctx.fillStyle="#9cf"; ctx.beginPath(); ctx.arc(x,y,8+i%3*4,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}


let tintCache={};
function getTintedAstro(color){
  if(tintCache[color]) return tintCache[color];
  const c=document.createElement("canvas");
  c.width=astroImg.naturalWidth||astroImg.width;
  c.height=astroImg.naturalHeight||astroImg.height;
  const x=c.getContext("2d");
  x.clearRect(0,0,c.width,c.height);
  x.drawImage(astroImg,0,0);
  x.globalCompositeOperation="source-atop";
  x.globalAlpha=.42;
  x.fillStyle=color;
  x.fillRect(0,0,c.width,c.height);
  x.globalAlpha=1;
  x.globalCompositeOperation="source-over";
  tintCache[color]=c;
  return c;
}
function drawPlayer(){
  if(!player) return;
  const sy=w2s(player.y);
  if(sy<-80||sy>H+80) return;
  ctx.save();
  ctx.translate(player.x, sy);
  ctx.rotate(player.rot);
  ctx.scale(player.sx, player.sy);
  if(!player.alive) ctx.globalAlpha=Math.max(0, player.sx);

  // soft shadow / glow under feet
  ctx.globalAlpha=(player.alive?0.25:0.1);
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(0, 34, 22, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha=player.alive?1:Math.max(0,player.sx);

  // jet flame behind pack
  if(has("jet")&&player.alive){
    const f=.65+.35*Math.sin(performance.now()/35);
    ctx.globalAlpha=f;
    const fg=ctx.createLinearGradient(0,20,0,55);
    fg.addColorStop(0,"#ffe08a"); fg.addColorStop(.5,"#ff6a2a"); fg.addColorStop(1,"rgba(255,80,0,0)");
    ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(-8,22); ctx.lineTo(8,22); ctx.lineTo(4,52); ctx.lineTo(-4,52); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }

  const skin=SKINS.find(s=>s.id===(getEquip().skin||"classic"))||SKINS[0];
  const drawW=58, drawH=drawW*(astroImg.height/astroImg.width);
  if(skin.tint){
    const tinted=getTintedAstro(skin.tint);
    ctx.drawImage(tinted, -drawW/2, -drawH*.62, drawW, drawH);
  } else {
    ctx.drawImage(astroImg, -drawW/2, -drawH*.62, drawW, drawH);
  }

  if(has("shield")&&player.alive){
    const pulse=.35+.45*(.5+.5*Math.sin(performance.now()/320));
    ctx.globalAlpha=pulse;
    ctx.strokeStyle="#6ef6ff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-4,34,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle="rgba(110,246,255,.1)"; ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawPlat(p){
  const sy=w2s(p.y); if(sy<-50||sy>H+50)return;
  ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,sy);
  const cols={normal:["#7ecbff","#3a8fd0"], moving:["#8ab0ff","#4a6fe0"], disappear:["#ffb08a","#e07040"], bounce:["#e0a0ff","#a050d0"], bonus:["#ffe066","#e0a020"], floor:["#5dffb0","#1aad6e"]};
  const c=cols[p.type]||cols.normal;
  // glow
  ctx.shadowColor=c[0]; ctx.shadowBlur=12*p.glow;
  // body
  const g=ctx.createLinearGradient(0,-p.h,0,p.h);
  g.addColorStop(0,c[0]); g.addColorStop(1,c[1]);
  ctx.fillStyle="rgba(0,0,0,.3)"; rr(-p.w/2+2, -p.h/2+4, p.w, p.h, 10); ctx.fill();
  ctx.fillStyle=g; rr(-p.w/2, -p.h/2, p.w, p.h, 10); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.5; ctx.stroke();
  // panel detail
  ctx.strokeStyle="rgba(255,255,255,.2)"; ctx.beginPath(); ctx.moveTo(-p.w*.3,0); ctx.lineTo(p.w*.3,0); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(-p.w*.32,0,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(p.w*.32,0,2,0,Math.PI*2); ctx.fill();
  if(p.type==="bonus"){ ctx.fillStyle="#fff"; ctx.font="bold 13px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★",0,1); }
  if(p.type==="moving"){ ctx.fillStyle="rgba(255,255,255,.7)"; ctx.font="10px system-ui"; ctx.textAlign="center"; ctx.fillText("↔",0,1); }
  ctx.restore();
}

function drawMon(m){
  const sy=w2s(m.y); if(sy<-80||sy>H+80)return;
  const img=monImgs[m.type];
  if(!(img&&img.complete&&img.naturalWidth)) return;
  ctx.save(); ctx.translate(m.x,sy);
  ctx.shadowColor="rgba(0,0,0,.45)"; ctx.shadowBlur=10;
  const bob=Math.sin(m.ph)*3;
  const dw=58, dh=dw*(img.height/img.width);
  ctx.drawImage(img, -dw/2, -dh/2+bob, dw, dh);
  ctx.restore();
}

function drawBoss(){
  if(!boss||!boss.alive)return;
  const sy=w2s(boss.y);
  const img=bossImgs[boss.kind];
  ctx.save(); ctx.translate(boss.x,sy);
  if(boss.flash>0) ctx.globalAlpha=.55+Math.random()*.45;
  ctx.shadowColor="#ff66dd"; ctx.shadowBlur=18;
  if(img&&img.complete&&img.naturalWidth){
    const bob=Math.sin(boss.ph*2)*4;
    const dw=92, dh=dw*(img.height/img.width);
    ctx.drawImage(img, -dw/2, -dh/2+bob, dw, dh);
  } else {
    ctx.fillStyle="#a44"; ctx.beginPath(); ctx.arc(0,0,boss.r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // HP bar (10 hits)
  const bw=200, bx=W/2-bw/2, by=48;
  ctx.fillStyle="rgba(0,0,0,.45)"; rr(bx-2,by-2,bw+4,16,8); ctx.fill();
  ctx.fillStyle="#ff3d6e"; rr(bx,by,bw*(Math.max(0,boss.hp)/boss.max),12,6); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="800 12px system-ui"; ctx.textAlign="center";
  ctx.fillText("BOSS · "+boss.name+" · "+boss.hp+"/10", W/2, by-12);
  if(climbLocked){
    ctx.fillStyle="#ffd24a"; ctx.font="700 11px system-ui";
    ctx.fillText("Vaincs le boss pour monter", W/2, by+28);
  }
}

function drawBullet(b){
  const sy=w2s(b.y); if(sy<-40||sy>H+40)return;
  if(b.missile){
    ctx.fillStyle=b.color; rr(b.x-5,sy-12,10,20,4); ctx.fill();
    ctx.fillStyle="#ff6a20"; ctx.beginPath(); ctx.moveTo(b.x-4,sy+8); ctx.lineTo(b.x,sy+18); ctx.lineTo(b.x+4,sy+8); ctx.fill();
  } else {
    ctx.shadowColor=b.color; ctx.shadowBlur=10;
    const grd=ctx.createLinearGradient(b.x,sy+18,b.x,sy-16);
    grd.addColorStop(0,"rgba(100,240,255,0)"); grd.addColorStop(.4,b.color); grd.addColorStop(1,"#fff");
    ctx.strokeStyle=grd; ctx.lineWidth=4; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(b.x,sy+16); ctx.lineTo(b.x,sy-14); ctx.stroke();
    ctx.shadowBlur=0;
  }
}

function drawBtn(label,x,y,w,h,col,id){
  addBtn(id,x,y,w,h);
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  rr(x-w/2,y-h/2,w,h,16); ctx.fillStyle=col; ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="bold 16px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(label,x,y+1); ctx.restore();
}

function drawHUD(){
  clearBtns();
  const ph=phaseFor(maxH);
  // glass phase chip
  ctx.fillStyle="rgba(8,14,35,.55)"; rr(W/2-100,10,200,28,14); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.stroke();
  ctx.fillStyle="#b8dcff"; ctx.font="800 11px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(ph.name, W/2, 24);

  ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=4;
  ctx.fillStyle="#fff"; ctx.font="bold 26px system-ui"; ctx.fillText(String(score),16,46);
  ctx.font="600 13px system-ui"; ctx.fillStyle="#ffd24a"; ctx.fillText("● "+runCoins+(combo>1?"  x"+combo:""),16,76);
  ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText("↑ "+Math.floor(maxH),16,96);
  const wpn=WEAPONS.find(x=>x.id===(getEquip().weapon||"laser"))||WEAPONS[0];
  const a=getAmmo();
  ctx.fillStyle=wpn.color; ctx.fillText(wpn.name+(wpn.ammo?(" "+(a[wpn.ammo]||0)):" ∞"),16,116);
  ctx.shadowBlur=0;

  addBtn("pause",W-36,28,44,40);
  ctx.fillStyle="rgba(20,30,70,.75)"; rr(W-58,8,44,40,14); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="bold 16px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("Ⅱ",W-36,28);

  if(hint>0){ ctx.globalAlpha=Math.min(1,hint); ctx.fillStyle="#fff"; ctx.font="600 12px system-ui"; ctx.textAlign="center"; ctx.fillText("Glisse pour bouger · Tape pour tirer", W/2, H-28); ctx.globalAlpha=1; }
  let ty=H*.18; for(const t of toasts){ ctx.globalAlpha=Math.min(1,t.t); ctx.fillStyle="#ffd24a"; ctx.font="800 13px system-ui"; ctx.textAlign="center"; ctx.fillText(t.m,W/2,ty); ty+=20; ctx.globalAlpha=1; }
}

function drawMenu(){
  clearBtns(); drawBG();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.shadowColor="#4af"; ctx.shadowBlur=22;
  ctx.fillStyle="#fff"; ctx.font="900 42px system-ui"; ctx.fillText("ASTRO LUMO", W/2, H*.14);
  ctx.shadowBlur=0;
  ctx.fillStyle="#9ecbff"; ctx.font="600 13px system-ui"; ctx.fillText("Saute · Tire · Explore l’espace", W/2, H*.14+30);

  // hero showcase
  if(astroReady){
    const bob=H*.36+Math.sin(performance.now()/550)*12;
    ctx.save(); ctx.translate(W/2, bob);
    ctx.shadowColor="rgba(100,180,255,.45)"; ctx.shadowBlur=30;
    const dw=110, dh=dw*(astroImg.height/astroImg.width);
    ctx.drawImage(astroImg, -dw/2, -dh*.55, dw, dh);
    ctx.restore();
    // soft light ring
    ctx.globalAlpha=.2; ctx.strokeStyle="#8cf"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(W/2, bob+48, 48, 12, 0, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
  }

  drawBtn("▶  JOUER", W/2, H*.58, 230, 52, "#1fd492", "play");
  drawBtn("Boutique", W/2, H*.68, 210, 44, "#ff4d9a", "shop");
  drawBtn("Réglages", W/2, H*.77, 210, 42, "#5a7dff", "settings");
  ctx.fillStyle="#ffd24a"; ctx.font="700 14px system-ui"; ctx.fillText("● "+getWallet()+"  ·  Record "+getBest(), W/2, H*.88);
  ctx.fillStyle="rgba(255,255,255,.4)"; ctx.font="10px system-ui"; ctx.fillText(VER, W/2, H*.94);
}

function drawShop(){
  clearBtns(); drawBG();
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 26px system-ui"; ctx.fillText("Boutique", W/2, 34);
  ctx.fillStyle="#ffd24a"; ctx.font="700 14px system-ui"; ctx.fillText("● "+getWallet(), W/2, 58);
  [["tab_skins","Skins","skins"],["tab_gun","Armes","weapons"],["tab_rock","Fusées","rockets"],["tab_ext","Extras","extras"]].forEach((t,i)=>drawBtn(t[1],48+i*78,90,72,28,shopTab===t[2]?"#1fd492":"rgba(30,40,80,.85)",t[0]));
  let items=[];
  if(shopTab==="skins") items=SKINS.map(s=>({kind:"skin",id:s.id,name:s.name,price:s.price,detail:owns(s.id)?(getEquip().skin===s.id?"Équipé":"Possédé"):s.price+" ●",col:s.tint||"#eef3ff"}));
  else if(shopTab==="weapons") items=WEAPONS.map(w=>({kind:"gun",id:w.id,name:w.name,price:w.price,detail:w.ammo?("stock "+(getAmmo()[w.ammo]||0)):"Infini",col:w.color}));
  else if(shopTab==="rockets") items=ROCKETS.map(r=>({kind:"rock",id:r.id,name:r.name,price:r.price,detail:"x"+rockN(r.id),col:"#ff6b3d"}));
  else items=EXTRAS.map(e=>({kind:"ext",id:e.id,name:e.name,price:e.price,detail:"x"+extraN(e.id),col:"#4df"}));
  const vis=4, st=shopScroll, slice=items.slice(st,st+vis);
  slice.forEach((it,i)=>{
    const y=150+i*102;
    ctx.fillStyle="rgba(18,28,60,.88)"; rr(18,y-36,W-36,84,16); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.stroke();
    ctx.beginPath(); ctx.arc(50,y,15,0,Math.PI*2); ctx.fillStyle=it.col; ctx.fill();
    ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.font="bold 14px system-ui"; ctx.fillText(it.name,74,y-8);
    ctx.font="11px system-ui"; ctx.fillStyle="rgba(255,255,255,.65)"; ctx.fillText(it.detail,74,y+12);
    if(it.kind==="skin"){ if(owns(it.id)){ if(getEquip().skin!==it.id) drawBtn("Éq.",W-70,y,70,32,"#5a7dff","es_"+it.id); else {ctx.textAlign="center";ctx.fillStyle="#1fd492";ctx.font="bold 12px system-ui";ctx.fillText("OK",W-70,y);} } else drawBtn("Buy",W-70,y,70,32,getWallet()>=it.price?"#ffd24a":"#444","bs_"+it.id); }
    else if(it.kind==="gun"){ if(it.id==="laser") drawBtn("Éq.",W-70,y,70,32,"#5a7dff","ew_laser"); else drawBtn("Buy",W-70,y,70,32,getWallet()>=it.price?"#ffd24a":"#444","bw_"+it.id); }
    else if(it.kind==="rock") drawBtn("Buy",W-70,y,70,32,getWallet()>=it.price?"#ffd24a":"#444","br_"+it.id);
    else drawBtn("Buy",W-70,y,70,32,getWallet()>=it.price?"#ffd24a":"#444","be_"+it.id);
  });
  if(st>0) drawBtn("▲",W/2,H-100,64,30,"rgba(30,40,80,.9)","up");
  if(st+vis<items.length) drawBtn("▼",W/2,H-66,64,30,"rgba(30,40,80,.9)","dn");
  drawBtn("Retour",W/2,H-28,140,36,"#5a7dff","back");
}

function drawSettings(){
  clearBtns(); drawBG();
  ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font="bold 28px system-ui"; ctx.fillText("Réglages", W/2, H*.14);
  const m=getCtrl();
  drawBtn((m==="touch"?"● ":"○ ")+"Touch / Drag", W/2, H*.3, 270, 44, "rgba(30,40,80,.9)", "c_touch");
  drawBtn((m==="follow"?"● ":"○ ")+"Suivi", W/2, H*.42, 270, 44, "rgba(30,40,80,.9)", "c_follow");
  drawBtn((m==="keys"?"● ":"○ ")+"Clavier", W/2, H*.54, 270, 44, "rgba(30,40,80,.9)", "c_keys");
  drawBtn(soundOn?"Son ON":"Son OFF", W/2, H*.68, 220, 44, "rgba(30,40,80,.9)", "sound");
  drawBtn("Retour", W/2, H*.82, 160, 44, "#5a7dff", "back");
}

function drawPause(){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="rgba(18,28,60,.95)"; rr(W/2-130,H/2-130,260,260,20); ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.stroke(); ctx.fillStyle="#fff"; ctx.font="bold 28px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("Pause",W/2,H/2-85); drawBtn("Reprendre",W/2,H/2-25,180,42,"#5a7dff","resume"); drawBtn("Rejouer",W/2,H/2+35,180,42,"#1fd492","restart"); drawBtn("Menu",W/2,H/2+95,180,42,"#ff4d9a","menu"); }
function drawGO(){ clearBtns(); drawBG(); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#ff4d78"; ctx.font="900 34px system-ui"; ctx.fillText("MISSION FAILED",W/2,H*.24); ctx.fillStyle="#fff"; ctx.font="bold 24px system-ui"; ctx.fillText("Score "+score,W/2,H*.36); ctx.fillStyle="#ffd24a"; ctx.font="600 15px system-ui"; ctx.fillText("+"+runCoins+" ● → "+getWallet(),W/2,H*.44); ctx.fillStyle="#9ecbff"; ctx.fillText("Record "+best,W/2,H*.51); if(astroReady){ const dw=70,dh=dw*(astroImg.height/astroImg.width); ctx.globalAlpha=.85; ctx.drawImage(astroImg,W/2-dw/2,H*.54,dw,dh); ctx.globalAlpha=1; } drawBtn("Rejouer",W/2,H*.72,200,46,"#1fd492","replay"); drawBtn("Boutique",W/2,H*.81,200,40,"#ff4d9a","shop"); drawBtn("Menu",W/2,H*.89,200,40,"#5a7dff","menu"); }

function drawGame(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake*12,(Math.random()-.5)*shake*12);
  drawBG();
  for(const p of plats) drawPlat(p);
  for(const c of coins){ if(!c.alive)continue; const sy=w2s(c.y+Math.sin(performance.now()/400+c.ph)*4); ctx.shadowColor="#ffd24a"; ctx.shadowBlur=8; ctx.fillStyle="#ffd24a"; ctx.beginPath(); ctx.arc(c.x,sy,c.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle="#fff6b0"; ctx.beginPath(); ctx.arc(c.x-3,sy-3,3,0,Math.PI*2); ctx.fill(); }
  for(const pw of powers){ if(!pw.alive)continue; const sy=w2s(pw.y+Math.sin(performance.now()/500+pw.ph)*5); ctx.fillStyle="rgba(120,230,255,.9)"; rr(pw.x-13,sy-13,26,26,8); ctx.fill(); ctx.strokeStyle="#fff"; ctx.stroke(); ctx.fillStyle="#fff"; ctx.font="bold 11px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(pw.type[0].toUpperCase(),pw.x,sy); }
  for(const m of mons) drawMon(m);
  drawBoss();
  for(const b of bullets) drawBullet(b);
  for(const p of parts){ const sy=w2s(p.y); ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,sy,p.r,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
  drawPlayer();
  ctx.restore();
  drawHUD();
  if(state==="paused") drawPause();
}

function frame(t){
  if(!astroReady) return;
  const sec=t/1000; let dt=lastT?Math.min(sec-lastT,1/20):1/60; lastT=sec;
  if(state==="playing") update(dt);
  if(state==="menu") drawMenu();
  else if(state==="shop") drawShop();
  else if(state==="settings") drawSettings();
  else if(state==="gameover") drawGO();
  else drawGame();
  requestAnimationFrame(frame);
}

best=getBest();
loadEl.textContent="Chargement des sprites…";
let pending=1+MON_IDS.length+BOSS_IDS.length;
function assetOk(){
  pending--;
  if(pending>0)return;
  astroReady=true; monsReady=true;
  loadEl.style.display="none";
  requestAnimationFrame(frame);
}
function assetFail(n){ loadEl.textContent="Erreur: "+n; }
astroImg=new Image();
astroImg.onload=assetOk;
astroImg.onerror=()=>assetFail("astronaute");
astroImg.src="astro.png?v="+VER;
for(const id of MON_IDS){
  const im=new Image();
  monImgs[id]=im;
  im.onload=assetOk;
  im.onerror=()=>assetFail(id);
  im.src="monsters/"+id+".png?v="+VER;
}
for(const id of BOSS_IDS){
  const im=new Image();
  bossImgs[id]=im;
  im.onload=assetOk;
  im.onerror=()=>assetFail("boss:"+id);
  im.src="bosses/"+id+".png?v="+VER;
}
})();
</script>
</body>
</html>
