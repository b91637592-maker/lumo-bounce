<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ASTRO RUN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050510;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #c {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #badge {
    position: fixed;
    bottom: 4px;
    right: 6px;
    font-size: 9px;
    color: rgba(180,200,255,0.35);
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="badge">astro-run-v1-20260911</div>
<script>
(function () {
  'use strict';

  const VERSION = 'astro-run-v1-20260911';
  const BEST_KEY = 'astroRunBest';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // —— Assets ——
  const astroImg = new Image();
  let assetsReady = false;
  let loadError = false;

  // —— Constants ——
  const LANES = 3;
  const LANE_LERP = 12;
  const JUMP_DURATION = 0.55;
  const JUMP_HEIGHT = 110;
  const SLIDE_DURATION = 0.45;
  const Z_NEAR = 1.0;
  const Z_FAR = 18;
  const SPAWN_Z = 16.5;
  const COLLIDE_Z_MIN = 1.15;
  const COLLIDE_Z_MAX = 2.35;
  const BASE_SPEED = 5.2;
  const SPEED_GAIN = 0.018;
  const MAX_SPEED = 14;

  // —— State ——
  let state = 'loading'; // loading | menu | playing | gameover
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

  let player = null;
  let entities = [];
  let particles = [];
  let stars = [];
  let nebulae = [];
  let pathSegments = [];
  let distance = 0;
  let coins = 0;
  let score = 0;
  let speed = BASE_SPEED;
  let spawnTimer = 0;
  let coinTimer = 0;
  let crashT = 0;
  let shake = 0;
  let menuPulse = 0;
  let runTime = 0;
  let lastLanePattern = -1;
  let difficulty = 0;

  function resetPlayer() {
    player = {
      lane: 1,
      laneX: 1,
      jumping: false,
      jumpT: 0,
      sliding: false,
      slideT: 0,
      bob: 0,
      dead: false
    };
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.72,
        r: 0.4 + Math.random() * 1.6,
        a: 0.25 + Math.random() * 0.75,
        tw: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 2
      });
    }
    nebulae = [
      { x: 0.2, y: 0.18, r: 0.35, c: [80, 40, 160], a: 0.12 },
      { x: 0.75, y: 0.28, r: 0.4, c: [20, 80, 140], a: 0.1 },
      { x: 0.5, y: 0.08, r: 0.28, c: [140, 40, 100], a: 0.08 }
    ];
  }

  function laneToX(lane, z) {
    const scale = 1 / z;
    const spread = Math.min(W, H * 0.9) * 0.38 * scale * (Z_NEAR + 2);
    return W * 0.5 + (lane - 1) * spread;
  }

  function zToY(z) {
    const t = (Z_FAR - z) / (Z_FAR - Z_NEAR);
    const horizon = H * 0.28;
    const ground = H * 0.92;
    // ease for stronger foreshortening near camera
    const te = t * t;
    return horizon + te * (ground - horizon);
  }

  function zToScale(z) {
    return (1.15 / z) * Math.min(W, H) * 0.09;
  }

  function project(lane, z) {
    return { x: laneToX(lane, z), y: zToY(z), s: zToScale(z) };
  }

  // —— Entities ——
  function spawnObstacle() {
    difficulty = Math.min(1, distance / 2500);
    const r = Math.random();
    let type;
    if (r < 0.28) type = 'block';
    else if (r < 0.48) type = 'low';
    else if (r < 0.68) type = 'high';
    else type = 'laser';

    // avoid same lane pattern spam
    let lane = Math.floor(Math.random() * 3);
    if (type === 'laser') {
      // laser spans one or two lanes
      const span = Math.random() < 0.45 + difficulty * 0.2 ? 2 : 1;
      const start = span === 2 ? Math.floor(Math.random() * 2) : Math.floor(Math.random() * 3);
      entities.push({
        kind: 'obstacle',
        type: 'laser',
        lane: start,
        span: span,
        z: SPAWN_Z,
        phase: Math.random() * Math.PI * 2,
        onPeriod: 0.55 + Math.random() * 0.25,
        offPeriod: 0.55 + Math.random() * 0.35,
        t: Math.random() * 1.2,
        hit: false
      });
      return;
    }

    // occasionally twin blocks forcing a specific path
    if (type === 'block' && Math.random() < 0.35 + difficulty * 0.25) {
      const blocked = [0, 1, 2];
      // leave one open
      const open = Math.floor(Math.random() * 3);
      if (open === lastLanePattern) {
        // nudge
      }
      lastLanePattern = open;
      for (let L = 0; L < 3; L++) {
        if (L === open) continue;
        entities.push({
          kind: 'obstacle', type: 'block', lane: L, z: SPAWN_Z, hit: false
        });
      }
      return;
    }

    if (lane === lastLanePattern && Math.random() < 0.5) {
      lane = (lane + 1 + Math.floor(Math.random() * 2)) % 3;
    }
    lastLanePattern = lane;

    entities.push({
      kind: 'obstacle',
      type: type,
      lane: lane,
      z: SPAWN_Z,
      hit: false
    });
  }

  function spawnCoinCluster() {
    const lane = Math.floor(Math.random() * 3);
    const n = 3 + Math.floor(Math.random() * 3);
    const z0 = SPAWN_Z + Math.random() * 1.5;
    for (let i = 0; i < n; i++) {
      entities.push({
        kind: 'coin',
        lane: lane,
        z: z0 + i * 0.55,
        rot: Math.random() * Math.PI * 2,
        taken: false
      });
    }
  }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.35 + Math.random() * 0.35,
        max: 0.7,
        r: 2 + Math.random() * 3.5,
        c: color
      });
    }
  }

  function startGame() {
    resetPlayer();
    entities = [];
    particles = [];
    distance = 0;
    coins = 0;
    score = 0;
    speed = BASE_SPEED;
    spawnTimer = 1.2;
    coinTimer = 0.8;
    crashT = 0;
    shake = 0;
    runTime = 0;
    lastLanePattern = -1;
    difficulty = 0;
    state = 'playing';
  }

  function gameOver() {
    if (state !== 'playing') return;
    player.dead = true;
    crashT = 0.45;
    shake = 12;
    state = 'gameover';
    score = Math.floor(distance) + coins * 10;
    if (score > best) {
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  // —— Input ——
  const keys = {};
  let touchStartX = 0, touchStartY = 0, touchStartT = 0;
  let swipeHandled = false;

  function tryJump() {
    if (state !== 'playing' || !player || player.dead) return;
    if (player.jumping || player.sliding) return;
    player.jumping = true;
    player.jumpT = 0;
  }
  function trySlide() {
    if (state !== 'playing' || !player || player.dead) return;
    if (player.jumping || player.sliding) return;
    player.sliding = true;
    player.slideT = 0;
  }
  function changeLane(dir) {
    if (state !== 'playing' || !player || player.dead) return;
    player.lane = Math.max(0, Math.min(2, player.lane + dir));
  }

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) {
      e.preventDefault();
    }
    if (state === 'menu' && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
      return;
    }
    if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
      return;
    }
    if (state !== 'playing') return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') tryJump();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') trySlide();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function onPointerDown(x, y) {
    touchStartX = x;
    touchStartY = y;
    touchStartT = performance.now();
    swipeHandled = false;

    if (state === 'menu') {
      // hit Jouer button region (approx center)
      const bx = W * 0.5, by = H * 0.62, bw = 160, bh = 52;
      if (x > bx - bw/2 && x < bx + bw/2 && y > by - bh/2 && y < by + bh/2) {
        startGame();
        swipeHandled = true;
      }
      return;
    }
    if (state === 'gameover') {
      const bx = W * 0.5, by = H * 0.68, bw = 180, bh = 52;
      if (x > bx - bw/2 && x < bx + bw/2 && y > by - bh/2 && y < by + bh/2) {
        startGame();
        swipeHandled = true;
      }
      return;
    }
  }

  function onPointerMove(x, y) {
    if (swipeHandled || state !== 'playing') return;
    const dx = x - touchStartX;
    const dy = y - touchStartY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const thr = 28;
    if (adx < thr && ady < thr) return;
    swipeHandled = true;
    if (adx > ady) {
      changeLane(dx > 0 ? 1 : -1);
    } else {
      if (dy < 0) tryJump();
      else trySlide();
    }
  }

  function onPointerUp(x, y) {
    if (swipeHandled || state !== 'playing') return;
    const dt = performance.now() - touchStartT;
    const dx = x - touchStartX, dy = y - touchStartY;
    if (dt < 280 && Math.hypot(dx, dy) < 18) {
      // tap thirds fallback
      if (x < W / 3) changeLane(-1);
      else if (x > (2 * W) / 3) changeLane(1);
      else tryJump();
    }
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onPointerDown(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onPointerUp(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    onPointerDown(e.clientX, e.clientY);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons === 1) onPointerMove(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseup', (e) => {
    onPointerUp(e.clientX, e.clientY);
  });

  // —— Update ——
  function update(dt) {
    menuPulse += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 28);

    // stars twinkle always
    for (const s of stars) s.tw += dt * s.sp;

    if (state === 'playing') {
      runTime += dt;
      speed = Math.min(MAX_SPEED, BASE_SPEED + distance * SPEED_GAIN * 0.01);
      distance += speed * dt * 18;

      // player lane lerp
      player.laneX += (player.lane - player.laneX) * Math.min(1, LANE_LERP * dt);
      player.bob += dt * 10 * (speed / BASE_SPEED);

      if (player.jumping) {
        player.jumpT += dt;
        if (player.jumpT >= JUMP_DURATION) {
          player.jumping = false;
          player.jumpT = 0;
        }
      }
      if (player.sliding) {
        player.slideT += dt;
        if (player.slideT >= SLIDE_DURATION) {
          player.sliding = false;
          player.slideT = 0;
        }
      }

      // move world
      const dz = speed * dt;
      for (const e of entities) {
        e.z -= dz;
        if (e.kind === 'coin') e.rot += dt * 5;
        if (e.type === 'laser') {
          e.t += dt;
          const cycle = e.onPeriod + e.offPeriod;
          e.active = (e.t % cycle) < e.onPeriod;
        }
      }
      entities = entities.filter(e => e.z > 0.6 && !e.taken);

      // spawn
      spawnTimer -= dt;
      const spawnInterval = Math.max(0.55, 1.35 - difficulty * 0.7 - (speed - BASE_SPEED) * 0.04);
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = spawnInterval * (0.85 + Math.random() * 0.35);
      }
      coinTimer -= dt;
      if (coinTimer <= 0) {
        spawnCoinCluster();
        coinTimer = 1.1 + Math.random() * 1.4;
      }

      // collisions
      const pLane = Math.round(player.laneX);
      for (const e of entities) {
        if (e.z < COLLIDE_Z_MIN || e.z > COLLIDE_Z_MAX) continue;

        if (e.kind === 'coin' && !e.taken) {
          if (e.lane === pLane && !player.sliding) {
            // allow pickup while jumping too
            e.taken = true;
            coins += 1;
            const p = project(e.lane, e.z);
            const jy = jumpOffset();
            spawnParticles(p.x, p.y - 30 - jy * 0.3, '#ffe566', 10);
          } else if (e.lane === pLane && player.sliding) {
            // still can collect while sliding if low enough conceptually — allow
            e.taken = true;
            coins += 1;
            const p = project(e.lane, e.z);
            spawnParticles(p.x, p.y - 20, '#ffe566', 8);
          }
          continue;
        }

        if (e.kind !== 'obstacle' || e.hit) continue;

        let hitsLane = false;
        if (e.type === 'laser') {
          hitsLane = pLane >= e.lane && pLane < e.lane + e.span;
        } else {
          hitsLane = e.lane === pLane;
        }
        if (!hitsLane) continue;

        let collide = false;
        if (e.type === 'block') {
          collide = true;
        } else if (e.type === 'low') {
          // must slide
          collide = !player.sliding;
        } else if (e.type === 'high') {
          // must jump
          collide = !player.jumping;
        } else if (e.type === 'laser') {
          collide = !!e.active;
          // jump or slide doesn't help vs laser (full barrier)
        }

        if (collide) {
          e.hit = true;
          const p = project(pLane, e.z);
          spawnParticles(p.x, p.y - 40, '#ff6688', 18);
          spawnParticles(p.x, p.y - 40, '#ffffff', 8);
          gameOver();
          break;
        }
      }
    } else if (state === 'gameover') {
      crashT = Math.max(0, crashT - dt);
      // keep drifting a bit
      for (const e of entities) {
        e.z -= speed * dt * 0.35;
        if (e.kind === 'coin') e.rot += dt * 2;
      }
    }

    // particles
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
    }
    particles = particles.filter(p => p.life > 0);

    score = Math.floor(distance) + coins * 10;
  }

  function jumpOffset() {
    if (!player || !player.jumping) return 0;
    const t = player.jumpT / JUMP_DURATION;
    return Math.sin(t * Math.PI) * JUMP_HEIGHT;
  }

  // —— Draw ——
  function drawBackground() {
    // deep space gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#040018');
    g.addColorStop(0.35, '#0a0a2e');
    g.addColorStop(0.7, '#0d1535');
    g.addColorStop(1, '#12102a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // nebulae
    for (const n of nebulae) {
      const nx = n.x * W, ny = n.y * H, nr = n.r * Math.min(W, H);
      const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, `rgba(${n.c[0]},${n.c[1]},${n.c[2]},${n.a})`);
      ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ng;
      ctx.beginPath();
      ctx.arc(nx, ny, nr, 0, Math.PI * 2);
      ctx.fill();
    }

    // stars
    for (const s of stars) {
      const a = s.a * (0.55 + 0.45 * Math.sin(s.tw));
      ctx.fillStyle = `rgba(220,230,255,${a})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPath() {
    const horizonY = H * 0.28;
    const groundY = H * 0.98;
    const vpX = W * 0.5;

    // path trapezoid fill
    const nearSpread = Math.min(W, H * 0.9) * 0.55;
    const farSpread = nearSpread * 0.06;

    ctx.beginPath();
    ctx.moveTo(vpX - farSpread, horizonY);
    ctx.lineTo(vpX + farSpread, horizonY);
    ctx.lineTo(vpX + nearSpread, groundY);
    ctx.lineTo(vpX - nearSpread, groundY);
    ctx.closePath();
    const pg = ctx.createLinearGradient(0, horizonY, 0, groundY);
    pg.addColorStop(0, 'rgba(40,60,120,0.35)');
    pg.addColorStop(0.5, 'rgba(30,50,100,0.45)');
    pg.addColorStop(1, 'rgba(20,30,70,0.55)');
    ctx.fillStyle = pg;
    ctx.fill();

    // glowing edge rails
    ctx.strokeStyle = 'rgba(100,180,255,0.55)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(80,160,255,0.8)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(vpX - farSpread, horizonY);
    ctx.lineTo(vpX - nearSpread, groundY);
    ctx.moveTo(vpX + farSpread, horizonY);
    ctx.lineTo(vpX + nearSpread, groundY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // lane dividers + scrolling stripes
    const scroll = (distance * 0.08) % 1;
    for (let i = 0; i < 24; i++) {
      const t0 = (i + scroll) / 24;
      const t1 = (i + 0.45 + scroll) / 24;
      if (t0 > 1) continue;
      const z0 = Z_FAR - t0 * (Z_FAR - Z_NEAR);
      const z1 = Z_FAR - Math.min(1, t1) * (Z_FAR - Z_NEAR);
      for (let lane = 0; lane < 3; lane++) {
        const p0 = project(lane, z0);
        const p1 = project(lane, z1);
        const w0 = zToScale(z0) * 1.8;
        const w1 = zToScale(z1) * 1.8;
        ctx.beginPath();
        ctx.moveTo(p0.x - w0, p0.y);
        ctx.lineTo(p0.x + w0, p0.y);
        ctx.lineTo(p1.x + w1, p1.y);
        ctx.lineTo(p1.x - w1, p1.y);
        ctx.closePath();
        const alpha = 0.15 + 0.25 * (1 - t0);
        ctx.fillStyle = `rgba(120,200,255,${alpha * 0.5})`;
        ctx.fill();
      }
    }

    // lane separator lines
    ctx.shadowBlur = 0;
    for (let side of [-0.5, 0.5]) {
      ctx.beginPath();
      const steps = 16;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const z = Z_FAR - t * t * (Z_FAR - Z_NEAR);
        const mid = project(1 + side, z); // between lanes: use offset
        // better: interpolate between lane centers
        const L = side < 0 ? 0 : 1;
        const R = side < 0 ? 1 : 2;
        const pl = project(L, z);
        const pr = project(R, z);
        const x = (pl.x + pr.x) * 0.5;
        const y = pl.y;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(140,190,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // vanishing glow
    const vg = ctx.createRadialGradient(vpX, horizonY, 0, vpX, horizonY, H * 0.2);
    vg.addColorStop(0, 'rgba(160,200,255,0.2)');
    vg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = vg;
    ctx.fillRect(vpX - H * 0.25, horizonY - H * 0.1, H * 0.5, H * 0.3);
  }

  function drawObstacle(e) {
    if (e.z <= 0.7) return;
    const p = project(e.lane, e.z);
    const s = p.s;

    if (e.type === 'block') {
      const w = s * 2.2, h = s * 3.2;
      const x = p.x - w / 2, y = p.y - h;
      const grd = ctx.createLinearGradient(x, y, x, y + h);
      grd.addColorStop(0, '#6a7cff');
      grd.addColorStop(1, '#2a3566');
      ctx.fillStyle = grd;
      ctx.strokeStyle = 'rgba(180,200,255,0.7)';
      ctx.lineWidth = Math.max(1, s * 0.08);
      roundRect(x, y, w, h, s * 0.15);
      ctx.fill();
      ctx.stroke();
      // hazard stripes
      ctx.save();
      ctx.beginPath();
      roundRect(x, y, w, h, s * 0.15);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,80,80,0.35)';
      for (let i = -2; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * s * 0.7, y);
        ctx.lineTo(x + i * s * 0.7 + s * 0.35, y);
        ctx.lineTo(x + i * s * 0.7 + s * 0.35 + h, y + h);
        ctx.lineTo(x + i * s * 0.7 + h, y + h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    } else if (e.type === 'low') {
      const w = s * 2.4, h = s * 1.1;
      const x = p.x - w / 2, y = p.y - h;
      ctx.fillStyle = '#ff8844';
      ctx.strokeStyle = '#ffcc88';
      ctx.lineWidth = Math.max(1, s * 0.08);
      roundRect(x, y, w, h, s * 0.12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + w * 0.1, y + h * 0.3, w * 0.8, h * 0.25);
      // slide hint chevron
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `bold ${Math.max(8, s * 0.55)}px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillText('▼', p.x, y + h * 0.72);
    } else if (e.type === 'high') {
      const w = s * 2.3, h = s * 1.4;
      const x = p.x - w / 2, y = p.y - s * 3.4;
      ctx.fillStyle = '#44ddaa';
      ctx.strokeStyle = '#aaffee';
      ctx.lineWidth = Math.max(1, s * 0.08);
      roundRect(x, y, w, h, s * 0.12);
      ctx.fill();
      ctx.stroke();
      // posts
      ctx.fillStyle = '#2a8866';
      ctx.fillRect(x + w * 0.1, y + h, s * 0.25, p.y - (y + h));
      ctx.fillRect(x + w * 0.75, y + h, s * 0.25, p.y - (y + h));
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = `bold ${Math.max(8, s * 0.55)}px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillText('▲', p.x, y + h * 0.7);
    } else if (e.type === 'laser') {
      const span = e.span || 1;
      const pL = project(e.lane, e.z);
      const pR = project(e.lane + span - 1, e.z);
      const y = pL.y - s * 1.8;
      const x0 = pL.x - s * 1.1;
      const x1 = pR.x + s * 1.1;
      // pylons
      ctx.fillStyle = '#8899bb';
      ctx.fillRect(x0 - s * 0.15, y - s * 0.8, s * 0.3, pL.y - (y - s * 0.8));
      ctx.fillRect(x1 - s * 0.15, y - s * 0.8, s * 0.3, pR.y - (y - s * 0.8));
      if (e.active) {
        const pulse = 0.7 + 0.3 * Math.sin(runTime * 20);
        ctx.shadowColor = '#ff2266';
        ctx.shadowBlur = 16 * pulse;
        ctx.strokeStyle = `rgba(255,40,100,${0.85 * pulse})`;
        ctx.lineWidth = Math.max(2, s * 0.22);
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,200,220,${0.9 * pulse})`;
        ctx.lineWidth = Math.max(1, s * 0.08);
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(255,100,140,0.2)';
        ctx.setLineDash([s * 0.3, s * 0.25]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function drawCoin(e) {
    if (e.taken || e.z <= 0.7) return;
    const p = project(e.lane, e.z);
    const s = Math.max(4, p.s * 0.55);
    const y = p.y - s * 2.2 - Math.sin(e.rot * 2) * s * 0.15;
    ctx.save();
    ctx.translate(p.x, y);
    ctx.rotate(Math.sin(e.rot) * 0.4);
    const sx = 0.55 + 0.45 * Math.abs(Math.cos(e.rot));
    ctx.scale(sx, 1);
    ctx.shadowColor = '#ffcc44';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe566';
    ctx.beginPath();
    ctx.arc(-s * 0.15, -s * 0.15, s * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#cc9900';
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.65, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawPlayer() {
    if (!player) return;
    const z = 1.55;
    const p = project(player.laneX, z);
    let jy = jumpOffset();
    let scaleY = 1;
    let scaleX = 1;
    let yOff = 0;

    if (player.sliding) {
      const t = player.slideT / SLIDE_DURATION;
      const squash = t < 0.15 ? t / 0.15 : t > 0.85 ? (1 - t) / 0.15 : 1;
      scaleY = 0.45 + 0.1 * (1 - squash);
      scaleX = 1.25;
      yOff = 18;
    }
    if (player.jumping) {
      scaleY = 1.05;
      scaleX = 0.95;
    }

    // bob while running
    if (!player.jumping && !player.sliding && !player.dead) {
      yOff += Math.sin(player.bob) * 3;
      scaleY *= 1 + Math.sin(player.bob * 2) * 0.03;
    }

    const baseH = Math.min(W, H) * 0.22;
    const aspect = astroImg.width / astroImg.height;
    const h = baseH * scaleY;
    const w = baseH * aspect * scaleX;

    let alpha = 1;
    if (player.dead) {
      alpha = 0.5 + 0.5 * Math.max(0, crashT / 0.45);
      // flash
      if (Math.floor(crashT * 20) % 2 === 0) alpha *= 0.6;
    }

    const x = p.x;
    const y = p.y - h * 0.15 - jy + yOff;

    // shadow
    ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 4, w * 0.35, h * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = alpha;
    if (player.dead && crashT > 0) {
      ctx.translate(x, y);
      ctx.rotate((0.45 - crashT) * 0.8 * (player.lane >= 1 ? 1 : -1));
      ctx.drawImage(astroImg, -w / 2, -h, w, h);
    } else {
      ctx.drawImage(astroImg, x - w / 2, y - h, w, h);
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (state !== 'playing' && state !== 'gameover') return;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(220,230,255,0.95)';
    ctx.font = `bold ${Math.max(16, Math.min(22, W * 0.045))}px system-ui`;
    ctx.shadowColor = 'rgba(0,0,40,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText('Score ' + (state === 'gameover' ? Math.floor(distance) + coins * 10 : score), 16, 32);
    ctx.font = `${Math.max(13, Math.min(16, W * 0.035))}px system-ui`;
    ctx.fillStyle = 'rgba(255,220,100,0.95)';
    ctx.fillText('★ ' + coins, 16, 54);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(180,200,255,0.8)';
    ctx.fillText('Record ' + best, W - 16, 32);
    ctx.shadowBlur = 0;

    // speed bar
    if (state === 'playing') {
      const t = (speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(W * 0.3, 14, W * 0.4, 6);
      ctx.fillStyle = `rgba(100,200,255,0.8)`;
      ctx.fillRect(W * 0.3, 14, W * 0.4 * t, 6);
    }
  }

  function drawButton(label, x, y, bw, bh, hot) {
    const pulse = 1 + Math.sin(menuPulse * 3) * 0.015;
    const w = bw * pulse, h = bh * pulse;
    ctx.save();
    ctx.shadowColor = 'rgba(80,140,255,0.55)';
    ctx.shadowBlur = hot ? 18 : 10;
    const g = ctx.createLinearGradient(x - w/2, y - h/2, x - w/2, y + h/2);
    g.addColorStop(0, '#4a6cff');
    g.addColorStop(1, '#2a3aaa');
    ctx.fillStyle = g;
    roundRect(x - w/2, y - h/2, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,210,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(18, Math.min(24, W * 0.05))}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawSwipeHints(cy) {
    ctx.save();
    ctx.fillStyle = 'rgba(180,200,255,0.55)';
    ctx.font = `${Math.max(12, Math.min(14, W * 0.032))}px system-ui`;
    ctx.textAlign = 'center';
    const gap = Math.min(90, W * 0.22);
    const items = [
      { t: '← →', s: 'Voies' },
      { t: '↑', s: 'Sauter' },
      { t: '↓', s: 'Glisser' }
    ];
    items.forEach((it, i) => {
      const x = W * 0.5 + (i - 1) * gap;
      ctx.fillStyle = 'rgba(140,180,255,0.25)';
      roundRect(x - 36, cy - 28, 72, 56, 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(220,235,255,0.9)';
      ctx.font = `bold ${Math.max(16, Math.min(20, W * 0.042))}px system-ui`;
      ctx.fillText(it.t, x, cy - 2);
      ctx.font = `${Math.max(10, Math.min(12, W * 0.028))}px system-ui`;
      ctx.fillStyle = 'rgba(180,200,255,0.7)';
      ctx.fillText(it.s, x, cy + 18);
    });
    ctx.restore();
  }

  function drawMenu() {
    drawBackground();
    drawPath();
    // ghost player
    if (assetsReady) {
      resetPlayer();
      player.bob = menuPulse * 8;
      drawPlayer();
    }

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(80,140,255,0.6)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#e8f0ff';
    ctx.font = `bold ${Math.max(36, Math.min(56, W * 0.12))}px system-ui`;
    ctx.fillText('ASTRO RUN', W * 0.5, H * 0.22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(160,190,255,0.85)';
    ctx.font = `${Math.max(14, Math.min(18, W * 0.04))}px system-ui`;
    ctx.fillText('Temple Run · Espace', W * 0.5, H * 0.22 + 36);

    if (best > 0) {
      ctx.fillStyle = 'rgba(255,220,100,0.8)';
      ctx.font = `${Math.max(13, Math.min(15, W * 0.035))}px system-ui`;
      ctx.fillText('Record : ' + best, W * 0.5, H * 0.22 + 62);
    }

    drawButton('Jouer', W * 0.5, H * 0.62, 160, 52, true);
    drawSwipeHints(H * 0.78);

    ctx.fillStyle = 'rgba(150,170,210,0.45)';
    ctx.font = `${Math.max(10, Math.min(12, W * 0.028))}px system-ui`;
    ctx.fillText('Clavier : flèches / WASD / Espace', W * 0.5, H * 0.92);
  }

  function drawGameOver() {
    // dim overlay
    ctx.fillStyle = 'rgba(5,5,20,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,60,100,0.5)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff6688';
    ctx.font = `bold ${Math.max(32, Math.min(48, W * 0.1))}px system-ui`;
    ctx.fillText('CRASH !', W * 0.5, H * 0.36);
    ctx.shadowBlur = 0;

    const finalScore = Math.floor(distance) + coins * 10;
    ctx.fillStyle = '#e8f0ff';
    ctx.font = `bold ${Math.max(22, Math.min(30, W * 0.07))}px system-ui`;
    ctx.fillText('Score ' + finalScore, W * 0.5, H * 0.46);
    ctx.fillStyle = 'rgba(255,220,100,0.9)';
    ctx.font = `${Math.max(14, Math.min(18, W * 0.04))}px system-ui`;
    ctx.fillText('★ ' + coins + '   ·   Record ' + best, W * 0.5, H * 0.52);

    if (finalScore >= best && finalScore > 0) {
      ctx.fillStyle = 'rgba(120,255,180,0.9)';
      ctx.font = `bold ${Math.max(13, Math.min(16, W * 0.036))}px system-ui`;
      ctx.fillText('Nouveau record !', W * 0.5, H * 0.58);
    }

    drawButton('Rejouer', W * 0.5, H * 0.68, 180, 52, true);
  }

  function drawLoading() {
    drawBackground();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,220,255,0.9)';
    ctx.font = `${Math.max(16, Math.min(20, W * 0.045))}px system-ui`;
    ctx.fillText(loadError ? 'Erreur de chargement…' : 'Chargement…', W * 0.5, H * 0.5);
    if (!loadError) {
      const w = 120, h = 4;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(W * 0.5 - w / 2, H * 0.5 + 24, w, h);
      const t = (Math.sin(menuPulse * 4) + 1) * 0.5;
      ctx.fillStyle = 'rgba(120,180,255,0.9)';
      ctx.fillRect(W * 0.5 - w / 2, H * 0.5 + 24, w * (0.3 + t * 0.7), h);
    }
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (state === 'loading') {
      drawLoading();
      ctx.restore();
      return;
    }

    if (state === 'menu') {
      drawMenu();
      ctx.restore();
      return;
    }

    drawBackground();
    drawPath();

    // sort entities far → near
    const sorted = entities.slice().sort((a, b) => b.z - a.z);
    for (const e of sorted) {
      if (e.kind === 'coin') drawCoin(e);
      else drawObstacle(e);
    }

    drawPlayer();
    drawParticles();
    drawHUD();

    if (state === 'gameover') drawGameOver();

    ctx.restore();
  }

  // —— Loop ——
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // boot
  initStars();
  resetPlayer();
  state = 'loading';

  astroImg.onload = function () {
    assetsReady = true;
    state = 'menu';
  };
  astroImg.onerror = function () {
    loadError = true;
  };
  astroImg.src = 'astro.png';

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
