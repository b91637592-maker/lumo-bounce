<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lumo Bounce — Espace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #050510;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #12122a 0%, #050510 70%);
  }
  #frame {
    position: relative; width: min(100vw, 420px); height: min(100vh, 100dvh);
    max-height: 100%; background: #000; overflow: hidden;
    box-shadow: 0 0 50px rgba(80, 120, 255, 0.22);
  }
  @media (min-width: 440px) {
    #frame { border-radius: 18px; max-height: min(96vh, 900px); height: min(96vh, 900px); }
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<div id="wrap"><div id="frame"><canvas id="c"></canvas></div></div>
<script>
(() => {
"use strict";

const C = {
  designW: 390, designH: 844,
  gravity: -850, playerR: 22, playerHSpeed: 430, playerMaxHSpeed: 540,
  tiltMax: 16 * Math.PI / 180,
  jumpNormal: 700, jumpBouncy: 1080, jumpSuper: 1420,
  wrapPad: 24, camLag: 0.12, cullMargin: 220,
  platH: 16, platMinW: 70, platMaxW: 120,
  platBaseSpace: 95, platMinSpace: 55, platMaxSpace: 145, genAhead: 950,
  movingSpeed: 85, disappearDelay: 0.55, bonusChance: 0.04,
  coinR: 11, coinValue: 10, powerSize: 28, coinChance: 0.26, powerChance: 0.07,
  jetpackDur: 3.5, superBounceDur: 8, shieldDur: 10, magnetDur: 7, slowDur: 6,
  jetpackThrust: 920, diffStep: 750, maxDiff: 2.4, heightFactor: 0.1,
  bulletSpeed: 780, bulletR: 5, fireCooldown: 0.18, monsterChance: 0.22,
  BEST_KEY: "lumoBounceBestScore", SOUND_KEY: "lumoBounceSound", CTRL_KEY: "lumoBounceControl",
  WALLET_KEY: "lumoBounceWallet", OWNED_KEY: "lumoBounceOwned", EQUIP_KEY: "lumoBounceEquipped",
  ROCKETS_KEY: "lumoBounceRockets", EXTRAS_KEY: "lumoBounceExtras",
};

const COL = {
  primary: "#6e8cff", secondary: "#ff7ad1", accent: "#5ef2c8", warning: "#ffd24a",
  danger: "#ff4d6d", coin: "#ffd633", coinShine: "#fff2b3",
  jetpack: "#ff6b3d", superBounce: "#9b6bff", shield: "#4dd9ff", magnet: "#ff80b3", slowdown: "#73f2d9",
  hudText: "#ffffff", buttonFill: "rgba(40,48,90,0.92)", menuTitle: "#e8f0ff",
  overlay: "rgba(0,0,0,0.58)",
  platNormal: "#7ec8ff", platMoving: "#6ea8ff", platDisappear: "#ff9a6b",
  platBouncy: "#d07cff", platBonus: "#ffe066",
};

const PLAT_COLORS = { normal: COL.platNormal, moving: COL.platMoving, disappearing: COL.platDisappear, bouncy: COL.platBouncy, bonus: COL.platBonus };
const POWER_COLORS = { jetpack: COL.jetpack, superBounce: COL.superBounce, shield: COL.shield, magnet: COL.magnet, slowdown: COL.slowdown };
const POWER_LETTERS = { jetpack: "J", superBounce: "B", shield: "S", magnet: "M", slowdown: "R" };
const POWER_DURS = { jetpack: C.jetpackDur, superBounce: C.superBounceDur, shield: C.shieldDur, magnet: C.magnetDur, slowdown: C.slowDur };
const POWER_TYPES = Object.keys(POWER_DURS);

const SKINS = [
  { id: "classic", name: "Astronaute", price: 0, suit: "#e8eef8", visor: "#5ad0ff", pack: "#6e7a90", free: true },
  { id: "neon", name: "Néon", price: 80, suit: "#59f2bf", visor: "#1affd5", pack: "#0a6655" },
  { id: "ghost", name: "Spectre", price: 120, suit: "#dce6ff", visor: "#a8b8ff", pack: "#8890b8", ghost: true },
  { id: "robot", name: "Mecha", price: 180, suit: "#9aa4b8", visor: "#59f2bf", pack: "#4a5266", robot: true },
  { id: "fire", name: "Plasma", price: 250, suit: "#ff7040", visor: "#ffd040", pack: "#992200", fire: true },
  { id: "galaxy", name: "Nova", price: 400, suit: "#6b4dff", visor: "#ff80ff", pack: "#2a1066", galaxy: true },
];
const ROCKETS = [
  { id: "mini", name: "Mini fusée", price: 40, desc: "Jetpack 2.5s", dur: 2.5, thrust: 850 },
  { id: "super", name: "Super fusée", price: 90, desc: "Jetpack 4.5s", dur: 4.5, thrust: 1050 },
  { id: "mega", name: "Méga fusée", price: 180, desc: "Jetpack 6s", dur: 6.0, thrust: 1250 },
];
const EXTRAS = [
  { id: "start_shield", name: "Bouclier départ", price: 60, desc: "Bouclier en début" },
  { id: "lucky", name: "Chance pièce", price: 100, desc: "Pièces +50%" },
  { id: "slow_start", name: "Ralentisseur", price: 70, desc: "Plateformes lentes 8s" },
  { id: "revive", name: "2e chance", price: 150, desc: "1 revive / partie" },
];

function jumpMult(type) { return type === "bouncy" ? 1.55 : type === "bonus" ? 1.25 : 1; }
function coinBonus(type) { return type === "bonus" ? 25 : 0; }

function getBest() { return parseInt(localStorage.getItem(C.BEST_KEY) || "0", 10) || 0; }
function setBest(n) { localStorage.setItem(C.BEST_KEY, String(n)); }
function getSound() { const v = localStorage.getItem(C.SOUND_KEY); return v === null ? true : v === "1"; }
function setSound(on) { localStorage.setItem(C.SOUND_KEY, on ? "1" : "0"); }
function getControl() { return localStorage.getItem(C.CTRL_KEY) || "touch"; }
function setControl(m) { localStorage.setItem(C.CTRL_KEY, m); }

function getWallet() { return parseInt(localStorage.getItem(C.WALLET_KEY) || "0", 10) || 0; }
function setWallet(n) { localStorage.setItem(C.WALLET_KEY, String(Math.max(0, n|0))); }
function addWallet(n) { setWallet(getWallet() + (n|0)); return getWallet(); }
function getOwned() { try { return JSON.parse(localStorage.getItem(C.OWNED_KEY) || '["classic"]'); } catch(_) { return ["classic"]; } }
function setOwned(a) { localStorage.setItem(C.OWNED_KEY, JSON.stringify(a)); }
function owns(id) { return getOwned().includes(id); }
function getEquip() { try { return JSON.parse(localStorage.getItem(C.EQUIP_KEY) || '{"skin":"classic"}'); } catch(_) { return { skin: "classic" }; } }
function setEquip(o) { localStorage.setItem(C.EQUIP_KEY, JSON.stringify(o)); }
function getSkin() { return SKINS.find(s => s.id === (getEquip().skin || "classic")) || SKINS[0]; }
function getRocketStock() { try { return JSON.parse(localStorage.getItem(C.ROCKETS_KEY) || "{}"); } catch(_) { return {}; } }
function setRocketStock(o) { localStorage.setItem(C.ROCKETS_KEY, JSON.stringify(o)); }
function rocketCount(id) { return getRocketStock()[id] || 0; }
function addRocket(id, n) { const o = getRocketStock(); o[id] = (o[id]||0)+n; if (o[id]<=0) delete o[id]; setRocketStock(o); }
function getExtraStock() { try { return JSON.parse(localStorage.getItem(C.EXTRAS_KEY) || "{}"); } catch(_) { return {}; } }
function setExtraStock(o) { localStorage.setItem(C.EXTRAS_KEY, JSON.stringify(o)); }
function extraCount(id) { return getExtraStock()[id] || 0; }
function addExtra(id, n) { const o = getExtraStock(); o[id] = (o[id]||0)+n; if (o[id]<=0) delete o[id]; setExtraStock(o); }
function buySkin(id) {
  const s = SKINS.find(x => x.id === id); if (!s || owns(id) || getWallet() < s.price) return false;
  setWallet(getWallet()-s.price); const o=getOwned(); o.push(id); setOwned(o); const e=getEquip(); e.skin=id; setEquip(e); return true;
}
function equipSkin(id) { if (!owns(id)) return false; const e=getEquip(); e.skin=id; setEquip(e); return true; }
function buyRocket(id) { const r=ROCKETS.find(x=>x.id===id); if(!r||getWallet()<r.price)return false; setWallet(getWallet()-r.price); addRocket(id,1); return true; }
function buyExtra(id) { const e=EXTRAS.find(x=>x.id===id); if(!e||getWallet()<e.price)return false; setWallet(getWallet()-e.price); addExtra(id,1); return true; }

let audioCtx = null, soundOn = getSound();
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, type, vol, slideTo) {
  if (!soundOn) return; ensureAudio(); if (!audioCtx) return;
  const t0 = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || "sine"; osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  gain.gain.setValueAtTime(vol || 0.12, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const SFX = {
  jump: () => beep(320, 0.08, "triangle", 0.1, 520),
  bouncy: () => beep(280, 0.12, "square", 0.08, 700),
  coin: () => { beep(880, 0.06, "sine", 0.1); setTimeout(() => beep(1175, 0.08, "sine", 0.08), 40); },
  powerUp: () => { beep(440, 0.08, "sawtooth", 0.07); setTimeout(() => beep(660, 0.1, "sawtooth", 0.07), 60); },
  bonus: () => beep(523, 0.15, "triangle", 0.1, 1046),
  crack: () => beep(180, 0.2, "sawtooth", 0.06, 60),
  death: () => beep(200, 0.4, "sawtooth", 0.1, 40),
  gameOver: () => { beep(300, 0.2, "triangle", 0.1, 150); setTimeout(() => beep(180, 0.35, "triangle", 0.08, 80), 180); },
  button: () => beep(500, 0.05, "sine", 0.08),
  shieldBreak: () => beep(600, 0.15, "square", 0.07, 200),
  shoot: () => beep(760, 0.05, "square", 0.07, 420),
  hit: () => beep(140, 0.12, "sawtooth", 0.09, 60),
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = C.designW, H = C.designH, dpr = 1;
function resize() {
  const frame = document.getElementById("frame");
  const rect = frame.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = C.designW;
  H = Math.round(C.designW * (rect.height / Math.max(1, rect.width)));
  H = Math.max(560, Math.min(980, H));
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize); resize();

const keys = Object.create(null);
let pointerDown = false, pointerX = W/2, lastPointerX = null, horizontalInput = 0, uiHit = null;
let pointerMoved = false, fireCd = 0;

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Escape") {
    e.preventDefault();
    if (state === "playing") pauseGame();
    else if (state === "paused") resumeGame();
  }
  if (e.code === "Space" && state === "playing") { e.preventDefault(); tryShoot(); }
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyA","KeyD"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}

function onPointerDown(e) {
  ensureAudio(); e.preventDefault();
  const p = canvasPos(e);
  pointerDown = true; pointerX = p.x; lastPointerX = p.x; pointerMoved = false;
  uiHit = hitUI(p.x, p.y);
  if (!uiHit && state === "playing") {
    updatePointerSteer(p.x, true);
    tryShoot(); // clic = tir pendant le saut
  }
}
function onPointerMove(e) {
  if (!pointerDown) return; e.preventDefault();
  const p = canvasPos(e);
  if (lastPointerX != null && Math.abs(p.x - lastPointerX) > 6) pointerMoved = true;
  pointerX = p.x;
  if (!uiHit && state === "playing") updatePointerSteer(p.x, false);
  lastPointerX = p.x;
}
function onPointerUp(e) {
  e.preventDefault();
  const p = e.changedTouches
    ? (() => { const r = canvas.getBoundingClientRect(); const t = e.changedTouches[0]; return { x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H }; })()
    : canvasPos(e);
  if (uiHit) { const hit = hitUI(p.x, p.y); if (hit && hit === uiHit) handleUI(hit); }
  pointerDown = false; lastPointerX = null; uiHit = null;
}

canvas.addEventListener("mousedown", onPointerDown);
canvas.addEventListener("mousemove", onPointerMove);
window.addEventListener("mouseup", onPointerUp);
canvas.addEventListener("touchstart", onPointerDown, { passive: false });
canvas.addEventListener("touchmove", onPointerMove, { passive: false });
canvas.addEventListener("touchend", onPointerUp, { passive: false });
canvas.addEventListener("touchcancel", onPointerUp, { passive: false });

function updatePointerSteer(x, isStart) {
  const mode = getControl();
  if (mode === "keys") return;
  if (mode === "follow") { horizontalInput = Math.max(-1, Math.min(1, ((x / W) * 2 - 1) * 1.15)); return; }
  const normalized = (x / W) * 2 - 1;
  let deltaInfluence = 0;
  if (lastPointerX != null && !isStart) deltaInfluence = Math.max(-1, Math.min(1, (x - lastPointerX) / 18));
  horizontalInput = Math.max(-1, Math.min(1, normalized * 0.85 + deltaInfluence * 0.35));
}
function pollInput(dt) {
  const mode = getControl();
  let keyIn = 0;
  if (keys.ArrowLeft || keys.KeyA) keyIn -= 1;
  if (keys.ArrowRight || keys.KeyD) keyIn += 1;
  if (mode === "keys") horizontalInput = keyIn;
  else if (mode === "follow") {
    if (!pointerDown) {
      if (keyIn) horizontalInput = keyIn;
      else { horizontalInput *= Math.pow(0.01, dt); if (Math.abs(horizontalInput) < 0.02) horizontalInput = 0; }
    }
  } else {
    if (keyIn) horizontalInput = keyIn;
    else if (!pointerDown) { horizontalInput *= Math.pow(0.02, dt); if (Math.abs(horizontalInput) < 0.02) horizontalInput = 0; }
  }
}

let buttons = [];
function clearButtons() { buttons = []; }
function addBtn(id, x, y, w, h) { buttons.push({ id, x, y, w, h }); }
function hitUI(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x - b.w/2 && x <= b.x + b.w/2 && y >= b.y - b.h/2 && y <= b.y + b.h/2) return b.id;
  }
  return null;
}
function handleUI(id) {
  SFX.button(); ensureAudio();
  if (id.startsWith("buy_skin_")) { buySkin(id.slice(9)); return; }
  if (id.startsWith("eq_skin_")) { equipSkin(id.slice(8)); return; }
  if (id.startsWith("buy_rocket_")) { buyRocket(id.slice(11)); return; }
  if (id.startsWith("buy_extra_")) { buyExtra(id.slice(10)); return; }
  switch (id) {
    case "play": startGame(); break;
    case "best": showBestPanel = !showBestPanel; break;
    case "shop": state = "shop"; shopTab = "skins"; shopScroll = 0; break;
    case "settings": state = "settings"; break;
    case "back": state = "menu"; showBestPanel = false; break;
    case "tab_skins": shopTab = "skins"; shopScroll = 0; break;
    case "tab_rockets": shopTab = "rockets"; shopScroll = 0; break;
    case "tab_extras": shopTab = "extras"; shopScroll = 0; break;
    case "shop_up": shopScroll = Math.max(0, shopScroll - 1); break;
    case "shop_down": shopScroll = Math.min(12, shopScroll + 1); break;
    case "sound": soundOn = !soundOn; setSound(soundOn); break;
    case "ctrl_touch": setControl("touch"); break;
    case "ctrl_follow": setControl("follow"); break;
    case "ctrl_keys": setControl("keys"); break;
    case "pause": pauseGame(); break;
    case "resume": resumeGame(); break;
    case "restart": startGame(); break;
    case "menu": state = "menu"; break;
    case "replay": startGame(); break;
  }
}

let state = "menu", showBestPanel = false, shopTab = "skins", shopScroll = 0;
let player, platforms, coins, powerUps, monsters, bullets;
let camY, highestCamY, startY, score, coinsCollected, maxHeight, bestScore;
let isGameOver, gameOverTimer, lastTime = 0, highestPlatY = 0;
let menuOrbs = [], particles = [], stars = [], activePowers = {};
let newBestFlag = false, hintAlpha = 1, coinsBanked = false;
let runReviveAvailable = false, runCoinMult = 1, runRocketThrust = C.jetpackThrust;
let spacePhase = 0;

function nowSec() { return performance.now() / 1000; }
function hasPower(t) { return !!activePowers[t] && activePowers[t] > nowSec(); }
function difficultyFactor(height) { return Math.min(C.maxDiff, (height / C.diffStep) * 0.35); }

function makePlayer(x, y) {
  return { x, y, vx: 0, vy: 0, r: C.playerR, alive: true, scaleX: 1, scaleY: 1, rot: 0, lean: 0, squashT: 0 };
}
function makePlatform(type, width, x, y) {
  const p = { type, w: width, h: C.platH, x, y, originX: x, active: true, alpha: 1, moveSpeed: 0, moveDir: 1, moveRange: 0, disappearTriggered: false, disappearT: 0, pulse: Math.random()*Math.PI*2, scaleY: 1 };
  if (type === "moving") { p.moveSpeed = C.movingSpeed*(0.7+Math.random()*0.7); p.moveDir = Math.random()<0.5?1:-1; p.moveRange = 40+Math.random()*70; }
  return p;
}
function makeCoin(x, y) { return { x, y, r: C.coinR, value: C.coinValue, alive: true, phase: Math.random()*Math.PI*2 }; }
function makePower(type, x, y) { return { type, x, y, size: C.powerSize, alive: true, phase: Math.random()*Math.PI*2 }; }
function makeMonster(type, x, y) {
  const hp = type === "ufo" ? 3 : type === "spike" ? 2 : 1;
  return { type, x, y, originX: x, r: type === "ufo" ? 20 : 16, alive: true, hp, phase: Math.random()*Math.PI*2, dir: Math.random()<0.5?1:-1, speed: 40+Math.random()*50 };
}
function makeBullet(x, y) { return { x, y, vy: C.bulletSpeed, r: C.bulletR, alive: true }; }

function pickType(diff) {
  if (Math.random() < C.bonusChance * (1 + diff)) return "bonus";
  const movingW = Math.min(0.28, 0.08 + diff * 0.12);
  const disappearW = Math.min(0.25, 0.05 + diff * 0.12);
  const bouncyW = Math.min(0.18, 0.08 + diff * 0.05);
  const roll = Math.random(); let acc = 0;
  acc += movingW; if (roll < acc) return "moving";
  acc += disappearW; if (roll < acc) return "disappearing";
  acc += bouncyW; if (roll < acc) return "bouncy";
  return "normal";
}
function platformWidth(diff, type) {
  const shrink = Math.min(0.45, diff * 0.2);
  const minW = C.platMinW * (1 - shrink * 0.5), maxW = C.platMaxW * (1 - shrink);
  let w = minW + Math.random() * Math.max(10, maxW - minW);
  if (type === "bonus") w = Math.max(w, 100);
  if (type === "bouncy") w *= 0.9;
  return w;
}
function spacing(diff) {
  return Math.max(C.platMinSpace, C.platBaseSpace + Math.min(C.platMaxSpace - C.platBaseSpace, diff * 35) + (-12 + Math.random() * 30));
}
function pickMonsterType(diff) {
  if (diff > 1.2 && Math.random() < 0.25) return "ufo";
  if (diff > 0.5 && Math.random() < 0.4) return "spike";
  return "blob";
}

function spawnRow(y, diff) {
  const type = pickType(diff);
  const width = platformWidth(diff, type);
  const margin = 40;
  const x = margin + Math.random() * (W - 2 * margin);
  platforms.push(makePlatform(type, width, x, y));
  if (Math.random() < C.coinChance) coins.push(makeCoin(x + (-20 + Math.random()*40), y + 28));
  if (Math.random() < C.powerChance * (0.6 + diff * 0.4)) {
    const pType = POWER_TYPES[(Math.random()*POWER_TYPES.length)|0];
    powerUps.push(makePower(pType, Math.min(W-30, Math.max(30, x + (-50+Math.random()*100))), y + 40));
  }
  // Monsters appear after some height
  if (y > startY + 350 && Math.random() < C.monsterChance * (0.5 + diff)) {
    const mx = Math.min(W-30, Math.max(30, x + (-60 + Math.random()*120)));
    monsters.push(makeMonster(pickMonsterType(diff), mx, y + 55 + Math.random()*30));
  }
}

function spawnInitial() {
  platforms = []; coins = []; powerUps = []; monsters = []; bullets = [];
  platforms.push(makePlatform("normal", 130, W/2, startY));
  highestPlatY = startY;
  let y = startY + C.platBaseSpace;
  for (let i = 0; i < 12; i++) { spawnRow(y, 0); y += spacing(0); }
  highestPlatY = y;
}

function tryShoot() {
  if (state !== "playing" || !player || !player.alive) return;
  if (fireCd > 0) return;
  fireCd = C.fireCooldown;
  bullets.push(makeBullet(player.x, player.y + player.r * 0.4));
  SFX.shoot();
}

function startGame() {
  startY = 120;
  player = makePlayer(W/2, startY + C.playerR + C.platH);
  score = 0; coinsCollected = 0; maxHeight = 0; bestScore = getBest();
  activePowers = {}; particles = []; isGameOver = false; gameOverTimer = 0;
  newBestFlag = false; hintAlpha = 1; coinsBanked = false;
  runCoinMult = 1; runReviveAvailable = false; runRocketThrust = C.jetpackThrust; fireCd = 0;
  camY = H/2; highestCamY = camY; spawnInitial();
  const stock = getRocketStock();
  for (const rid of ["mega","super","mini"]) {
    if ((stock[rid]||0) > 0) {
      addRocket(rid, -1); const r = ROCKETS.find(x => x.id === rid);
      activePowers.jetpack = nowSec() + r.dur; runRocketThrust = r.thrust; break;
    }
  }
  if (extraCount("start_shield") > 0) { addExtra("start_shield", -1); activePowers.shield = nowSec() + C.shieldDur; }
  if (extraCount("lucky") > 0) { addExtra("lucky", -1); runCoinMult = 1.5; }
  if (extraCount("slow_start") > 0) { addExtra("slow_start", -1); activePowers.slowdown = nowSec() + 8; }
  if (extraCount("revive") > 0) { addExtra("revive", -1); runReviveAvailable = true; }
  player.vy = C.jumpNormal * 0.85; SFX.jump(); state = "playing"; lastTime = 0;
}
function pauseGame() { if (state !== "playing") return; state = "paused"; SFX.button(); }
function resumeGame() { if (state !== "paused") return; state = "playing"; lastTime = 0; SFX.button(); }
function recomputeScore() { score = Math.floor(maxHeight * C.heightFactor) + coinsCollected; }
function activatePower(type) {
  activePowers[type] = nowSec() + POWER_DURS[type];
  SFX.powerUp(); spawnBurst(player.x, player.y, POWER_COLORS[type], 10);
}
function expirePowers() {
  const t = nowSec();
  for (const k of Object.keys(activePowers)) if (activePowers[k] <= t) delete activePowers[k];
}
function bouncePlayer(impulse) {
  player.vy = impulse; player.squashT = 0.22; player.scaleX = 1.25; player.scaleY = 0.75; SFX.jump();
}
function landOnPlatform(plat) {
  if (!plat.active) return 0;

  else if (plat.type === "bouncy") { impulse = C.jumpBouncy; plat.scaleY = 0.55; SFX.bouncy(); }
  if (plat.type === "disappearing" && !plat.disappearTriggered) { plat.disappearTriggered = true; plat.disappearT = C.disappearDelay; SFX.crack(); }
  if (plat.type === "bonus") { SFX.bonus(); coinsCollected += coinBonus(plat.type); recomputeScore(); spawnBurst(plat.x, plat.y, COL.platBonus, 8); }

}
function triggerGameOver() {

  isGameOver = true; player.alive = false; SFX.death(); setTimeout(() => SFX.gameOver(), 200);
  bestScore = getBest();
  if (score > bestScore) { setBest(score); bestScore = score; newBestFlag = true; }
  if (!coinsBanked) { addWallet(coinsCollected); coinsBanked = true; }
  gameOverTimer = 0.7;
}
function spawnBurst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = 80+Math.random()*180;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.35+Math.random()*0.3, max: 0.5, color, r: 2+Math.random()*3 });
  }
}
function initStars() {
  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random()*W, y: Math.random()*4000, r: Math.random()*1.8+0.3, a: 0.3+Math.random()*0.7, tw: Math.random()*Math.PI*2 });
}
function initMenuOrbs() {
  menuOrbs = [];
  for (let i = 0; i < 12; i++) {
    menuOrbs.push({ x: 20+Math.random()*(W-40), y: 80+Math.random()*(H-160), r: 6+Math.random()*14,
      color: [COL.primary, COL.secondary, COL.accent, COL.warning][(Math.random()*4)|0],
      vx: -15+Math.random()*30, vy: -20+Math.random()*40, a: 0.15+Math.random()*0.15 });
  }
}
initStars(); initMenuOrbs();

function updatePlaying(dt) {
  pollInput(dt); expirePowers();
  if (fireCd > 0) fireCd -= dt;

  const targetDX = horizontalInput * C.playerHSpeed;
  player.vx += (targetDX - player.vx) * Math.min(1, dt * 12);
  player.vx = Math.max(-C.playerMaxHSpeed, Math.min(C.playerMaxHSpeed, player.vx));
  const leanTarget = -horizontalInput * C.tiltMax;
  player.lean += (leanTarget - player.lean) * Math.min(1, dt * 10);
  player.rot = player.lean;

  const stretchY = 1 + Math.max(-0.15, Math.min(0.2, player.vy / 2000));
  const stretchX = 1 / Math.sqrt(Math.max(0.7, stretchY));
  if (player.squashT > 0) {
    player.squashT -= dt;
    const t = 1 - player.squashT / 0.22;
    if (t >= 0.35 && t < 0.65) { player.scaleX += (0.9 - player.scaleX)*0.4; player.scaleY += (1.15 - player.scaleY)*0.4; }
    else if (t >= 0.65) { player.scaleX += (1 - player.scaleX)*0.35; player.scaleY += (1 - player.scaleY)*0.35; }
  } else {
    player.scaleX += (stretchX - player.scaleX) * Math.min(1, dt * 14);
    player.scaleY += (stretchY - player.scaleY) * Math.min(1, dt * 14);
  }

  player.vy += C.gravity * dt;
  if (hasPower("jetpack") && player.alive) {
    const th = runRocketThrust || C.jetpackThrust;
    player.vy = Math.max(player.vy, th * 0.55);
    player.vy += th * 0.55 * dt;
  }
  player.x += player.vx * dt; player.y += player.vy * dt;
  if (player.x < -C.wrapPad) player.x = W + C.wrapPad;
  else if (player.x > W + C.wrapPad) player.x = -C.wrapPad;

  if (player.alive && player.vy <= 80) {
    const pBottom = player.y - player.r * 0.7;
    for (const plat of platforms) {
      if (!plat.active || plat.alpha < 0.3) continue;
      const halfW = plat.w * 0.48;
      if (player.x < plat.x - halfW || player.x > plat.x + halfW) continue;
      const platTop = plat.y + plat.h * 0.35;
      if (pBottom >= platTop - 18 && pBottom <= platTop + 14) {
        const impulse = landOnPlatform(plat);
        if (impulse > 0) { player.y = platTop + player.r * 0.7; bouncePlayer(impulse); }
        break;
      }
    }
  }

  for (const coin of coins) {
    if (!coin.alive) continue;
    const dx = coin.x - player.x, dy = coin.y - player.y, dist = Math.hypot(dx, dy);
    if (hasPower("magnet") && dist < 160 && dist > 0.1) {
      coin.x -= (dx / dist) * 520 * dt; coin.y -= (dy / dist) * 520 * dt;
    }
    if (Math.hypot(coin.x - player.x, coin.y - player.y) < player.r + coin.r) {
      coin.alive = false; coinsCollected += Math.round(coin.value * runCoinMult);
      recomputeScore(); SFX.coin(); spawnBurst(coin.x, coin.y, COL.coin, 6);
    }
  }
  for (const pu of powerUps) {
    if (!pu.alive) continue;
    if (Math.hypot(pu.x - player.x, pu.y - player.y) < player.r + pu.size * 0.45) {
      pu.alive = false; activatePower(pu.type);
    }
  }

  // Bullets
  for (const b of bullets) {
    if (!b.alive) continue;
    b.y += b.vy * dt;
    if (b.y > camY + H) b.alive = false;
  }

  // Monsters
  const slow = hasPower("slowdown");
  for (const m of monsters) {
    if (!m.alive) continue;
    m.phase += dt * 3;
    if (m.type === "blob") { m.x = m.originX + Math.sin(m.phase) * 35; m.y += Math.sin(m.phase * 0.7) * 8 * dt; }
    else if (m.type === "spike") { m.x += m.dir * m.speed * (slow ? 0.4 : 1) * dt; if (m.x < 24 || m.x > W-24) m.dir *= -1; }
    else { m.x += m.dir * m.speed * 0.7 * (slow ? 0.4 : 1) * dt; m.y += Math.sin(m.phase) * 20 * dt; if (m.x < 30 || m.x > W-30) m.dir *= -1; }

    // bullet hits
    for (const b of bullets) {
      if (!b.alive || !m.alive) continue;
      if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + b.r) {
        b.alive = false; m.hp -= 1; SFX.hit();
        spawnBurst(m.x, m.y, "#ff6688", 5);
        if (m.hp <= 0) {
          m.alive = false; coinsCollected += m.type === "ufo" ? 30 : m.type === "spike" ? 20 : 12;
          recomputeScore(); spawnBurst(m.x, m.y, COL.warning, 10);
        }
      }
    }

    // player contact
    if (player.alive && Math.hypot(m.x - player.x, m.y - player.y) < m.r + player.r * 0.85) {
      if (hasPower("shield")) {
        delete activePowers.shield; SFX.shieldBreak();
        m.alive = false; spawnBurst(m.x, m.y, COL.shield, 8);
      } else if (runReviveAvailable) {
        runReviveAvailable = false; SFX.shieldBreak();
        player.y = camY - H * 0.15; bouncePlayer(C.jumpNormal * 1.25);
        m.alive = false;
      } else {
        triggerGameOver();
      }
    }
  }

  for (const plat of platforms) {
    plat.pulse += dt * 3;
    if (plat.type === "moving" && plat.active) {
      const factor = slow ? 0.35 : 1;
      plat.x += plat.moveDir * plat.moveSpeed * factor * dt;
      if (Math.abs(plat.x - plat.originX) >= plat.moveRange) { plat.moveDir *= -1; plat.x = plat.originX + plat.moveDir * plat.moveRange * 0.98; }
    }
    if (plat.type === "bouncy") plat.scaleY += ((1 + Math.sin(plat.pulse)*0.1) - plat.scaleY) * Math.min(1, dt*8);
    if (plat.disappearTriggered && plat.active) {
      plat.disappearT -= dt; plat.alpha = 0.35 + 0.65 * Math.abs(Math.sin(plat.disappearT * 40));
      if (plat.disappearT <= 0) { plat.alpha -= dt * 5; if (plat.alpha <= 0) { plat.active = false; plat.alpha = 0; } }
    }
  }

  const followY = player.y + H * 0.15;
  if (followY > highestCamY) highestCamY = followY;
  camY += (Math.max(H/2, highestCamY) - camY) * Math.min(1, C.camLag * 60 * dt);

  const diff = difficultyFactor(Math.max(0, camY));
  while (highestPlatY < camY + C.genAhead) { highestPlatY += spacing(diff); spawnRow(highestPlatY, diff); }

  const cullY = camY - H/2 - C.cullMargin;
  platforms = platforms.filter(p => p.y >= cullY && (p.active || p.alpha > 0));
  coins = coins.filter(c => c.alive && c.y >= cullY);
  powerUps = powerUps.filter(p => p.alive && p.y >= cullY);
  monsters = monsters.filter(m => m.alive && m.y >= cullY - 40);
  bullets = bullets.filter(b => b.alive);

  const height = Math.max(0, player.y - startY);
  if (height > maxHeight) maxHeight = height;
  recomputeScore();
  spacePhase = Math.min(1, maxHeight / 5500);

  const killY = camY - H/2 - 40;
  if (player.alive && player.y < killY) {
    if (hasPower("shield")) { delete activePowers.shield; SFX.shieldBreak(); player.y = camY - H*0.2; bouncePlayer(C.jumpNormal*1.1); }
    else if (runReviveAvailable) { runReviveAvailable = false; SFX.shieldBreak(); player.y = camY - H*0.15; bouncePlayer(C.jumpNormal*1.25); }
    else triggerGameOver();
  }
  if (!player.alive) {
    player.rot += dt * Math.PI * 3.5;
    player.scaleX = Math.max(0.05, player.scaleX - dt*1.6);
    player.scaleY = Math.max(0.05, player.scaleY - dt*1.6);
    gameOverTimer -= dt; if (gameOverTimer <= 0) state = "gameover";
  }
  hintAlpha = Math.max(0, hintAlpha - dt * 0.22);
  for (const p of particles) { p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy -= 200*dt; }
  particles = particles.filter(p => p.life > 0);
}

function updateMenu(dt) {
  for (const o of menuOrbs) {
    o.x += o.vx*dt; o.y += o.vy*dt;
    if (o.x < 10 || o.x > W-10) o.vx *= -1;
    if (o.y < 40 || o.y > H-40) o.vy *= -1;
  }
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath();
}
function hexToRgb(hex) {
  if (hex.startsWith("rgb")) { const m = hex.match(/[\d.]+/g); return m ? { r:+m[0], g:+m[1], b:+m[2] } : null; }
  const h = hex.replace("#",""); const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function lerpColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b); if (!pa||!pb) return a;
  return `rgb(${(pa.r+(pb.r-pa.r)*t)|0},${(pa.g+(pb.g-pa.g)*t)|0},${(pa.b+(pb.b-pa.b)*t)|0})`;
}
function worldToScreen(y) { return H/2 - (y - camY); }

function drawSpaceBackground() {
  // Layers: sky → stratosphere → orbit → deep space → nebula → void
  const h = (state === "playing" || state === "paused" || state === "gameover") ? maxHeight : 0;
  const t1 = Math.min(1, h / 900);
  const t2 = Math.min(1, Math.max(0, (h - 900) / 1200));
  const t3 = Math.min(1, Math.max(0, (h - 2100) / 1500));
  const t4 = Math.min(1, Math.max(0, (h - 3600) / 2000));

  let c0 = lerpColor("#4a7fd4", "#1a2858", t1);
  let c1 = lerpColor("#87b8ef", "#0c1440", t1);
  let c2 = lerpColor("#c8dff8", "#050818", t1);
  if (t2 > 0) { c0 = lerpColor(c0, "#0a0520", t2); c1 = lerpColor(c1, "#1a0840", t2); c2 = lerpColor(c2, "#050510", t2); }
  if (t3 > 0) { c0 = lerpColor(c0, "#2a0848", t3); c1 = lerpColor(c1, "#120830", t3); c2 = lerpColor(c2, "#080418", t3); }
  if (t4 > 0) { c0 = lerpColor(c0, "#100820", t4); c1 = lerpColor(c1, "#050310", t4); c2 = lerpColor(c2, "#000000", t4); }

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c0); g.addColorStop(0.5, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Stars denser higher
  const starAlpha = 0.15 + t1 * 0.85;
  for (const s of stars) {
    const sy = ((s.y - camY * 0.15) % (H + 40) + H + 40) % (H + 40) - 20;
    const tw = 0.5 + 0.5 * Math.sin(performance.now()/400 + s.tw);
    ctx.globalAlpha = starAlpha * s.a * tw;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x, sy, s.r * (0.7 + t2 * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Planet / moon early
  if (t1 < 0.85) {
    const py = H * 0.72 + t1 * 80;
    ctx.globalAlpha = 0.35 * (1 - t1);
    ctx.fillStyle = "#9ad0ff";
    ctx.beginPath(); ctx.arc(W * 0.78, py, 50, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Nebula clouds mid-high
  if (t2 > 0.2) {
    ctx.globalAlpha = 0.12 * t2;
    ctx.fillStyle = t3 > 0.3 ? "#ff44aa" : "#6688ff";
    ctx.beginPath(); ctx.ellipse(W*0.3, H*0.25, 90, 40, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#44ddff";
    ctx.beginPath(); ctx.ellipse(W*0.7, H*0.4, 70, 30, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // Distant sun / black glow late
  if (t4 > 0.1) {
    const glow = ctx.createRadialGradient(W/2, H*0.2, 10, W/2, H*0.2, 120);
    glow.addColorStop(0, `rgba(120,40,180,${0.25*t4})`);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  }
}

function drawAstronaut(atX, atY, scale, rot, skin, opts) {
  opts = opts || {};
  ctx.save();
  ctx.translate(atX, atY);
  ctx.rotate(rot || 0);
  ctx.scale(scale || 1, scale || 1);
  if (opts.ghost) ctx.globalAlpha = 0.75;
  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;

  // jetpack flame
  if (opts.jet) {
    const flicker = 0.7 + 0.3 * Math.sin(performance.now()/50);
    ctx.globalAlpha = flicker * (opts.alpha != null ? opts.alpha : 1);
    ctx.fillStyle = COL.jetpack;
    roundRect(-6, 14, 12, 16, 4); ctx.fill();
    ctx.fillStyle = COL.warning; roundRect(-3.5, 22, 7, 10, 3); ctx.fill();
    ctx.globalAlpha = opts.alpha != null ? opts.alpha : (opts.ghost ? 0.75 : 1);
  }

  // backpack
  roundRect(-14, -6, 10, 18, 3); ctx.fillStyle = skin.pack; ctx.fill();
  roundRect(4, -6, 10, 18, 3); ctx.fill();

  // body / suit
  ctx.beginPath(); ctx.arc(0, 2, 16, 0, Math.PI*2);
  ctx.fillStyle = skin.suit; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.stroke();

  // helmet
  ctx.beginPath(); ctx.arc(0, -6, 14, 0, Math.PI*2);
  ctx.fillStyle = skin.suit; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = 2; ctx.stroke();

  // visor
  roundRect(-9, -12, 18, 12, 6);
  const vg = ctx.createLinearGradient(-9, -12, 9, 0);
  vg.addColorStop(0, skin.visor); vg.addColorStop(1, "#ffffff");
  ctx.fillStyle = vg; ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1; ctx.stroke();

  if (skin.fire) {
    ctx.fillStyle = skin.visor;
    ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(0, -28); ctx.lineTo(6, -20); ctx.fill();
  }
  if (skin.galaxy) {
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 4; i++) {
      const a = i * 1.4 + performance.now()/500;
      ctx.beginPath(); ctx.arc(Math.cos(a)*8, Math.sin(a)*8 - 4, 1.4, 0, Math.PI*2); ctx.fill();
    }
  }
  if (skin.robot) {
    ctx.fillStyle = skin.visor;
    roundRect(-5, 4, 10, 5, 1); ctx.fill();
  }

  // shield
  if (opts.shield) {
    const pulse = 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(performance.now()/400));
    ctx.globalAlpha = pulse;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2);
    ctx.strokeStyle = COL.shield; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "rgba(77,217,255,0.12)"; ctx.fill();
  }
  ctx.restore();
}

function drawPlayer() {
  if (!player) return;
  const sy = worldToScreen(player.y);
  if (sy < -70 || sy > H + 70) return;
  const skin = getSkin();
  drawAstronaut(player.x, sy, player.scaleX, player.rot, skin, {
    jet: hasPower("jetpack") && player.alive,
    shield: hasPower("shield") && player.alive,
    ghost: skin.ghost,
    alpha: player.alive ? undefined : Math.max(0, player.scaleX),
  });
}

function drawPlatform(plat) {
  const sy = worldToScreen(plat.y);
  if (sy < -40 || sy > H + 40) return;
  ctx.save(); ctx.globalAlpha = plat.alpha; ctx.translate(plat.x, sy); ctx.scale(1, plat.scaleY || 1);
  ctx.fillStyle = "rgba(0,0,0,0.25)"; roundRect(-plat.w/2+2, -plat.h/2+3, plat.w, plat.h, plat.h*0.45); ctx.fill();
  ctx.fillStyle = PLAT_COLORS[plat.type] || COL.platNormal;
  roundRect(-plat.w/2, -plat.h/2, plat.w, plat.h, plat.h*0.45); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1.5; ctx.stroke();
  // space panel lines
  ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.beginPath();
  ctx.moveTo(-plat.w*0.25, 0); ctx.lineTo(plat.w*0.25, 0); ctx.stroke();
  if (plat.type === "bonus") {
    ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("★", 0, 1);
  }
  ctx.restore();
}

function drawCoin(coin) {
  const sy = worldToScreen(coin.y + Math.sin(performance.now()/450 + coin.phase)*4);
  if (sy < -30 || sy > H+30) return;
  const spin = 0.2 + 0.8 * Math.abs(Math.sin(performance.now()/350 + coin.phase));
  ctx.save(); ctx.translate(coin.x, sy); ctx.scale(spin, 1);
  ctx.beginPath(); ctx.arc(0,0,coin.r,0,Math.PI*2); ctx.fillStyle = COL.coin; ctx.fill();
  ctx.strokeStyle = "rgba(255,200,50,0.9)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = COL.coinShine; ctx.beginPath(); ctx.arc(-3,-3,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPowerUp(pu) {
  const bob = Math.sin(performance.now()/500 + pu.phase)*6;
  const sy = worldToScreen(pu.y + bob);
  if (sy < -40 || sy > H+40) return;
  ctx.save(); ctx.translate(pu.x, sy);
  const pulse = 0.95 + 0.1*Math.sin(performance.now()/400 + pu.phase);
  ctx.scale(pulse, pulse);
  ctx.globalAlpha = 0.35; ctx.fillStyle = POWER_COLORS[pu.type];
  ctx.beginPath(); ctx.arc(0,0,pu.size*0.7,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; roundRect(-pu.size/2, -pu.size/2, pu.size, pu.size, 8);
  ctx.fillStyle = POWER_COLORS[pu.type]; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(POWER_LETTERS[pu.type], 0, 1); ctx.restore();
}

function drawMonster(m) {
  const sy = worldToScreen(m.y);
  if (sy < -50 || sy > H+50) return;
  ctx.save(); ctx.translate(m.x, sy);
  const bob = Math.sin(m.phase)*2;
  if (m.type === "blob") {
    ctx.translate(0, bob);
    ctx.beginPath(); ctx.ellipse(0, 0, m.r, m.r*0.85, 0, 0, Math.PI*2);
    ctx.fillStyle = "#7dffa0"; ctx.fill();
    ctx.strokeStyle = "#2a8a4a"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#122"; ctx.beginPath(); ctx.arc(-5,-2,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-4,-3,1,0,Math.PI*2); ctx.fill();
  } else if (m.type === "spike") {
    ctx.fillStyle = "#ff5a7a";
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i/6*Math.PI*2 - Math.PI/2;
      const rr = i%2===0 ? m.r+4 : m.r*0.55;
      const fn = i===0 ? ctx.moveTo : ctx.lineTo;
      fn.call(ctx, Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#220010"; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
  } else {
    // UFO
    ctx.fillStyle = "#c0c8d8";
    ctx.beginPath(); ctx.ellipse(0, 0, m.r+4, m.r*0.35, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#6ef";
    ctx.beginPath(); ctx.ellipse(0, -4, m.r*0.55, m.r*0.4, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffd24a";
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i*8, 2, 2, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.restore();
}

function drawBullet(b) {
  const sy = worldToScreen(b.y);
  if (sy < -20 || sy > H+20) return;
  ctx.save();
  ctx.strokeStyle = "#9ef"; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.moveTo(b.x, sy+8); ctx.lineTo(b.x, sy-6); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, sy, b.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#5ef"; ctx.beginPath(); ctx.arc(b.x, sy, b.r*0.55, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const sy = worldToScreen(p.y);
    ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, sy, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawButton(label, x, y, w, h, color, id) {
  addBtn(id, x, y, w, h);
  ctx.save(); roundRect(x-w/2, y-h/2, w, h, 14);
  ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 17px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, x, y+1); ctx.restore();
}

function drawHUD() {
  clearButtons();
  ctx.fillStyle = COL.hudText; ctx.font = "bold 26px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 4;
  ctx.fillText(String(score), 16, 14);
  ctx.font = "600 14px system-ui"; ctx.fillStyle = COL.coin; ctx.fillText("● " + coinsCollected, 16, 44);
  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillText("Best " + bestScore, 16, 64);
  ctx.fillText("↑ " + Math.floor(maxHeight), 16, 84);
  ctx.shadowBlur = 0;
  const powers = [];
  if (hasPower("jetpack")) powers.push("🚀");
  if (hasPower("superBounce")) powers.push("⬆️");
  if (hasPower("shield")) powers.push("🛡️");
  if (hasPower("magnet")) powers.push("🧲");
  if (hasPower("slowdown")) powers.push("⏱️");
  if (powers.length) { ctx.textAlign = "center"; ctx.font = "18px system-ui"; ctx.fillStyle = COL.accent; ctx.fillText(powers.join(" "), W/2, 44); }
  const px = W-36, py = 32;
  addBtn("pause", px, py, 44, 44);
  roundRect(px-22, py-22, 44, 44, 12); ctx.fillStyle = COL.buttonFill; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Ⅱ", px, py+1);
  if (hintAlpha > 0) {
    ctx.globalAlpha = Math.min(1, hintAlpha);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Glisser pour bouger · Clic = tir laser", W/2, H-28);
    ctx.globalAlpha = 1;
  }
}

function drawMenu() {
  clearButtons(); drawSpaceBackground();
  for (const o of menuOrbs) { ctx.globalAlpha = o.a; ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 8;
  ctx.fillStyle = COL.menuTitle; ctx.font = "800 40px system-ui"; ctx.fillText("Lumo Bounce", W/2, H*0.18);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(180,210,255,0.9)"; ctx.font = "500 15px system-ui";
  ctx.fillText("Ascension spatiale · tire sur les aliens", W/2, H*0.18+32);
  const py = H*0.38 + Math.sin(performance.now()/550)*10;
  drawAstronaut(W/2, py, 1.35, Math.sin(performance.now()/900)*0.12, getSkin(), {});
  drawButton("Jouer", W/2, H*0.54, 220, 48, COL.accent, "play");
  drawButton("Boutique", W/2, H*0.63, 220, 46, COL.secondary, "shop");
  drawButton("Meilleur score", W/2, H*0.715, 220, 44, COL.warning, "best");
  drawButton("Paramètres", W/2, H*0.80, 220, 44, COL.primary, "settings");
  ctx.fillStyle = COL.coin; ctx.font = "700 16px system-ui"; ctx.fillText("● " + getWallet() + " pièces", W/2, H*0.90);
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "600 13px system-ui"; ctx.fillText("Record: " + getBest(), W/2, H*0.945);
  if (showBestPanel) {
    clearButtons(); ctx.fillStyle = COL.overlay; ctx.fillRect(0,0,W,H);
    roundRect(W/2-130, H/2-80, 260, 160, 20); ctx.fillStyle = COL.buttonFill; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = COL.menuTitle; ctx.font = "bold 24px system-ui"; ctx.fillText("Meilleur score", W/2, H/2-40);
    ctx.fillStyle = "#fff"; ctx.font = "bold 36px system-ui"; ctx.fillText(String(getBest()), W/2, H/2+10);
    drawButton("OK", W/2, H/2+55, 120, 40, COL.primary, "best");
  }
}

function drawShop() {
  clearButtons(); drawSpaceBackground();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = COL.menuTitle; ctx.font = "bold 30px system-ui"; ctx.fillText("Boutique", W/2, 36);
  ctx.fillStyle = COL.coin; ctx.font = "700 16px system-ui"; ctx.fillText("● " + getWallet(), W/2, 64);
  [["tab_skins","Skins","skins"],["tab_rockets","Fusées","rockets"],["tab_extras","Extras","extras"]].forEach((t,i) => {
    drawButton(t[1], W*0.2+i*W*0.3, 100, 100, 34, shopTab===t[2]?COL.accent:COL.buttonFill, t[0]);
  });
  let items = [];
  if (shopTab === "skins") items = SKINS.map(s => ({ kind:"skin", id:s.id, name:s.name, price:s.price, detail: owns(s.id)?(getEquip().skin===s.id?"Équipé":"Possédé"):(s.price+" ●"), color:s.suit }));
  else if (shopTab === "rockets") items = ROCKETS.map(r => ({ kind:"rocket", id:r.id, name:r.name, price:r.price, detail:"Stock: "+rocketCount(r.id)+" · "+r.desc, color:COL.jetpack }));
  else items = EXTRAS.map(e => ({ kind:"extra", id:e.id, name:e.name, price:e.price, detail:"Stock: "+extraCount(e.id)+" · "+e.desc, color:COL.shield }));
  const visible = 4, start = shopScroll, slice = items.slice(start, start+visible);
  slice.forEach((it, i) => {
    const y = 160 + i * 110;
    roundRect(24, y-42, W-48, 96, 16); ctx.fillStyle = COL.buttonFill; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(56, y, 18, 0, Math.PI*2); ctx.fillStyle = it.color; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.font = "bold 16px system-ui"; ctx.fillText(it.name, 86, y-12);
    ctx.font = "12px system-ui"; ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fillText(it.detail, 86, y+10);
    if (it.kind === "skin") {
      if (owns(it.id)) {
        if (getEquip().skin !== it.id) drawButton("Équiper", W-78, y, 90, 36, COL.primary, "eq_skin_"+it.id);
        else { ctx.textAlign="center"; ctx.fillStyle=COL.accent; ctx.font="bold 13px system-ui"; ctx.fillText("OK", W-78, y); }
      } else drawButton("Acheter", W-78, y, 90, 36, getWallet()>=it.price?COL.warning:"#555", "buy_skin_"+it.id);
    } else if (it.kind === "rocket") drawButton("Acheter", W-78, y, 90, 36, getWallet()>=it.price?COL.warning:"#555", "buy_rocket_"+it.id);
    else drawButton("Acheter", W-78, y, 90, 36, getWallet()>=it.price?COL.warning:"#555", "buy_extra_"+it.id);
  });
  if (start > 0) drawButton("▲", W/2, H-110, 70, 34, COL.buttonFill, "shop_up");
  if (start + visible < items.length) drawButton("▼", W/2, H-72, 70, 34, COL.buttonFill, "shop_down");
  drawButton("Retour", W/2, H-32, 160, 40, COL.primary, "back");
}

function drawSettings() {
  clearButtons(); drawSpaceBackground();
  ctx.textAlign = "center"; ctx.fillStyle = COL.menuTitle; ctx.font = "bold 34px system-ui"; ctx.fillText("Paramètres", W/2, H*0.14);
  ctx.fillStyle = "#fff"; ctx.font = "600 16px system-ui"; ctx.fillText("Contrôles", W/2, H*0.24);
  const mode = getControl();
  drawButton((mode==="touch"?"● ":"○ ")+"Touch / Drag", W/2, H*0.32, 280, 48, COL.buttonFill, "ctrl_touch");
  drawButton((mode==="follow"?"● ":"○ ")+"Suivi pointeur", W/2, H*0.42, 280, 48, COL.buttonFill, "ctrl_follow");
  drawButton((mode==="keys"?"● ":"○ ")+"Clavier A/D · Flèches", W/2, H*0.52, 280, 48, COL.buttonFill, "ctrl_keys");
  drawButton(soundOn?"Son: On":"Son: Off", W/2, H*0.64, 260, 48, COL.buttonFill, "sound");
  drawButton("Retour", W/2, H*0.78, 180, 48, COL.primary, "back");
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "12px system-ui";
  ctx.fillText("Espace = tir laser aussi", W/2, H*0.90);
}

function drawPauseOverlay() {
  ctx.fillStyle = COL.overlay; ctx.fillRect(0,0,W,H);
  roundRect(W/2-130, H/2-130, 260, 260, 20); ctx.fillStyle = COL.buttonFill; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = COL.menuTitle; ctx.font = "bold 32px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("Pause", W/2, H/2-85);
  drawButton("Reprendre", W/2, H/2-25, 180, 44, COL.primary, "resume");
  drawButton("Recommencer", W/2, H/2+35, 180, 44, COL.accent, "restart");
  drawButton("Menu", W/2, H/2+95, 180, 44, COL.secondary, "menu");
}

function drawGameOver() {
  clearButtons(); drawSpaceBackground();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = COL.danger; ctx.font = "800 40px system-ui"; ctx.fillText("Game Over", W/2, H*0.26);
  ctx.fillStyle = "#fff"; ctx.font = "bold 28px system-ui"; ctx.fillText("Score: " + score, W/2, H*0.38);
  ctx.fillStyle = newBestFlag ? COL.warning : COL.accent; ctx.font = "600 20px system-ui";
  ctx.fillText(newBestFlag ? "★ Nouveau record !" : "Record: " + bestScore, W/2, H*0.46);
  ctx.fillStyle = COL.coin; ctx.font = "600 16px system-ui";
  ctx.fillText("+" + coinsCollected + " ●  →  caisse " + getWallet(), W/2, H*0.52);
  drawButton("Rejouer", W/2, H*0.62, 200, 48, COL.accent, "replay");
  drawButton("Boutique", W/2, H*0.71, 200, 44, COL.secondary, "shop");
  drawButton("Menu", W/2, H*0.80, 200, 44, COL.primary, "menu");
}

function drawGame() {
  drawSpaceBackground();
  for (const plat of platforms) drawPlatform(plat);
  for (const coin of coins) drawCoin(coin);
  for (const pu of powerUps) drawPowerUp(pu);
  for (const m of monsters) drawMonster(m);
  for (const b of bullets) drawBullet(b);
  drawParticles(); drawPlayer(); drawHUD();
  if (state === "paused") drawPauseOverlay();
}

function frame(t) {
  const sec = t/1000;
  let dt = lastTime ? Math.min(sec - lastTime, 1/20) : 1/60;
  lastTime = sec;
  if (state === "menu" || state === "settings" || state === "shop") updateMenu(dt);
  else if (state === "playing") updatePlaying(dt);
  if (state === "menu") drawMenu();
  else if (state === "settings") drawSettings();
  else if (state === "shop") drawShop();
  else if (state === "gameover") drawGameOver();
  else drawGame();
  requestAnimationFrame(frame);
}
bestScore = getBest();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
