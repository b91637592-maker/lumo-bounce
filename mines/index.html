<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="description" content="Lumo Mines — roguelike spatial : tire, choisis tes portes, bats les bosses.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumo Mines">
<title>LUMO MINES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#02040c;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 18%,#121a38,#02040c 72%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#frame{position:relative;width:min(100vw,420px);height:min(100vh,100dvh);overflow:hidden;background:#000}
@media(min-width:440px){#frame{border-radius:20px;max-height:min(96vh,900px);height:min(96vh,900px);box-shadow:0 0 80px rgba(80,200,255,.28),0 0 0 1px rgba(255,255,255,.08)}}
@media all and (display-mode:standalone){#frame{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050814;color:#9ecbff;font:700 14px system-ui;z-index:3}
#ver{position:absolute;top:6px;right:8px;z-index:4;font:600 9px/1 system-ui;color:rgba(180,210,255,.45);pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><div id="frame">
<div id="load">Chargement de Lumo Mines…</div>
<div id="ver">lumo-mines-v1-20260913</div>
<canvas id="c"></canvas>
</div></div>
<script>
(() => {
"use strict";
const VER = "lumo-mines-v1-20260913";
const BEST_KEY = "lumoMinesBest";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const loadEl = document.getElementById("load");

const W = 390, H = 700;
let dpr = 1, scale = 1;

const imgs = {astro:null, green:null, purple:null, spiky:null};
let assetsReady = false;

function loadImg(src){
  return new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=()=>rej(new Error(src));
    i.src=src;
  });
}

Promise.all([
  loadImg("astro.png").then(i=>imgs.astro=i),
  loadImg("monsters/green_eye.png").then(i=>imgs.green=i).catch(()=>null),
  loadImg("monsters/purple_blob.png").then(i=>imgs.purple=i).catch(()=>null),
  loadImg("monsters/spiky_grey.png").then(i=>imgs.spiky=i).catch(()=>null),
]).then(()=>{assetsReady=true;loadEl.style.display="none";}).catch(()=>{
  assetsReady=true;loadEl.textContent="Sprites partiels — jeu prêt";
  setTimeout(()=>loadEl.style.display="none",600);
});

function resize(){
  const fr=document.getElementById("frame");
  const rw=fr.clientWidth, rh=fr.clientHeight;
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  canvas.width=Math.floor(rw*dpr);
  canvas.height=Math.floor(rh*dpr);
  scale=Math.min(rw/W, rh/H);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,(rw-W*scale)*dpr/2,(rh-H*scale)*dpr/2);
}
window.addEventListener("resize",resize);
resize();

// ——— RNG ———
function rand(a,b){return a+Math.random()*(b-a);}
function irand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ——— Stars ———
const stars=[];
for(let i=0;i<90;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,a:Math.random()*.7+.2,sp:Math.random()*12+4});
}

// ——— Input ———
const input={down:false,x:0,y:0,px:0,py:0,drag:false,tapShoot:false};
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/(dpr||1)/W;
  const sy=canvas.height/(dpr||1)/H;
  // account for letterbox centering
  const fr=document.getElementById("frame");
  const rw=fr.clientWidth, rh=fr.clientHeight;
  const sc=Math.min(rw/W,rh/H);
  const ox=(rw-W*sc)/2, oy=(rh-H*sc)/2;
  const cx=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-r.left;
  const cy=(e.clientY!==undefined?e.clientY:e.touches[0].clientY)-r.top;
  return {x:(cx-ox)/sc, y:(cy-oy)/sc};
}
function onDown(e){
  e.preventDefault();
  const p=pointerPos(e);
  input.down=true;input.x=p.x;input.y=p.y;input.px=p.x;input.py=p.y;input.drag=false;
  if(state==="room"||state==="boss"){
    if(p.y < H*0.72) input.tapShoot=true;
  }
}
function onMove(e){
  e.preventDefault();
  if(!input.down) return;
  const p=pointerPos(e);
  if(Math.abs(p.x-input.px)>6||Math.abs(p.y-input.py)>6) input.drag=true;
  input.x=p.x;input.y=p.y;
}
function onUp(e){
  e.preventDefault();
  const p=pointerPos(e.changedTouches?e.changedTouches[0]:e);
  handleTap(p.x,p.y,!input.drag);
  input.down=false;input.drag=false;
}
canvas.addEventListener("mousedown",onDown);
canvas.addEventListener("mousemove",onMove);
canvas.addEventListener("mouseup",onUp);
canvas.addEventListener("mouseleave",()=>{input.down=false;});
canvas.addEventListener("touchstart",onDown,{passive:false});
canvas.addEventListener("touchmove",onMove,{passive:false});
canvas.addEventListener("touchend",onUp,{passive:false});

// ——— Game state ———
let state="menu"; // menu | room | doorChoice | boss | gameover
let depth=0, coins=0, kills=0, best=0;
try{best=parseInt(localStorage.getItem(BEST_KEY)||"0",10)||0;}catch(_){}

const player={
  x:W/2,y:H-90,w:44,h:52,hp:5,maxHp:5,
  fireCd:0,fireRate:0.32,damage:1,shield:0,
  inv:0,flash:0
};
let bullets=[], eBullets=[], enemies=[], particles=[], toasts=[], doors=[];
let roomClear=false, roomTimer=0, clearDelay=0, shake=0, bossMode=false;
let menuPulse=0;

const DOOR_DEFS=[
  {id:"combat", label:"COMBAT", sub:"Prochaine salle", color:"#ff6b5a", icon:"⚔"},
  {id:"soin", label:"SOIN", sub:"+2 PV", color:"#3dff9a", icon:"♥"},
  {id:"upgrade", label:"UPGRADE", sub:"Arme / cadence", color:"#5ac8ff", icon:"⬆"},
  {id:"maxhp", label:"VITALITÉ", sub:"+1 PV max", color:"#ff7ac8", icon:"✦"},
  {id:"coins", label:"RICHESSE", sub:"+5 pièces", color:"#ffd24a", icon:"◉"},
  {id:"shield", label:"BOUCLIER", sub:"1 charge", color:"#a78bff", icon:"◈"},
  {id:"mystery", label:"MYSTÈRE", sub:"???", color:"#c0c8e0", icon:"?"},
];

function resetPlayerStats(){
  player.hp=5;player.maxHp=5;player.fireRate=0.32;player.damage=1;
  player.shield=0;player.inv=0;player.flash=0;
  player.x=W/2;player.y=H-90;
}
function startRun(){
  depth=0;coins=0;kills=0;
  resetPlayerStats();
  bullets=[];eBullets=[];enemies=[];particles=[];toasts=[];doors=[];
  roomClear=false;bossMode=false;
  enterRoom(false);
}
function enterRoom(isBoss){
  depth++;
  bossMode=!!isBoss;
  state=isBoss?"boss":"room";
  bullets=[];eBullets=[];enemies=[];doors=[];
  roomClear=false;roomTimer=0;clearDelay=0;
  player.x=W/2;player.y=H-90;player.inv=0.6;
  spawnEnemies(isBoss);
  addToast(isBoss?"⚠ BOSS !":"Salle "+depth, isBoss?"#ff6b5a":"#9ecbff");
}
function spawnEnemies(isBoss){
  enemies=[];
  if(isBoss){
    enemies.push(makeEnemy("boss", W/2, 140, depth));
    // adds
    const n=1+Math.floor(depth/10);
    for(let i=0;i<n;i++){
      enemies.push(makeEnemy(pick(["green","purple","spiky"]), 70+i*((W-140)/Math.max(1,n-1)), 220+irand(0,40), depth));
    }
    return;
  }
  const base=2+Math.floor(depth/2);
  const count=clamp(base+irand(0,1),2,7);
  for(let i=0;i<count;i++){
    const kind=pick(["green","purple","spiky"]);
    const x=50+Math.random()*(W-100);
    const y=80+Math.random()*220;
    enemies.push(makeEnemy(kind,x,y,depth));
  }
}
function makeEnemy(kind,x,y,d){
  const scaleHp=1+(d-1)*0.18;
  const scaleDmg=1+(d-1)*0.08;
  if(kind==="boss"){
    return {
      kind:"boss",x,y,w:72,h:72,hp:Math.round(18*scaleHp),maxHp:Math.round(18*scaleHp),
      vx:rand(-40,40),vy:0,shotCd:1.2,shotRate:1.4,dmg:2*scaleDmg,
      phase:Math.random()*Math.PI*2,alive:true,tint:"#ff4466"
    };
  }
  const stats={
    green:{w:40,h:40,hp:2,spd:35,shot:1.8,dmg:1,tint:"#5dff8a"},
    purple:{w:44,h:40,hp:3,spd:25,shot:2.2,dmg:1,tint:"#c06bff"},
    spiky:{w:42,h:42,hp:4,spd:45,shot:2.6,dmg:1,tint:"#9aa3b5"},
  }[kind]||{w:40,h:40,hp:2,spd:30,shot:2,dmg:1,tint:"#fff"};
  return {
    kind,x,y,w:stats.w,h:stats.h,
    hp:Math.max(1,Math.round(stats.hp*scaleHp)),
    maxHp:Math.max(1,Math.round(stats.hp*scaleHp)),
    vx:rand(-stats.spd,stats.spd),vy:rand(-20,20),
    shotCd:rand(0.4,stats.shot),shotRate:stats.shot,
    dmg:stats.dmg*scaleDmg,phase:Math.random()*6,alive:true,tint:stats.tint
  };
}

function addToast(text,color){
  toasts.push({text,color:color||"#fff",x:W/2,y:H*0.42,life:1.4,vy:-28});
}
function burst(x,y,col,n){
  for(let i=0;i<(n||10);i++){
    particles.push({
      x,y,vx:rand(-90,90),vy:rand(-120,40),r:rand(1.5,3.5),
      life:rand(.3,.8),max:1,col:col||"#fff"
    });
  }
}
function floatText(x,y,text,col){
  toasts.push({text,color:col||"#ffd24a",x,y,life:0.9,vy:-40});
}

function openDoors(){
  state="doorChoice";
  doors=[];
  const pool=DOOR_DEFS.slice();
  // always include combat-ish options mix
  const chosen=[];
  // guarantee one combat-like
  chosen.push(pool[0]);
  // pick 2 more unique
  const rest=pool.slice(1);
  for(let i=0;i<2;i++){
    const idx=irand(0,rest.length-1);
    chosen.push(rest.splice(idx,1)[0]);
  }
  // shuffle
  for(let i=chosen.length-1;i>0;i--){
    const j=irand(0,i);const t=chosen[i];chosen[i]=chosen[j];chosen[j]=t;
  }
  const positions=[W*0.2,W*0.5,W*0.8];
  for(let i=0;i<3;i++){
    doors.push({...chosen[i], x:positions[i], y:H*0.42, w:96, h:130, hover:false});
  }
  addToast("Choisis une porte", "#ffd24a");
}

function applyDoor(d){
  let nextBoss=(depth%5===0); // after clearing room N where N%5===0, next is boss? 
  // Spec: every 5 rooms → boss. So after rooms 5,10,15...
  // When we clear room and pick door, we go to next room. If next depth would be multiple of 5, boss.
  // Actually: "Every 5 rooms → Boss room". So rooms 5,10,15 are bosses.
  // Current depth is the room we just cleared. Next enterRoom increments depth.
  // So if depth+1 is multiple of 5, next is boss.
  const willBeBoss=((depth+1)%5===0);

  switch(d.id){
    case "combat":
      addToast("En avant !", "#ff6b5a");
      break;
    case "soin":
      player.hp=Math.min(player.maxHp, player.hp+2);
      addToast("+2 PV", "#3dff9a");
      burst(player.x,player.y,"#3dff9a",14);
      break;
    case "upgrade":{
      if(Math.random()<0.5){
        player.fireRate=Math.max(0.12, player.fireRate*0.85);
        addToast("Cadence ↑", "#5ac8ff");
      } else {
        player.damage+=0.5;
        addToast("Dégâts ↑", "#5ac8ff");
      }
      break;
    }
    case "maxhp":
      player.maxHp+=1;
      player.hp+=1;
      addToast("PV max +1", "#ff7ac8");
      break;
    case "coins":
      coins+=5;
      addToast("+5 pièces", "#ffd24a");
      break;
    case "shield":
      player.shield=Math.min(2, player.shield+1);
      addToast("Bouclier +1", "#a78bff");
      break;
    case "mystery":{
      const r=Math.random();
      if(r<0.25){player.hp=Math.min(player.maxHp,player.hp+3);addToast("Mystère : soin !","#3dff9a");}
      else if(r<0.45){player.damage+=0.5;addToast("Mystère : puissance !","#5ac8ff");}
      else if(r<0.65){coins+=8;addToast("Mystère : trésor !","#ffd24a");}
      else if(r<0.8){player.shield+=1;addToast("Mystère : bouclier !","#a78bff");}
      else if(r<0.9){player.hp=Math.max(1,player.hp-1);addToast("Mystère : piège…","#ff6b5a");}
      else {player.fireRate=Math.max(0.12,player.fireRate*0.8);addToast("Mystère : turbo tir !","#fff");}
      break;
    }
  }
  enterRoom(willBeBoss);
}

function hurtPlayer(dmg){
  if(player.inv>0) return;
  if(player.shield>0){
    player.shield--;
    player.inv=0.8;
    player.flash=0.3;
    addToast("Bouclier !", "#a78bff");
    burst(player.x,player.y,"#a78bff",12);
    shake=8;
    return;
  }
  player.hp-=dmg;
  player.inv=1.0;
  player.flash=0.35;
  shake=12;
  burst(player.x,player.y,"#ff6b5a",10);
  if(player.hp<=0){
    player.hp=0;
    gameOver();
  }
}
function gameOver(){
  state="gameover";
  if(depth>best){
    best=depth;
    try{localStorage.setItem(BEST_KEY,String(best));}catch(_){}
  }
  addToast("Fin de mission", "#ff6b5a");
}

function shoot(){
  const ang=-Math.PI/2;
  // aim slightly toward finger if tap in upper area
  let dx=0, dy=-1;
  if(input.tapShoot){
    dx=input.x-player.x;
    dy=input.y-player.y;
    const len=Math.hypot(dx,dy)||1;
    dx/=len;dy/=len;
    if(dy> -0.2){dx=0;dy=-1;} // mostly upward
  }
  bullets.push({
    x:player.x, y:player.y-player.h*0.35,
    vx:dx*520, vy:dy*520,
    r:4, dmg:player.damage, life:1.4
  });
  player.fireCd=player.fireRate;
  input.tapShoot=false;
}

function hitRect(ax,ay,aw,ah,bx,by,bw,bh){
  return Math.abs(ax-bx)<(aw+bw)/2 && Math.abs(ay-by)<(ah+bh)/2;
}

function handleTap(x,y,wasTap){
  if(state==="menu"){
    // Jouer button
    if(y>H*0.58 && y<H*0.68 && x>W*0.2 && x<W*0.8){
      startRun();
    }
    return;
  }
  if(state==="gameover"){
    if(y>H*0.62 && y<H*0.72 && x>W*0.2 && x<W*0.8){
      state="menu";
    }
    return;
  }
  if(state==="doorChoice" && wasTap){
    for(const d of doors){
      if(Math.abs(x-d.x)<d.w/2 && Math.abs(y-d.y)<d.h/2){
        applyDoor(d);
        return;
      }
    }
  }
}

// ——— Update ———
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  menuPulse+=dt;
  // stars
  for(const s of stars){
    s.y+=s.sp*dt*0.35;
    if(s.y>H){s.y=0;s.x=Math.random()*W;}
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;
    if(p.life<=0) particles.splice(i,1);
  }
  // toasts
  for(let i=toasts.length-1;i>=0;i--){
    const t=toasts[i];
    t.life-=dt;t.y+=t.vy*dt;
    if(t.life<=0) toasts.splice(i,1);
  }
  if(shake>0) shake=Math.max(0,shake-dt*40);

  if(state!=="room" && state!=="boss") return;

  roomTimer+=dt;
  if(player.inv>0) player.inv-=dt;
  if(player.flash>0) player.flash-=dt;
  if(player.fireCd>0) player.fireCd-=dt;

  // move player — drag or touch X on bottom half
  if(input.down){
    if(input.y > H*0.55 || input.drag){
      const target=clamp(input.x, 28, W-28);
      player.x += (target-player.x)*Math.min(1,12*dt);
    }
  }
  player.x=clamp(player.x,28,W-28);

  // auto-fire (tap in upper area briefly aims next shot)
  if(player.fireCd<=0){
    shoot();
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.y<-20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    for(const e of enemies){
      if(!e.alive) continue;
      if(hitRect(b.x,b.y,b.r*2,b.r*2,e.x,e.y,e.w,e.h)){
        e.hp-=b.dmg;
        burst(b.x,b.y,"#7ad7ff",6);
        floatText(e.x,e.y-20,"-"+b.dmg.toFixed(b.dmg%1?1:0),"#7ad7ff");
        bullets.splice(i,1);
        if(e.hp<=0){
          e.alive=false;
          kills++;
          coins+=e.kind==="boss"?5:1;
          burst(e.x,e.y,e.tint,20);
          floatText(e.x,e.y,e.kind==="boss"?"BOSS ↓":"+1","#ffd24a");
        }
        break;
      }
    }
  }

  // enemies
  let aliveCount=0;
  for(const e of enemies){
    if(!e.alive) continue;
    aliveCount++;
    e.phase+=dt;
    e.x+=e.vx*dt;
    e.y+=Math.sin(e.phase*2)*18*dt + e.vy*dt;
    if(e.x<40||e.x>W-40) e.vx*=-1;
    if(e.y<60) e.y=60;
    if(e.y>H*0.55){e.y=H*0.55;e.vy*=-1;}
    // shoot
    e.shotCd-=dt;
    if(e.shotCd<=0){
      e.shotCd=e.shotRate*(0.7+Math.random()*0.5);
      const dx=player.x-e.x, dy=player.y-e.y;
      const len=Math.hypot(dx,dy)||1;
      const sp=e.kind==="boss"?160:120;
      eBullets.push({x:e.x,y:e.y+e.h*0.2,vx:(dx/len)*sp,vy:(dy/len)*sp,r:5,dmg:e.dmg,life:3});
      if(e.kind==="boss"){
        // spread
        for(let k=-1;k<=1;k+=2){
          const a=Math.atan2(dy,dx)+k*0.35;
          eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp*0.85,vy:Math.sin(a)*sp*0.85,r:4,dmg:e.dmg,life:3});
        }
      }
    }
    // contact damage
    if(hitRect(player.x,player.y,player.w*0.7,player.h*0.7,e.x,e.y,e.w,e.h)){
      hurtPlayer(e.dmg);
    }
  }

  // enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.y>H+30||b.y<-30||b.x<-30||b.x>W+30){eBullets.splice(i,1);continue;}
    if(hitRect(b.x,b.y,b.r*2,b.r*2,player.x,player.y,player.w*0.65,player.h*0.65)){
      hurtPlayer(b.dmg);
      eBullets.splice(i,1);
      burst(b.x,b.y,"#ff8866",5);
    }
  }

  // clear room
  if(!roomClear && aliveCount===0 && roomTimer>0.5){
    roomClear=true;
    clearDelay=0.7;
    coins+=1; // room clear bonus
    addToast("Salle nettoyée !", "#3dff9a");
  }
  if(roomClear && clearDelay>0){
    clearDelay-=dt;
    if(clearDelay<=0){
      clearDelay=0;
      if(state==="room"||state==="boss") openDoors();
    }
  }
}

// ——— Draw ———
function draw(){
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }
  // background
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#060a18");
  g.addColorStop(0.5,"#0a1430");
  g.addColorStop(1,"#050810");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // stars
  for(const s of stars){
    ctx.globalAlpha=s.a*(0.6+0.4*Math.sin(menuPulse*2+s.x));
    ctx.fillStyle="#cfe6ff";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // mine glow / floor
  drawFloor();

  if(state==="menu") drawMenu();
  else if(state==="gameover") drawGameOver();
  else {
    drawHUD();
    if(state==="doorChoice") drawDoors();
    else {
      drawEnemies();
      drawBullets();
      drawPlayer();
    }
  }

  // particles & toasts always
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/0.6);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const t of toasts){
    ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.font="700 16px system-ui";
    ctx.textAlign="center";
    ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=8;
    ctx.fillText(t.text,t.x,t.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawFloor(){
  const fy=H-48;
  const fg=ctx.createLinearGradient(0,fy-40,0,H);
  fg.addColorStop(0,"rgba(40,180,255,0)");
  fg.addColorStop(0.5,"rgba(40,160,255,0.12)");
  fg.addColorStop(1,"rgba(20,80,160,0.35)");
  ctx.fillStyle=fg;
  ctx.fillRect(0,fy-40,W,H-(fy-40));
  // glowing platform line
  ctx.strokeStyle="rgba(100,220,255,0.55)";
  ctx.lineWidth=2;
  ctx.shadowColor="#4cf";ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.moveTo(20,fy);
  ctx.lineTo(W-20,fy);
  ctx.stroke();
  ctx.shadowBlur=0;
  // panels
  ctx.fillStyle="rgba(30,60,100,0.35)";
  for(let i=0;i<6;i++){
    const px=30+i*58;
    ctx.fillRect(px,fy+6,48,14);
    ctx.strokeStyle="rgba(80,180,255,0.25)";
    ctx.strokeRect(px,fy+6,48,14);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawMenu(){
  // title
  ctx.textAlign="center";
  ctx.font="800 42px system-ui";
  const tg=ctx.createLinearGradient(0,H*0.18,0,H*0.28);
  tg.addColorStop(0,"#9ef0ff");
  tg.addColorStop(1,"#4a9fff");
  ctx.fillStyle=tg;
  ctx.shadowColor="#3cf";ctx.shadowBlur=18;
  ctx.fillText("LUMO MINES", W/2, H*0.24);
  ctx.shadowBlur=0;

  ctx.font="600 13px system-ui";
  ctx.fillStyle="rgba(180,210,255,0.75)";
  ctx.fillText("Roguelike spatial • Mines profondes", W/2, H*0.30);

  // astronaut preview
  if(imgs.astro){
    const s=Math.min(90/imgs.astro.width,100/imgs.astro.height);
    const aw=imgs.astro.width*s, ah=imgs.astro.height*s;
    ctx.drawImage(imgs.astro, W/2-aw/2, H*0.34, aw, ah);
  } else {
    ctx.fillStyle="#8cf";
    ctx.beginPath();ctx.arc(W/2,H*0.42,28,0,Math.PI*2);ctx.fill();
  }

  // how-to
  ctx.font="500 12px system-ui";
  ctx.fillStyle="rgba(200,220,255,0.7)";
  const lines=[
    "Glisse pour te déplacer",
    "Tir automatique vers le haut",
    "Élimine les ennemis → choisis une porte",
    "Boss toutes les 5 salles",
  ];
  lines.forEach((l,i)=>ctx.fillText(l, W/2, H*0.50+i*18));

  // Jouer button
  const by=H*0.63, bw=180, bh=48;
  const pulse=0.92+0.08*Math.sin(menuPulse*3);
  ctx.save();
  ctx.translate(W/2,by);ctx.scale(pulse,pulse);ctx.translate(-W/2,-by);
  roundRect(W/2-bw/2, by-bh/2, bw, bh, 14);
  const bg=ctx.createLinearGradient(0,by-bh/2,0,by+bh/2);
  bg.addColorStop(0,"#3dffc0");bg.addColorStop(1,"#1aa878");
  ctx.fillStyle=bg;
  ctx.fill();
  ctx.fillStyle="#032918";
  ctx.font="800 20px system-ui";
  ctx.fillText("JOUER", W/2, by+7);
  ctx.restore();

  ctx.font="600 12px system-ui";
  ctx.fillStyle="rgba(255,210,80,0.85)";
  ctx.fillText("Meilleure profondeur : "+best, W/2, H*0.74);

  ctx.font="500 10px system-ui";
  ctx.fillStyle="rgba(150,180,220,0.45)";
  ctx.fillText(VER, W/2, H*0.92);
}

function drawGameOver(){
  ctx.textAlign="center";
  ctx.font="800 34px system-ui";
  ctx.fillStyle="#ff6b5a";
  ctx.shadowColor="#f44";ctx.shadowBlur=16;
  ctx.fillText("MISSION ÉCHOUÉE", W/2, H*0.28);
  ctx.shadowBlur=0;

  ctx.font="600 16px system-ui";
  ctx.fillStyle="#cfe6ff";
  ctx.fillText("Profondeur : "+depth, W/2, H*0.40);
  ctx.fillText("Éliminations : "+kills, W/2, H*0.45);
  ctx.fillText("Pièces : "+coins, W/2, H*0.50);
  ctx.fillStyle="#ffd24a";
  ctx.fillText("Record : "+best, W/2, H*0.56);

  const by=H*0.67, bw=180, bh=48;
  roundRect(W/2-bw/2, by-bh/2, bw, bh, 14);
  ctx.fillStyle="#3dffc0";
  ctx.fill();
  ctx.fillStyle="#032918";
  ctx.font="800 18px system-ui";
  ctx.fillText("REJOUER", W/2, by+6);
}

function drawHUD(){
  // HP bar
  const hx=16,hy=16,hw=120,hh=12;
  ctx.fillStyle="rgba(0,0,0,0.45)";
  roundRect(hx-2,hy-2,hw+4,hh+4,6);ctx.fill();
  ctx.fillStyle="#1a2030";
  roundRect(hx,hy,hw,hh,5);ctx.fill();
  const pct=player.maxHp>0?player.hp/player.maxHp:0;
  const hg=ctx.createLinearGradient(hx,0,hx+hw,0);
  hg.addColorStop(0,"#3dff9a");hg.addColorStop(1,"#1fd492");
  if(pct<0.35){hg.addColorStop(0,"#ff6b5a");hg.addColorStop(1,"#ff3344");}
  ctx.fillStyle=hg;
  roundRect(hx,hy,hw*pct,hh,5);ctx.fill();
  ctx.font="700 10px system-ui";
  ctx.textAlign="left";
  ctx.fillStyle="#fff";
  ctx.fillText("PV "+Math.ceil(player.hp)+"/"+player.maxHp, hx+4, hy+hh+14);

  // depth / coins
  ctx.textAlign="right";
  ctx.font="700 13px system-ui";
  ctx.fillStyle="#9ecbff";
  ctx.fillText("Salle "+depth+(bossMode?" ⚠":""), W-16, 26);
  ctx.fillStyle="#ffd24a";
  ctx.fillText("◉ "+coins, W-16, 44);
  if(player.shield>0){
    ctx.fillStyle="#a78bff";
    ctx.fillText("◈×"+player.shield, W-16, 62);
  }
  // upgrades tiny
  ctx.textAlign="left";
  ctx.font="600 10px system-ui";
  ctx.fillStyle="rgba(180,210,255,0.55)";
  ctx.fillText("DMG "+player.damage.toFixed(1)+"  CAD "+(1/player.fireRate).toFixed(1)+"/s", 16, 48);
}

function drawPlayer(){
  const blink=player.inv>0 && Math.floor(player.inv*12)%2===0;
  if(blink) ctx.globalAlpha=0.4;
  if(imgs.astro){
    const s=Math.min(player.w/imgs.astro.width, player.h/imgs.astro.height);
    const aw=imgs.astro.width*s, ah=imgs.astro.height*s;
    ctx.drawImage(imgs.astro, player.x-aw/2, player.y-ah/2, aw, ah);
  } else {
    ctx.fillStyle="#8cf";
    ctx.beginPath();ctx.arc(player.x,player.y,20,0,Math.PI*2);ctx.fill();
  }
  if(player.flash>0){
    ctx.globalAlpha=player.flash;
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(player.x,player.y,22,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(player.shield>0){
    ctx.strokeStyle="rgba(167,139,255,0.7)";
    ctx.lineWidth=2;
    ctx.shadowColor="#a78bff";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(player.x,player.y,28,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }
}

function enemySprite(kind){
  if(kind==="green") return imgs.green;
  if(kind==="purple") return imgs.purple;
  if(kind==="spiky"||kind==="boss") return imgs.spiky;
  return null;
}

function drawEnemies(){
  for(const e of enemies){
    if(!e.alive) continue;
    const spr=enemySprite(e.kind);
    if(spr){
      const s=Math.min(e.w/spr.width, e.h/spr.height)*(e.kind==="boss"?1.15:1);
      const aw=spr.width*s, ah=spr.height*s;
      if(e.kind==="boss"){
        ctx.shadowColor="#f46";ctx.shadowBlur=16;
      }
      ctx.drawImage(spr, e.x-aw/2, e.y-ah/2, aw, ah);
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle=e.tint;
      ctx.beginPath();ctx.arc(e.x,e.y,e.w/2,0,Math.PI*2);ctx.fill();
    }
    // hp bar
    if(e.hp<e.maxHp){
      const bw=e.w, bh=4;
      ctx.fillStyle="rgba(0,0,0,0.5)";
      ctx.fillRect(e.x-bw/2,e.y-e.h/2-10,bw,bh);
      ctx.fillStyle="#3dff9a";
      ctx.fillRect(e.x-bw/2,e.y-e.h/2-10,bw*(e.hp/e.maxHp),bh);
    }
  }
}

function drawBullets(){
  for(const b of bullets){
    ctx.fillStyle="#7ad7ff";
    ctx.shadowColor="#4cf";ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // trail
    ctx.strokeStyle="rgba(120,220,255,0.4)";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.02,b.y-b.vy*0.02);ctx.stroke();
  }
  for(const b of eBullets){
    ctx.fillStyle="#ff7755";
    ctx.shadowColor="#f64";ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawDoors(){
  ctx.textAlign="center";
  ctx.font="700 18px system-ui";
  ctx.fillStyle="#ffd24a";
  ctx.fillText("Choisis ta porte", W/2, H*0.22);
  ctx.font="500 12px system-ui";
  ctx.fillStyle="rgba(200,220,255,0.65)";
  ctx.fillText("Touche une porte pour continuer", W/2, H*0.26);

  // still show player at bottom
  drawPlayer();

  for(const d of doors){
    const bob=Math.sin(menuPulse*2.5+d.x)*4;
    const x=d.x, y=d.y+bob;
    // door frame
    ctx.shadowColor=d.color;ctx.shadowBlur=18;
    roundRect(x-d.w/2, y-d.h/2, d.w, d.h, 12);
    const dg=ctx.createLinearGradient(x,y-d.h/2,x,y+d.h/2);
    dg.addColorStop(0,"rgba(20,30,50,0.95)");
    dg.addColorStop(1,"rgba(10,14,28,0.98)");
    ctx.fillStyle=dg;
    ctx.fill();
    ctx.strokeStyle=d.color;
    ctx.lineWidth=2.5;
    ctx.stroke();
    ctx.shadowBlur=0;

    // inner glow
    ctx.fillStyle=d.color;
    ctx.globalAlpha=0.15;
    roundRect(x-d.w/2+8, y-d.h/2+8, d.w-16, d.h-16, 8);
    ctx.fill();
    ctx.globalAlpha=1;

    ctx.font="28px system-ui";
    ctx.fillStyle=d.color;
    ctx.fillText(d.icon, x, y-18);
    ctx.font="800 13px system-ui";
    ctx.fillText(d.label, x, y+14);
    ctx.font="600 10px system-ui";
    ctx.fillStyle="rgba(220,230,255,0.75)";
    ctx.fillText(d.sub, x, y+32);
  }
}

requestAnimationFrame(loop);
})();
</script>
</body>
